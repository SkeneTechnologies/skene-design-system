name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # tokens:check, tokens:contrast, tests, build.
      - name: Verify
        run: npm run verify

      # dist/ and the generated CSS are committed, because git-dependency
      # installs need them present at the tag and there is no `prepare` script
      # to build on install. Committed generated output is only trustworthy if
      # something proves it matches its source.
      - name: Generated output is honest
        run: |
          npm run tokens
          npm run build
          git diff --exit-code -- dist styles/tokens.css src/tokens \
            || { echo "::error::dist/ or generated CSS is stale. Run 'npm run build' and commit."; exit 1; }

      # 20 of the 30 primitives are client components. A build step that drops
      # the directive produces "You're importing a component that needs
      # useState" in the consumer, far from the cause. This is why the build is
      # tsc and not a bundler, so it is worth asserting rather than trusting.
      - name: '"use client" survives the build'
        run: |
          lost=0
          for src in src/ui/*.tsx; do
            head -1 "$src" | grep -q '"use client"' || continue
            out="dist/ui/$(basename "${src%.tsx}").js"
            head -1 "$out" | grep -q '"use client"' || { echo "::error file=$out::lost \"use client\""; lost=1; }
          done
          head -1 dist/index.js | grep -q '"use client"' \
            && { echo "::error::barrel is client-poisoned; Card/Badge/Table/Alert would stop being server-renderable"; lost=1; }
          exit $lost

  changeset:
    # The point is not automation, it is the gate: state the bump type at
    # authoring time. Skipping that discipline is how 145 tokens got hand-pasted
    # between two repos and then silently diverged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A changeset is required for source changes
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          touches_source=$(echo "$changed" | grep -E '^(src/|styles/|design-tokens\.json)' || true)
          has_changeset=$(echo "$changed" | grep -E '^\.changeset/.*\.md$' || true)
          if [ -n "$touches_source" ] && [ -z "$has_changeset" ]; then
            echo "::error::This PR changes src/, styles/ or design-tokens.json without a changeset."
            echo "Run 'npx changeset' and state the bump type. Consumers read these tokens by name;"
            echo "a rename or a removal is a major, and TypeScript cannot catch it for them."
            exit 1
          fi
          echo "ok"

  visual:
    # Runs in the same container the baselines were generated in, so the
    # compared bytes come from an identical font stack. Baselines are committed
    # as *-linux.png; a stray macOS run writes *-darwin.png, which is gitignored
    # rather than allowed to overwrite them.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --include=dev is not belt-and-braces. This job sets NODE_ENV=production
      # for the whole job, because `next build` emits a hybrid bundle that
      # crashes prerendering without it — and npm ci under NODE_ENV=production
      # skips devDependencies, so `npm run build` died on `tsx: not found`.
      # Scoping the env to the build step instead would work, but the Playwright
      # run needs it too; asking for dev deps explicitly is the smaller change.
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: docs-app
      - run: npx playwright test
        working-directory: docs-app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: package-visual-report
          path: docs-app/test-results/
          retention-days: 14

  chromatic:
    # Hosted visual review of the Storybook, which is a different question from
    # the `visual` job above and does not replace it.
    #
    #   `visual`  compares committed PNGs of whole SECTIONS in composition,
    #             byte-for-byte, in a pinned container. It answers "did this
    #             change anything", with no opinion about whether the change is
    #             good, and it fails hard.
    #   Chromatic diffs the same stories a human can then OPEN, at every state
    #             the args expose, and asks someone to accept or reject. It
    #             answers "is this change intended".
    #
    # The second is what was missing when two paragraphs shipped at 1.00:1: the
    # composition that produced it was rendered by no test at any width, so
    # there was nothing for a diff to move. `stories/feature-row.stories.tsx`
    # now renders exactly that case.
    #
    # `--exit-zero-on-changes` is deliberate and is the reason this job is
    # advisory. A visual change is a question for a reviewer, not a build
    # failure; the build already fails on the things that are unambiguously
    # wrong. Chromatic's own UI is where a change gets accepted, and it blocks
    # the PR through its own required check rather than through this exit code.
    runs-on: ubuntu-latest
    # Skips cleanly on forks, where secrets are not available and the run would
    # fail with an authentication error that reads like a real defect.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Job level, not step level, and that placement is the whole trick: a step's
    # `if:` is evaluated BEFORE that step's own `env:` is applied, so a token
    # declared on the step is empty to the step's own condition and the guard
    # below would always take the "no token" branch. The `secrets` context is
    # not readable from `if:` at all, which is why it is lifted here first.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic reads git history to find the baseline commit. A shallow
          # clone makes every build look like the first one, so every story
          # reports as new and the diff is worthless.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Stories import through `@skene/design-system/...`, which resolves to
      # `dist/`. Without a build the Storybook renders the committed dist and a
      # source-only change is invisible to the diff — the exact failure this
      # job exists to prevent.
      - run: npm run build
      - name: Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        run: npx chromatic --exit-zero-on-changes
      - name: No Chromatic token
        if: ${{ env.CHROMATIC_PROJECT_TOKEN == '' }}
        run: |
          echo "::notice::CHROMATIC_PROJECT_TOKEN is not set, so visual review did not run."
          echo "Create the project at chromatic.com against this repository and add the"
          echo "token as a repository secret. Until then the Storybook still builds below,"
          echo "so a broken story is caught here even without the hosted diff."
      # Runs whether or not the token exists: a story that throws is a defect in
      # the package, and it should fail here rather than in a reviewer's browser.
      - run: npm run storybook:build

      # Building a story is not running it. A story that type-checks and bundles
      # can still throw on mount, and it caught exactly that on the run it was
      # added: AgentCallout wraps `children` in its own `<p>`, so a story passing
      # a `<p>` produced nesting the browser silently repaired.
      #
      # Playwright's browser lives in docs-app, which is where the visual suite
      # already keeps it — installed here rather than adding a second copy at
      # the root.
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: docs-app
      - run: npx playwright install --with-deps chromium
        working-directory: docs-app
      # `storybook dev` rather than a static file server: it is already a
      # dependency, so nothing is fetched from the network at job time. The
      # story list still comes from the build above — `stories:render` reads
      # `storybook-static/index.json`.
      - name: Every story renders
        run: |
          npm run storybook &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:6006/iframe.html && break
            sleep 2
          done
          npm run stories:render
