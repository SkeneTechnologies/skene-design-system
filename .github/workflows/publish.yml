name: publish

on:
  push:
    # Releases are tagged `v0.12.0` — the `v` is part of the tag, not part of
    # the version in package.json, and the guard below is written around that.
    tags: ['v*']
  # Manual runs exist for two cases. One: the tag pushed fine but the run died
  # on something transient (registry 5xx, runner eviction), and re-pushing a tag
  # to retrigger is not an option because npm refuses to republish a version.
  # Two: packing the tarball to see what would ship, without spending a
  # version number.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack the tarball, but do not publish'
        type: boolean
        default: true

# npmjs is the registry (see .runlog/RUN.md), so nothing here writes to GitHub
# Packages and no `packages: write` is warranted. Checkout only reads.
#
# `id-token: write` is the one write scope, and it is what makes this file
# tokenless. It does not grant write access to anything in GitHub — it lets the
# job MINT a short-lived OIDC identity token describing itself (this repo, this
# workflow, this ref), which npm exchanges for publish rights against a trusted
# publisher configured on the package. The credential lives for the length of
# one step and cannot be stolen from a secret store, because it is not in one.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  # Deliberately NOT cancel-in-progress, unlike ci.yml. A cancelled publish can
  # land after the tarball has been accepted but before npm has finished, which
  # leaves a version that exists on the registry and in no release anyone
  # intended. Queueing a redundant run costs a runner minute; cancelling a
  # half-done publish costs a burned version number that can never be reused.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Still needed: it points the runner's .npmrc at npmjs, which is what
          # `npm publish` reads to know where to go. It no longer carries a
          # NODE_AUTH_TOKEN, because there is no longer a token to carry.
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and Node 22 ships npm 10.
      # Without this the publish fails asking for authentication, which reads
      # like a permissions problem and is not one.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          have=$(npm --version)
          echo "npm $have"
          # Asserted rather than assumed: `npm@latest` resolving to something
          # older than the floor would otherwise surface as an auth error at
          # the worst moment. Compared with sort -V rather than the semver
          # package, because this step runs BEFORE `npm ci` and there is no
          # dependency tree to require anything out of yet.
          if [ "$(printf '%s\n%s\n' 11.5.1 "$have" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $have is older than 11.5.1; trusted publishing needs 11.5.1+"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      # Four separate incidents in this repo have been a version string that
      # disagreed with reality, so this is the point of the workflow, not a
      # formality. A tag pushed against the wrong commit publishes a tarball
      # whose contents nobody reviewed under a number nobody can reuse — npm
      # does not allow republishing a version, so the only fix is to burn the
      # number and cut another release.
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag $tag does not match package.json ($pkg). Delete the tag, fix the version, tag again."
            exit 1
          fi
          echo "$tag matches package.json"

      # A manual run has no tag to check against, so the guard above cannot
      # protect it. Saying so is better than letting the skip read as a pass.
      - name: No tag to verify
        if: github.ref_type != 'tag'
        run: echo "::warning::Manual run — publishing package.json's version unchecked against any tag."

      # NO CREDENTIAL CHECK, deliberately, and its absence is the point.
      #
      # There used to be an `npm whoami` here to catch a dead token before
      # `prepublishOnly` ran the full verify. Under trusted publishing there is
      # no credential to check ahead of time: the OIDC token is minted by the
      # publish itself, so nothing exists to interrogate a step earlier. Its
      # last incarnation had already been demoted to advisory after it blocked
      # a release on a 401 that only meant the token could not read /-/whoami.
      #
      # Failing late stays safe for the same reason it always did here: npm
      # rejects bad credentials BEFORE accepting a tarball, so a failure costs
      # a run and never the version number.

      # The dry run stops here. It packs the tarball the same way a publish
      # would — running prepublishOnly, so the full verify happens — and prints
      # what would be uploaded, without uploading it.
      - name: Pack only (dry run)
        if: inputs.dry_run
        run: npm publish --dry-run

      # No build or verify step here on purpose. `prepublishOnly` runs
      # `npm run verify` (tokens, contrast, tests, build) inside `npm publish`,
      # before the tarball is packed. Repeating it as a separate step would not
      # add a gate — it would only let the two drift, and a green step followed
      # by a `prepublishOnly` that fails differently is the confusing outcome.
      #
      # A tag push has no `inputs`, so `inputs.dry_run` is empty there and this
      # runs — which is the behaviour wanted: tags always publish, only a manual
      # run can ask not to.
      #
      # The failure is trapped only to explain it. `npm publish` still decides
      # the outcome, and the step still fails — a publish that reports success
      # on a rejected upload would be the worst thing this file could do.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          # pipefail is NOT on by default in an Actions `run:` step — the
          # default shell is `bash -e {0}`. Without it the pipeline reports
          # tee's status, tee always succeeds, and a rejected publish would
          # read as a green one. That is the single worst bug this file could
          # carry, so it is set explicitly rather than assumed.
          set -o pipefail
          if ! npm publish 2>&1 | tee /tmp/publish.log; then
            # These branches classify a failure that npm has already decided.
            # They exist to save the next release from a wrong hypothesis, so
            # the standard they are held to is not "does it usually help" but
            # "can it ever be confidently wrong". A misfiled ::error:: is worse
            # than silence: it carries the authority of the workflow, it names
            # a specific subsystem, and whoever is mid-release will go and edit
            # that subsystem. Hence: most specific pattern first, every pattern
            # anchored to something npm only prints for that one condition, and
            # an explicit else for everything else.
            if grep -q "EOTP" /tmp/publish.log; then
              echo "::error::npm refused the publish with EOTP, which means it authenticated with a TOKEN rather than through trusted publishing — check that NODE_AUTH_TOKEN has not been reintroduced. Under trusted publishing 2FA does not apply."
            elif grep -qE "E409|409 Conflict" /tmp/publish.log; then
              # 2026-08-28, publishing v0.14.0. npm returned:
              #
              #   npm error code E409
              #   npm error 409 Conflict - PUT https://registry.npmjs.org/@skene%2Fdesign-system
              #     - Failed to save packument. A common cause is if you try to publish a new
              #       package before the previous package has been fully processed.
              #
              # No branch described a 409, and the branch below then claimed it
              # anyway: its old pattern led with a bare `404`, which matched the
              # digits in the `_logs/2026-08-28T09_14_04_404Z-debug-0.log` path
              # npm prints on every failure. So the run announced that the
              # trusted publisher was misconfigured. It was not. Nothing in this
              # tag, the tarball, or the npm-side configuration was wrong, and a
              # plain re-run of the identical workflow — no bump, no re-tag, no
              # config change — published `+ @skene/design-system@0.14.0`. The
              # false explanation cost a full diagnostic cycle spent auditing a
              # correct configuration, which is exactly the failure mode this
              # whole block was written to prevent.
              #
              # A 409 is the registry rejecting a WRITE it could not serialise
              # against its own replicas. It is the one class here that is
              # neither our fault nor actionable: the correct response is to run
              # the same thing again. Saying that plainly matters as much as
              # naming the cause, because the instinct on a failed publish is to
              # bump the version, and bumping is precisely wrong — npm refused
              # the packument write, so the version was never recorded and is
              # still free to use.
              echo "::error::npm returned 409 Conflict ('Failed to save packument'). This is a TRANSIENT registry-side write conflict on npmjs — not a problem with this repository, the tag, the tarball, the OIDC identity, or the trusted publisher. The version was NOT consumed. Fix: re-run this workflow unchanged. Do NOT bump the version, do NOT delete and re-push the tag, and do NOT edit the trusted-publisher configuration."
            elif grep -qE "E404|ENEEDAUTH|not authorized|npm (error|ERR!) 404" /tmp/publish.log; then
              # The pattern here used to lead with a bare `404`, which matched
              # those three digits ANYWHERE in a verbose npm log — a byte count,
              # a port, a hash fragment, an unrelated request logged earlier in
              # the run. That is how a failure with nothing to do with identity
              # can be told it has an identity problem. Every alternative is now
              # anchored to a token npm emits only when it means HTTP 404 or an
              # authorisation refusal: `E404` is npm's error code (`npm error
              # code E404`), and `npm error 404` / `npm ERR! 404` are the status
              # lines from the current and pre-11 CLIs respectively. Real 404
              # detection is unaffected — npm cannot report a 404 publish
              # failure without printing at least one of these.
              echo "::error::npm rejected the OIDC identity. The trusted publisher on the package must name THIS repository and THIS workflow file (.github/workflows/publish.yml), and the job must hold id-token: write. A config created after 2026-05-20 must also explicitly allow the npm publish action. The version was NOT consumed."
            else
              # Silence was the old behaviour for an unmatched failure, and
              # silence is defensible — but only if the chain above cannot claim
              # the failure by accident, which is now true. Say explicitly that
              # nothing was recognised, so the next unclassified code is read
              # off npm's own output instead of being pattern-matched against
              # whichever advice happened to be printed.
              echo "::error::npm publish failed with a code this workflow does not recognise. Read npm's output above rather than any explanation here, and do not assume the trusted publisher is at fault. npm rejects a publish before it accepts the tarball, so a failed run has not consumed the version — if the code turns out to be transient (5xx, a timeout), re-running unchanged is safe."
            fi
            exit 1
          fi
