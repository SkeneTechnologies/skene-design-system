name: publish

on:
  push:
    # Releases are tagged `v0.12.0` — the `v` is part of the tag, not part of
    # the version in package.json, and the guard below is written around that.
    tags: ['v*']
  # Manual runs exist for two cases. One: the tag pushed fine but the run died
  # on something transient (registry 5xx, runner eviction), and re-pushing a tag
  # to retrigger is not an option because npm refuses to republish a version.
  # Two: checking the credential without spending a version number.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check the credential and pack, but do not publish'
        type: boolean
        default: true

# npmjs is the registry (see .runlog/RUN.md), so nothing here writes to GitHub
# Packages and no `packages: write` is warranted. Checkout is the only thing
# that touches this repo, and it only reads.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # Deliberately NOT cancel-in-progress, unlike ci.yml. A cancelled publish can
  # land after the tarball has been accepted but before npm has finished, which
  # leaves a version that exists on the registry and in no release anyone
  # intended. Queueing a redundant run costs a runner minute; cancelling a
  # half-done publish costs a burned version number that can never be reused.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # This is what authenticates the publish. setup-node writes the
          # runner's .npmrc from this URL plus NODE_AUTH_TOKEN at step time.
          # Never hand-write an .npmrc or echo the token into one: a token in a
          # file in the workspace is a token that can be committed, printed by a
          # failing step, or uploaded in an artifact.
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund

      # Four separate incidents in this repo have been a version string that
      # disagreed with reality, so this is the point of the workflow, not a
      # formality. A tag pushed against the wrong commit publishes a tarball
      # whose contents nobody reviewed under a number nobody can reuse — npm
      # does not allow republishing a version, so the only fix is to burn the
      # number and cut another release.
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag $tag does not match package.json ($pkg). Delete the tag, fix the version, tag again."
            exit 1
          fi
          echo "$tag matches package.json"

      # A manual run has no tag to check against, so the guard above cannot
      # protect it. Saying so is better than letting the skip read as a pass.
      - name: No tag to verify
        if: github.ref_type != 'tag'
        run: echo "::warning::Manual run — publishing package.json's version unchecked against any tag."

      # Always, before anything that could spend a version number. A missing or
      # revoked NPM_TOKEN is otherwise discovered by `npm publish` — after
      # prepublishOnly has run the full verify, and on the one commit where a
      # failure is most expensive to diagnose.
      #
      # Read what this proves and what it does not. `whoami` proves the token
      # authenticates and names the account it belongs to. It does NOT prove
      # that account may publish `@skene/*`: for a scope with nothing in it yet,
      # nothing does, short of the first publish. So a green check here plus a
      # 402/403 on the first real publish means the token is fine and the
      # account's rights or plan are not — which is a different fix.
      #
      # The v0.13.0 release proved the gap concretely, and not in either of the
      # two shapes guessed above: `whoami` passed, and `npm publish` came back
      # `EOTP` — the account requires 2FA and the token was not a kind that may
      # skip it. Only an Automation token (classic) or a Granular Access Token
      # bypasses 2FA; a classic Publish token does not, and no check short of
      # publishing can tell them apart. The publish below now says so on
      # failure rather than leaving it to be rediscovered.
      - name: Check the npm credential
        run: |
          who=$(npm whoami --registry https://registry.npmjs.org) || {
            echo "::error::NPM_TOKEN is missing, expired or revoked — npm whoami failed."
            exit 1
          }
          echo "authenticated as $who"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The dry run stops here. It packs the tarball the same way a publish
      # would — running prepublishOnly, so the full verify happens — and prints
      # what would be uploaded, without uploading it.
      - name: Pack only (dry run)
        if: inputs.dry_run
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # No build or verify step here on purpose. `prepublishOnly` runs
      # `npm run verify` (tokens, contrast, tests, build) inside `npm publish`,
      # before the tarball is packed. Repeating it as a separate step would not
      # add a gate — it would only let the two drift, and a green step followed
      # by a `prepublishOnly` that fails differently is the confusing outcome.
      #
      # A tag push has no `inputs`, so `inputs.dry_run` is empty there and this
      # runs — which is the behaviour wanted: tags always publish, only a manual
      # run can ask not to.
      #
      # The failure is trapped only to explain it. `npm publish` still decides
      # the outcome, and the step still fails — a publish that reports success
      # on a rejected upload would be the worst thing this file could do.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          # pipefail is NOT on by default in an Actions `run:` step — the
          # default shell is `bash -e {0}`. Without it the pipeline reports
          # tee's status, tee always succeeds, and a rejected publish would
          # read as a green one. That is the single worst bug this file could
          # carry, so it is set explicitly rather than assumed.
          set -o pipefail
          if ! npm publish 2>&1 | tee /tmp/publish.log; then
            if grep -q "EOTP" /tmp/publish.log; then
              echo "::error::npm refused the publish with EOTP: the account requires 2FA and NPM_TOKEN is not a token that may skip it. Replace it with an Automation token (npmjs.com -> Access Tokens -> Classic -> Automation) or a Granular Access Token with read-write on @skene. The version was NOT consumed — npm rejects EOTP before accepting the tarball, so retrying with a working token publishes the same number."
            fi
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
