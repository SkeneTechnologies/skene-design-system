        dark: "#f25246"
      $description: "Light value is DERIVED, not designed: the least-darkened hue-preserving value clearing 4.56:1 on surface.1 light. Replace with a designed colour that clears 4.5:1."
    destructive:
      $value: "var(--destructive)"
    errorRedOnTint:
      $modes:
        light: "#b33c34"
        dark: "#f25246"
      $description: "Text on a 10% tint of semantic.errorRed, which is what a StatPill label sits on. DERIVED, not designed: the least-darkened hue-preserving value clearing 4.6:1 on that ground, measured off the rendered pill rather than off the surface ladder. It exists because the light variant of semantic.errorRed was derived against surface.1 and a tinted pill is a different, warmer ground: the label landed at 3.98 and 4.36 against a 4.5:1 floor. Dark is unchanged from the base token; the dark tint is dark and the base value already clears there. Replace with a designed colour. Re-derived in 0.5.2 against EVERY ground the label is observed on, not one sampled ground. The 0.5.1 values were derived against a 10%% tint; StatPill's `ok` uses a 12%% fill and the artifacts sit on more than one card colour, so matcha landed at 4.24 and amber at 4.21 on grounds the derivation had never seen."
    warningAmberOnTint:
      $modes:
        light: "#7e622b"
        dark: "#e6b450"
      $description: "Text on a 10% tint of semantic.warningAmber, which is what a StatPill label sits on. DERIVED, not designed: the least-darkened hue-preserving value clearing 4.6:1 on that ground, measured off the rendered pill rather than off the surface ladder. It exists because the light variant of semantic.warningAmber was derived against surface.1 and a tinted pill is a different, warmer ground: the label landed at 4.45 against a 4.5:1 floor. Dark is unchanged from the base token; the dark tint is dark and the base value already clears there. Replace with a designed colour. Re-derived in 0.5.2 against EVERY ground the label is observed on, not one sampled ground. The 0.5.1 values were derived against a 10%% tint; StatPill's `ok` uses a 12%% fill and the artifacts sit on more than one card colour, so matcha landed at 4.24 and amber at 4.21 on grounds the derivation had never seen."
    matchaOnTint:
      $modes:
        light: "#5d694a"
        dark: "#d7f4ab"
      $description: "Text on a 10% tint of semantic.matcha, which is what a StatPill label sits on. DERIVED, not designed: the least-darkened hue-preserving value clearing 4.6:1 on that ground, measured off the rendered pill rather than off the surface ladder. It exists because the light variant of semantic.matcha was derived against surface.1 and a tinted pill is a different, warmer ground: the label landed at 4.26 against a 4.5:1 floor. Dark is unchanged from the base token; the dark tint is dark and the base value already clears there. Replace with a designed colour. Re-derived in 0.5.2 against EVERY ground the label is observed on, not one sampled ground. The 0.5.1 values were derived against a 10%% tint; StatPill's `ok` uses a 12%% fill and the artifacts sit on more than one card colour, so matcha landed at 4.24 and amber at 4.21 on grounds the derivation had never seen."
