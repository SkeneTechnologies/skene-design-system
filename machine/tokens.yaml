    $description: "The dashboard's hover peach. Marketing used #fdd4aa and repaints."
  primaryBronze:
    $value: "#8c6b47"
  primaryGold:
    $value: "#e8c260"
  primaryRgb:
    $value: "254, 192, 137"
  secondary:
    $modes:
      light: "oklch(0.97 0 0)"
      dark: "oklch(0.269 0 0)"
  secondaryForeground:
    $modes:
      light: "oklch(0.205 0 0)"
      dark: "oklch(0.985 0 0)"
    $description: "The neutral on-secondary label: shadcn's own semantics, and the dashboard's. Marketing used this name for a brand-peach label instead, which is a different role, not a different value — see secondaryForegroundAccent."
  secondaryForegroundAccent:
    $modes:
      light: "#89684a"
      dark: "#fec089"
    $description: "A brand-peach label on the secondary chip. Marketing's meaning for --secondary-foreground, given its own name so both roles survive: the dashboard puts a neutral near-black label on a light secondary button, marketing puts a peach one on a dark chip. Same name, two roles — the same trap as chrome.* vs surface.*. Values track color.brand.peach per mode; 9.45:1 dark, 4.65:1 light."
  muted:
    $modes:
      light: "oklch(0.97 0 0)"
      dark: "oklch(0.269 0 0)"
  mutedForeground:
    $modes:
      light: "oklch(0.538 0 0)"
      dark: "oklch(0.708 0 0)"
    $description: "Light darkened from shadcn's stock oklch(0.556 0 0), which is 4.35:1 on muted and fails AA. Darkened again in 0.5.2, from oklch(0.546 0 0) to oklch(0.538 0 0): 0.546 was the least-darkened value clearing 4.5:1 ON MUTED, and it was never checked against `card`, where it measures 4.49:1 and fails. That produced 42 contrast failures across the marketing site, in every component putting quiet text on a card — a breadcrumb, a table caption, a figure label. 0.538 clears 4.64:1 on card and more on muted, which is lighter. Same mistake the semantic *OnTint tokens made in 0.5.1: derived against one ground, shipped onto several."
  accent:
    $modes:
      light: "oklch(0.97 0 0)"
      dark: "oklch(0.269 0 0)"
  accentForeground:
    $modes:
      light: "oklch(0.205 0 0)"
      dark: "oklch(0.985 0 0)"
  destructive:
    $value: "oklch(0.656 0.198 28.1)"
    $description: "Invariant, matching the dashboard, and exactly color.semantic.errorRed (#f25246) — the two were the same colour under two names. Marketing mode-split it per upstream shadcn and repaints. Note this LOWERS light-mode contrast against a white label from 4.77:1 to 3.46:1; both modes are now KNOWN_GAPS under D5, whose fix is a single design call on the fill instead of two unrelated reds."
  destructiveForeground:
    $value: "#ffffff"
    $description: "White, invariant. 4.77:1 on the light destructive; 2.89:1 on the dark one, which is a KNOWN_GAP in the contrast gate. The fix is to darken --destructive in dark, not this: shadcn's dark destructive is a light red picked to be legible as *text*, and both Button implementations then paint it as a fill via `bg-destructive text-destructive-foreground`. Darkening the label instead was tried and made the label invisible in the marketing gallery. Changing the fill is a visible design call across both apps."
  border:
    $modes:
      light: "oklch(0.922 0 0)"
      dark: "oklch(1 0 0 / 10%)"
  input:
    $modes:
      light: "oklch(0.922 0 0)"
      dark: "oklch(1 0 0 / 15%)"
  ring:
    $modes:
      light: "oklch(0.708 0 0)"
      dark: "oklch(0.556 0 0)"
  chart1:
