# Generated from design-tokens.json by scripts/generate-token-docs.mjs.
# Do not edit by hand — change the JSON and run `npm run tokens`.
#
# Mode-aware tokens keep both modes. The version of this file that shipped
# through 0.9.1 flattened them to dark and dropped color.chrome.* entirely,
# so an agent reading it for the invariant-dark role found nothing and had
# no way to tell the role was missing rather than absent from the system.
#
# Source version 2.8.0, 241 tokens.
version: "2.8.0"
lastUpdated: "2026-08-28"
color:
  brand:
    peach:
      $modes:
        light: "#89684a"
        dark: "#fec089"
      $description: "Light value is DERIVED, not designed: the least-darkened hue-preserving value clearing 4.61:1 on surface.1 light. Replace with a designed colour that clears 4.5:1."
    peachText:
      $modes:
        light: "#faf1e9"
        dark: "#3b2402"
      $description: "Text ON a peach fill. Inverts with brand.peach: cream on the darker light-mode peach, near-black on the lighter dark-mode peach."
    bronze:
      $value: "#8c6b47"
    gold:
      $value: "#e8c260"
    light:
      $value: "#faf1e9"
    peachLight:
      $value: "#fdd4aa"
      $description: "A lighter peach than `brand.peach` resolves in dark (#fec089), used as INK on a dark ground — the pull-quote and lead-in colour on the about pages. INVARIANT, like `peachDeep` and unlike `peach` beside it: no light value has been designed, and on a cream ground this would fail AA. Do not read the name as a hover state. This exact value was the prototype's `--primary-hover` and the shadcn arbitration replaced it with #ebdccf (`legacy.peachHover`) — see KNOWN_DRIFT in `__tests__/pairing.test.ts`. This token is the ink, not a reinstatement of that decision."
    creamDim:
      $value: "#ecdccf"
      $description: "A dimmer, warmer cream than `brand.light` (#faf1e9) — testimonial body copy on a 5%-cream card, where full cream is too loud. 13.41:1 on `chrome.surface.1`. One digit from `legacy.peachHover` (#ebdccf) and NOT the same colour; do not fold the two together without looking at both rendered."
    bronzeDeep:
      $value: "#5a4532"
      $description: "A darker bronze than `brand.bronze` (#8c6b47) — the outline of an unreached step in a progress row, where the reached ones are peach. A BORDER, not text: it measures 1.99:1 on `chrome.surface.1` and would not clear any text floor there."
    peachDeep:
      $value: "#f97316"
      $description: "INVARIANT, unlike brand.peach and brand.peachText beside it — the same #f97316 in both modes. The name reads as a sibling of brand.peach and it is not one, which is a trap: used as text on a cream ground it measures 2.51:1 against a 4.5 floor, and skene-site shipped exactly that on 2026-08-15 across four inline links at three viewports. This token is a gradient endpoint and a dark-ground accent. For text that must survive a light ancestor use brand.peach, which resolves #89684a inside `light`. Note the contrast gate cannot catch the misuse: `brand.peach-deep|*` is in skip_pairs, so it is excused against EVERY background."
  accent:
    violet:
      $value: "#c9a2dd"
      $description: "Feature-row icon tint. Promoted from the Stand demo capture; nothing in the package was within ΔE 52 (nearest was neon.engagement). Mode-invariant on purpose — drawn against dark surfaces only, like the rest of the brand palette."
    blue:
      $value: "#9bbbd5"
      $description: "Feature-row icon tint. Promoted from the Stand demo capture; nearest existing was neon.engineering at ΔE 24.3, far too saturated to substitute. Mode-invariant — see accent.violet."
  chrome:
    surface:
      "0":
        $value: "#0a0a0a"
      "1":
        $value: "#171717"
      "2":
        $value: "#212121"
      "3":
        $value: "#4a4a4a"
      midGray:
        $value: "#2a2a2a"
      darker:
        $value: "#060606"
      deep:
        $value: "#1a1a1a"
      deep2:
        $value: "#0b0b0b"
      elevated:
        $value: "#2c2c2c"
      border:
        $value: "#363636"
      overlay:
        $value: "#0f0f0f"
        $description: "The floating panel — dropdown, popover, command menu. Between `surface.0` (#0a0a0a) and `surface.1` (#171717): dark enough to read as lifted off the page rather than as another card. Chrome-only: the mode-aware `color.surface.*` ladder has no `overlay` because no light value has been designed for one."
      hoverSubtle:
        $value: "#111111"
        $description: "The hover fill for a card sitting on `surface.0`. The step is deliberately smaller than the one to `surface.1`, so the change reads as a state and not as a different card. Pairs with `hoverStrong` at the light end of this ladder, the way `line.subtle` pairs with `line.strong`."
      band:
        $value: "#161616"
        $description: "A full-width section band, one hair under `surface.1`. Marketing stacks bands of alternating value down a page; this is the darker of the two and `surface.1` is the lighter."
      card:
        $value: "#1c1c1c"
        $description: "A card fill on a `surface.1` or `deep` band. Sits between `deep` (#1a1a1a) and `surface.2` (#212121) — closer to its band than a full rung, which is what stops a grid of cards reading as a checkerboard."
      hairline:
        $value: "#1f1f1f"
        $description: "The faintest opaque rule on the dark ladder — the divider inside an overlay panel, where `surface.border` (#363636) is far too loud. Opaque, and in `surface.*` rather than `chrome.line.*` on purpose: `chrome.line` is alpha-only by design (see `line.subtle`) because those rules stack on four different grounds, whereas a rule inside a panel has exactly one ground and does not need to composite."
      divider:
        $value: "#232323"
        $description: "The rule between rows in a card or widget, and the fill of a raised row in the same component — one value doing both jobs, which is normal on a dark ladder. One rung under `midGray` (#2a2a2a). See `hairline` for why an opaque rule lives in `surface.*`."
      row:
        $value: "#252525"
        $description: "A field, code block, or row set inside a card — lighter than the card so the nested box reads as raised. Just under `elevated` (#2c2c2c), which is the same idea one rung louder."
      hoverStrong:
        $value: "#525252"
        $description: "The hover fill at the light end of this ladder — a step indicator resting on `surface.3` (#4a4a4a). The counterpart of `hoverSubtle`. NOT to be confused with the light value of the mode-aware `color.text.muted`, which is the same hex: that token resolves #8c8c8c in dark, so a dark-only consumer that reaches for it gets a different colour than it drew. This one is invariant and is a background."
    line:
      subtle:
        $value: "rgba(255, 255, 255, 0.12)"
        $description: "Default hairline between sections and on cards. Alpha rather than an opaque token because sections stack on four different grounds (surface.1, deep, deep2, surface.2) and an opaque border is correct on exactly one of them."
      strong:
        $value: "rgba(255, 255, 255, 0.2)"
        $description: "Emphasised hairline — active/hovered card edges. See line.subtle for why alpha."
      onLight:
        $value: "rgba(20, 20, 20, 0.14)"
        $description: "Hairline for the inverted case: dark rule on a cream/peach fill."
    text:
      primary:
        $value: "#faf1e9"
      muted:
        $value: "#8c8c8c"
      mutedStrong:
        $value: "rgba(255, 255, 255, 0.6)"
      mutedWeak:
        $value: "rgba(255, 255, 255, 0.5)"
      mutedWarm:
        $value: "rgba(250, 241, 233, 0.68)"
        $description: "Muted body copy that fades the brand cream (chrome.text.primary) rather than pure white. Preferred over text.muted/mutedStrong on marketing surfaces: the brand foreground is #faf1e9, so fading toward white drifts away from the brand as the text gets quieter."
      mutedWarmStrong:
        $value: "rgba(250, 241, 233, 0.82)"
        $description: "The louder rung of mutedWarm — lede paragraphs and secondary headings."
      gray:
        $value: "#a1a1a1"
      grayLight:
        $value: "#c8cdd3"
      goldSoft:
        $value: "#d4b050"
      grayCool:
        $value: "#9ca3af"
        $description: "Tailwind `gray-400` — the inactive label in a tab or step row. Cooler than `text.gray` (#a1a1a1), which is neutral, and louder than `text.muted`. The three are a ramp, not synonyms. 7.06:1 on `surface.1`."
      caption:
        $value: "#737373"
        $description: "The 9px uppercase eyebrow/caption ink — one rung dimmer than `text.muted` (#8c8c8c). MEASURED, not assumed: 4.18:1 on `surface.0` and 3.78:1 on `surface.1`, both under the 4.5 body floor. It is tokenised because the consumer already ships it at every eyebrow and a token is the only way to fix all of them at once; raising it is a design call. Not this package's `text.muted`: skene-marketing-website binds its own `--color-text-muted` to this value, which is why its `Eyebrow` header comment names it that."
