# Agent-enforceable rules for @skene/design-system.
# Human narrative: docs/principles.md
#
# This file previously scoped itself to the Skene Cloud dashboard and listed
# skene-marketing-website under `excludes`. That was correct while it lived in
# the dashboard repo. Inside a shared package it was actively wrong: an agent
# reading it would refuse to use the design system for half the estate it
# exists to serve.

version: "2.0.0"

# The package serves every Skene surface. Four repos are in scope; two install
# the package today. `installs: false` means a change here does not reach that
# surface — it is estate to migrate, not estate to check for breakage.
#
# skene-marketing-website read `installs: false` from 2026-08-14 until
# 2026-08-27 and the assertion under it ("zero @skene/design-system matches in
# its package.json, its lockfile or its source") was false on the branch that
# ships. It installs 0.12.0 and is now the package's heaviest consumer. The
# 2026-08-14 check ran against `main`, where the dependency genuinely was
# absent; the work had landed on a branch. Re-measure a consumer against the
# branch that ships, not against whichever ref is checked out.
consumers:
  - repo: skene-site
    surface: site
    installs: true
    theme_default: dark
    notes: >-
      The largest consumer. Hardcodes `dark` on `<html>` in src/app/layout.tsx —
      chosen, not inherited. Imports the package in 26 files: 22 of its 24
      routes plus 4 shared components, reaching `sections/` 56 times,
      `patterns/` 25 and `ui/` 21. Keeps 72 of its own visual baselines. Its
      globals.css is 25 lines: `@import "tailwindcss"` then
      `@import "@skene/design-system/styles.css"`, and no declarations at all,
      so anything that renders wrong there is the package's, not the app's.
  - repo: skene-marketing-website
    surface: site
    installs: true
    installs_verified: "2026-08-28, branch chore/ds-0.14.0 @ 8ecd9b9, against v0.14.0. Lockfile resolves 2e55aa5, the v0.14.0 tag and this repo's main. Typecheck, build, lint:copy, lint:classes and agent readability (492/492, live checks included) all green. That consumer branch is PR #68 and is not merged: skene-marketing-website main still installs 0.13.0 until it is."
    version: "github:SkeneTechnologies/skene-design-system#semver:^0.14.0"
    theme_default: dark
    reach:
      import_statements: 226
      files: 36
      css_directives: 3
      routes: 20
      distinct_specifiers: 49
      by_layer: { sections: 162, patterns: 31, ui: 23, utils: 3, asset-urls: 3 }
      heaviest:
        - { module: patterns/marketing, files: 23 }
        - { module: ui/button, files: 21 }
        - { module: sections/artifact-shell, files: 20 }
        - { module: sections/product-window, files: 18 }
        - { module: sections/key-value-table, files: 17 }
        - { module: sections/check-list, files: 15 }
        - { module: sections/chip, files: 13 }
    notes: >-
      Public marketing site, and the whole live site today — skene-site is wired
      into no microfrontends routing on any branch, so nothing has moved off it
      yet. Hardcodes `dark` on `<html>` in src/app/layout.tsx:65. Display type
      runs to 67px, well past the dashboard's UI-density scale.
      It is the package's HEAVIEST consumer by import count, not empty estate.
      Evidence, all re-measured 2026-08-27 on branch `staging` against v0.13.0:
      the dependency is at package.json:33 and resolved at package-lock.json:22
      and :3876 (git+ssh …#29a3a9e404889bcac92a692d499f306bf9b1f2b0, the v0.13.0
      tag); 222 import statements across 33 .ts/.tsx files; src/app/globals.css:30 imports
      styles.css and :38 declares `@source ".../@skene/design-system/dist"`,
      which is the Turbopack scan every packaged utility class depends on.
      Unlike skene-site its globals.css is ~1,940 lines and does hold local
      declarations, so a rendering fault there can be the app's.
      Read `machine/layouts.yaml` `marketing` before writing a page for it: its
      band grammar, its 5fr/7fr split and its cream inset are contracts this
      package did not ship until 2026-08-27 and every page on it already obeys.
      NOTE, 0.13.0: `machine/compositions.yaml` derives its whole corpus from
      THIS repository (branch claude/calcom-style-wireframes-a64a8e @ b96b935),
      which is by itself proof the `installs: false` reading was wrong — the
      release read 17 of its routes while the registry beside it said the repo
      had zero matches in its package.json, its lockfile and its source. The
      same `installs: false` reading is what let the release record
      (site)/page.tsx and (site)/pricing/page.tsx as importing nothing: they
      import seventeen modules and nine at the commit it names. Both are
      archetypes in that file now, and the corpus is 19 composing routes of 20.
      See compositions.yaml `corpus.history`.
  - repo: skene-dashboard
    surface: app
    installs: false
    theme_default: light
    notes: >-
      Signed-in workspace product. Dense, semantic. Wraps the sidebar,
      onboarding and public chrome in `.dark`, and escapes back with `.light`.
      Does NOT install the package: zero `@skene/design-system` matches in its
      package.json, its lockfile or its source, verified 2026-08-13. It is
      where these tokens and generators were written, and it still holds its
      own copies — 30 files under components/ui/ that share a name with a
      module in src/ui/, and a design-tokens.json at 1.3.0 against the
      package's 2.7.0. So a change here reaches the dashboard only after a
      migration that has not started; treat its divergence as unmeasured.
  - repo: unidentified auth app
    surface: site
    installs: unknown
    theme_default: dark
    notes: >-
      Serves /login and /signup at the same origin as the marketing site (see
      skene-marketing-website DECISIONS.md D3). Has never been audited as a
      design system consumer. Do not assume it follows these rules yet.

priority_order:
  - primitives from @skene/design-system/ui/*
  - patterns from @skene/design-system/patterns/*
  - Tailwind v4 utilities generated from the package @theme inline
  - classes from @skene/design-system/effects.css
  - app-local CSS, only for genuinely app-specific chrome

must:
  - import_primitives_from_the_package_not_a_local_copy
  - use_cn_from_package_utils_for_class_merge
  - use_lucide_react_for_icons
  - use_tokens_over_literal_values
  - wrap_dark_subtrees_in_dark_class
  - ask_before_inventing_a_component_that_does_not_exist
  # One card on a marketing surface, and it is FeatureRow. A consumer that
  # renders a card any other way is rendering a second visual system on the
  # same page, which is what this rule exists to stop — skene-site had three
  # at once (50 FeatureRows, 51 Card variant="surface" grid cells, 2
  # LightSectionCards) and a reader could tell from the frame whether a
  # section happened to have a product surface.
  #
  # This REVERSES the two notFor entries feature-row carried until 0.9.19.
  # See documentation/20260817_feature_row_as_the_marketing_card.md for what
  # was checked, and for the cost: a grid cell converts as a copy-only row so
  # it keeps its height, which means "one card" is one component and not one
  # picture.
  #
  # Product surfaces are out of scope. This is about marketing pages.
  - render_marketing_cards_as_feature_row

must_not:
  - arbitrary_hex_in_classnames
  - styled_components_for_new_features
  - use_prefers_color_scheme          # theming is class-based, always
  - redefine_package_tokens_in_app_css
  - copy_a_primitive_into_an_app_to_tweak_it
  - purple_gradients_or_ai_slop_layouts
  - fonts_outside_geist
  # Write the character. `&check;` shipped as six literal characters in
  # skene-site while `&harr;` two rows away rendered correctly — the JSX entity
  # table is a subset and differs by compiler. Verified 2026-08-13: this repo's
  # own tsc emits "&check;" undecoded and "\u2194" decoded from adjacent text
  # children, so it is a table gap, not an SWC quirk. Entities in PROPS never
  # decode under any compiler. A literal glyph cannot be wrong.
  - html_entities_in_jsx

# The distinction that causes the most damage when got wrong.
surface_roles:
  chrome:
    tokens: color.chrome.surface.*, color.chrome.text.*
    behaviour: invariant, always dark
    use_for: >-
      Anything that should stay dark on a light page the way a terminal or a
      code block does. Dashboard data tables, log panels, terminal frames.
  themed:
    tokens: color.surface.*, color.text.*
    behaviour: mode-aware, inverts to a zinc ladder in light
    use_for: page surfaces that should follow the theme.
  warning: >-
    These two share their dark values and diverge only in light, so picking the
    wrong one looks correct until someone opens light mode. Collapsing them back
    into one set breaks a consumer in either direction, which is why
    __tests__/roles.test.ts fails the build if anyone tries.

known_gaps:
  - id: light_mode_brand_palette
    detail: >-
      The brand palette was drawn against dark surfaces. The figures this entry
      used to quote — peach 1.53:1, matcha 1.16:1, amber 1.83:1, error-red
      3.31:1 — are the UNFIXED values and are no longer what renders. 0.4.0
      added light-mode variants for matcha, amber and error-red, and 0.5.1
      added on-tint variants for their labels. The stale figures did real
      damage: a section written from this table in 0.5.0 documented a contrast
      risk with numbers that were two releases out of date, which sent someone
      looking for the wrong problem.
      STILL OPEN, but narrower than it reads: every one of the four now has a
      light variant, color.brand.peach included (#89684a, 4.61:1 on surface.1
      light), and __tests__/roles.test.ts asserts all four clear 4.5:1. What is
      unfixed is that each light value is DERIVED — the least-darkened
      hue-preserving value that cleared the floor — so the gap is aesthetic,
      not accessible. KNOWN_GAPS in scripts/check-token-contrast.ts is the live
      list and holds only the two shadcn destructive pairs; this entry is prose
      and goes stale, so trust that file over this one.
    consequence: >-
      Do not put brand colour on a light themed surface. State colour is now
      usable there: semantic.{errorRed,warningAmber,matcha} against a light
      surface, and their *OnTint variants for a label on a 10% tint of the same
      colour, which is what a StatPill is. Chrome surfaces are unaffected.
  - id: sidebar_primary_is_shadcn_blue
    status: closed
    detail: >-
      --sidebar-primary was oklch(0.488 0.243 264.376), shadcn's default blue.
      It is now mode-aware: brand peach in dark, oklch(0.205 0 0) in light. The
      token's own $description records the change. Kept here as a closed entry
      because this list was read as open work while the value had already moved.
    consequence: None outstanding.

ask_first_when:
  - a_needed_primitive_or_pattern_does_not_exist
  - a_token_value_would_change
  - a_surface_role_assignment_is_unclear
