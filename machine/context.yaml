    alsoFor:
      - claim: >-
          Naming an icon-only button, or expanding a truncated cell.
        via: export TooltipContent
    watchFor:
      - note: >-
          TooltipProvider must wrap the tree once. Content is portalled, so
          theme classes on an ancestor do not reach it.
        via: export TooltipProvider
    notFor:
      - instead: HoverCardContent
        why: >-
          A preview with structure rather than one line. That is HoverCard.
  patterns/dither:
    import: "@skene/design-system/patterns/dither"
    exports: [DitherOverlay, DitheredMedia]
    polarity: inherits
    seen: [pattern-dithered-media]
    overrides: [style, className]
    props:
      DitherOverlay:
        src: { type: string, required: true }
        opacity: { type: number, default: 0.8 }
        blend: { type: "'soft-light' | 'overlay' | 'multiply' | 'screen'", default: "'soft-light'" }
      DitheredMedia:
        video: { type: string }
        image: { type: string }
        dither: { type: string }
        fadeTo: { type: string, default: "'var(--color-chrome-surface-darker)'" }
        scrim: { type: number, default: 0.56 }
        poster: { type: string }
        children: { type: React.ReactNode }
    useFor: >-
      The Skene surface treatment: a halftone texture blended over
      photographic or video media, and the full hero composition built from
      it. DitherOverlay is the raw layer; DitheredMedia is media, dither,
      scrim, gradient and content in one.
    alsoFor:
      - claim: >-
          Any full-bleed media band, not only a hero — the `video` and `image`
          props are both optional and the composition renders with either.
        via: prop DitheredMedia.video
      - claim: >-
          Texture over your own stack: DitherOverlay takes a `src` and a
          `blend`, so it composes onto anything with a position context.
        via: prop DitherOverlay.src
      - claim: >-
          Joining a band to whatever follows it, by setting `fadeTo` to the
          next section's ground.
        via: prop DitheredMedia.fadeTo
    watchFor:
      - note: >-
          `scrim` is measured, not decorative. Video is not a background you
          can check once: the homepage hero measured 1.04:1 for peach display
          type over a bright frame. The default is 0.56 and setting 0 means
          you have measured the footage yourself.
        via: prop DitheredMedia.scrim
      - note: >-
          `blend` defaults to soft-light because that is what reads as a print
          halftone. overlay is harsher and multiply just dims — both stop
          looking like the brand.
        via: prop DitherOverlay.blend
    notFor:
      - instead: HeroBackdrop
        why: >-
          A dark strip that fades into the page with no media over it. That is
          HeroBackdrop, which is this composition's subset.
      - instead: SectionBackdrop
        why: >-
          A halftone field behind a mock inside a feature row. That is
          SectionBackdrop, which ships the three site textures.
    sameAs: [patterns/hero-backdrop#HeroBackdrop]
  patterns/hero-backdrop:
    import: "@skene/design-system/patterns/hero-backdrop"
    exports: [HeroBackdrop]
    polarity: inherits
    seen: [pattern-hero-backdrop]
    overrides: [style, className]
    props:
      HeroBackdrop:
        image: { type: string }
        imageOpacity: { type: number, default: 0.9 }
        fadeTo: { type: string, default: "'var(--color-chrome-surface-darker)'" }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      A dark hero strip: a background image at low opacity, a gradient fading
      to the page ground, and content above it.
    alsoFor:
      - claim: >-
          Any short banner that needs to sit on the page rather than end
          abruptly — a subpage header, a section lead-in.
        via: prop HeroBackdrop.children
      - claim: >-
          A plain dark strip with no image at all: `image` is optional and the
          fade still renders.
        via: prop HeroBackdrop.image
      - claim: >-
          The textured split header — eyebrow, h1 and lede in a narrow track
          with an artifact beside them, the dither strip behind both. A
          recipe, not an export: wrap a two-column grid in `children` with
          `image` set to the dithered asset; the header comment carries the
          markup and skene-marketing-website's `page-shell.tsx` (`flat-split`)
          is the reference implementation. The grid's ratios and wrap width
          are page decisions, which is why the package ships the ground and
          not the grid.
        via: prop HeroBackdrop.children
    watchFor:
      - note: >-
          `fadeTo` must match the ground of whatever follows, or the seam
          shows as a band edge.
        via: prop HeroBackdrop.fadeTo
    notFor:
      - instead: DitheredMedia
        why: >-
          A full hero with video, dither and a measured scrim. That is
          DitheredMedia; this is its subset and the two are scoped by size,
          not by look.
    sameAs: [patterns/dither#DitheredMedia]
  patterns/marketing:
    import: "@skene/design-system/patterns/marketing"
    exports: [PillNav, PillNavLink, Eyebrow, DisplayHeading, Accent, NumberedStep, SplitAuthLayout]
    composes: [same-layer/pill-nav]
    polarity: inherits
    seen: [pattern-pill-nav, pattern-display-heading, pattern-numbered-step, pattern-split-auth]
    overrides: [style, className]
    customProperties: [--font-size-pill, --font-tracking-eyebrow, --font-size-marketing-hero, --font-size-marketing-xxl, --font-size-marketing-xl, --font-line-height-tight, --font-size-card-title]
    props:
      Eyebrow:
        children: { type: React.ReactNode, required: true }
      DisplayHeading:
        size: { type: "'hero' | 'page' | 'section'", default: "'page'" }
        as: { type: "'h1' | 'h2' | 'h3'" }
        children: { type: React.ReactNode, required: true }
      NumberedStep:
        n: { type: string, required: true }
        title: { type: React.ReactNode, required: true }
        onLight: { type: boolean, default: "false" }
        bodyTone: { type: "'muted' | 'primary'", default: "'muted'" }
        titleAs: { type: "'h2' | 'h3'", default: "'h3'" }
        children: { type: React.ReactNode }
      SplitAuthLayout:
        form: { type: React.ReactNode, required: true }
        showcase: { type: React.ReactNode, required: true }
        meta: { type: React.ReactNode }
    useFor: >-
      The page furniture the marketing surface repeats: the nav bar over the
      hero, the display heading and its peach accent, the eyebrow kicker, the
      numbered step, and the split auth layout.
    alsoFor:
      - claim: >-
          Eyebrow above any band, not only a section: it owns
          font.tracking.eyebrow, which is the token that makes a kicker read
          as a label.
        via: export Eyebrow
      - claim: >-
          DisplayHeading at three sizes for anything that is the largest type
          on its band.
        via: prop DisplayHeading.size
      - claim: >-
          NumberedStep for any ordered list where the number is furniture
          rather than content — how-it-works, onboarding, a migration path.
        via: prop NumberedStep.n
      - claim: >-
          SplitAuthLayout for any two-pane page, not only sign-in: a form on
          one side and a showcase on the other.
        via: prop SplitAuthLayout.showcase
    watchFor:
      - note: >-
          Eyebrow is built from chrome.surface.border and chrome.text.muted,
          which are invariant. On a cream band it renders near-invisible —
          Bridge hand-rolls an Eyebrow-shaped chip from the theme-aware role
          for exactly this reason.
        via: export Eyebrow
      - note: >-
          PillNav sits OVER the hero rather than above it, so the media runs
          to the top of the viewport. Placing it in normal flow undoes the
          composition.
        via: prop PillNav.brand
    notFor:
      - instead: Badge
        why: >-
          A status marker on a product row. Eyebrow is a section kicker; Badge
          is the product surface's status chip.
  patterns/pill-nav-frosted:
    import: "@skene/design-system/patterns/pill-nav-frosted"
    exports: [PILL_NAV_FROSTED_STYLE, PILL_NAV_POSITION]
    polarity: inherits
    seen: []
    useFor: >-
      The two constants PillNav and its drawer share: the frosted wash that
      keeps links legible over arbitrary photography, and the absolute and
      sticky position classes.
    alsoFor:
      - claim: >-
          The same frosted wash on chrome that sits beside the nav and has to
          match it, rather than each surface re-deriving the colour-mix.
        via: export PILL_NAV_FROSTED_STYLE
      - claim: >-
          Reading the position contract without importing the component, for a
          layout that has to reserve or overlay the same space.
        via: export PILL_NAV_POSITION
    notFor:
      - instead: PillNav
        why: >-
          Restyling the nav. A bar that needs a different wash is a different
          component, and copying these values into an app to tweak them is the
          primitive-copy rule.
  patterns/pill-nav-mobile-menu:
    import: "@skene/design-system/patterns/pill-nav-mobile-menu"
    exports: [PillNavMobileMenuToggle, PillNavMobileMenuLayers]
    client: true
    composes: [same-layer/pill-nav-frosted]
    polarity: inherits
    seen: []
    overrides: [className, use client]
    props:
      PillNavMobileMenuToggle:
        isOpen: { type: boolean, required: true }
        onOpenChange: { type: "(open: boolean) => void", required: true }
        panelId: { type: string, required: true }
      PillNavMobileMenuLayers:
        links: { type: "PillNavMobileLink[]", required: true }
        actions: { type: React.ReactNode }
        isOpen: { type: boolean, required: true }
        onOpenChange: { type: "(open: boolean) => void", required: true }
        panelId: { type: string, required: true }
    types:
      PillNavMobileLink:
        href: { type: string, required: true }
        label: { type: React.ReactNode, required: true }
        active: { type: boolean }
    useFor: >-
      The drawer layers behind PillNav's mobile navigation: the Menu and Close
      toggle, the backdrop, and the bordered link list with the actions
      repeated in its footer.
    alsoFor:
      - claim: >-
          A drawer for a nav that is not PillNav: the layers take their links
          and open state as props, so a different bar can reuse the same
          panel, backdrop and toggle.
        via: export PillNavMobileMenuLayers
      - claim: >-
          The toggle on its own, for a bar that wants the Menu and Close
          affordance and its aria wiring without the package's panel.
        via: export PillNavMobileMenuToggle
    notFor:
      - instead: PillNav
        why: >-
          The assembled nav. PillNav collects its links from PillNavLink
          children and owns the open state, so reach past it only when the bar
          itself is different.
      - instead: Sheet
        why: >-
          A general side panel for application UI. This drawer is marketing
          chrome and is sized and styled for a nav.
  patterns/pill-nav:
    import: "@skene/design-system/patterns/pill-nav"
    exports: [PillNav, PillNavLink]
    client: true
    composes: [same-layer/pill-nav-frosted, same-layer/pill-nav-mobile-menu]
    polarity: inherits
    seen: [pattern-pill-nav]
    overrides: [className, use client]
    props:
      PillNav:
        brand: { type: React.ReactNode }
        actions: { type: React.ReactNode }
        position: { type: "'absolute' | 'sticky'", default: "'absolute'" }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      The marketing site's top navigation: a frosted pill floating over hero
      media, with a full-screen drawer below md so a phone gets the links
      rather than the CTA alone.
    alsoFor:
      - claim: >-
          Sticky chrome on a page with no hero to overlay, where the bar
          should stay visible as the page scrolls.
        via: prop PillNav.position
      - claim: >-
          Marking the current route, so the nav says where the reader is
          rather than only where they can go.
        via: prop PillNavLink.active
    notFor:
      - instead: NavigationMenu
        why: >-
          Application chrome. This is drawn against marketing ground and
          overlays hero media; a signed-in header belongs to
          ui/navigation-menu.
      - instead: SkeneMark
        why: >-
          A logo. The package ships none through this component, so `brand` is
          a slot and the mark comes from patterns/skene-mark or the app.
  patterns/skene-mark:
    import: "@skene/design-system/patterns/skene-mark"
    exports: [SkeneMark, SkeneLockup]
    polarity: inherits
    seen: [pattern-skene-mark]
    overrides: [style, className]
    props:
      SkeneMark:
        tone: { type: SkeneMarkTone, default: "'block'" }
        size: { type: number, default: 28 }
        radius: { type: number, default: 8 }
        alt: { type: string }
      SkeneLockup:
        tone: { type: SkeneLockupTone, default: "'onDark'" }
        height: { type: number, default: 26 }
        alt: { type: string, default: "'Skene'" }
    useFor: >-
      The brand artwork as elements: the square symbol, and the horizontal
      lockup with the wordmark.
    alsoFor:
      - claim: >-
          Anywhere the product speaks for itself — an avatar, a card that says
          SKENE, a nav lockup. AgentCallout already defaults its avatar to it.
        via: export SkeneMark
      - claim: >-
          A favicon-shaped tile at any size: `size` moves the whole thing and
          `radius` only applies to the block tone, which is the one that
          brings its own ground.
        via: prop SkeneMark.size
    watchFor:
      - note: >-
          `tone` names the GROUND, not the ink — onLight is the BLACK glyph.
          Naming it after the ink is what makes a caller pick the invisible
          variant.
        via: prop SkeneMark.tone
      - note: >-
          SkeneLockup is sized by `height`, not `size`: the artwork is
          1016×260, and one prop name meaning width in one component and
          height in the other ships at the wrong scale.
        via: prop SkeneLockup.height
    notFor:
      - instead: SkeneLockup
        why: >-
          A nav bar with no word beside the mark. Use SkeneLockup, which
          defaults its alt to Skene because there it IS the accessible name.
  patterns/terminal:
    import: "@skene/design-system/patterns/terminal"
    exports: [Terminal, TerminalLine]
    polarity: inherits
    seen: [pattern-terminal]
    overrides: [className]
    props:
      Terminal:
        title: { type: string }
        children: { type: React.ReactNode, required: true }
      TerminalLine:
        prompt: { type: boolean }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      A terminal frame: traffic lights, a title, and monospace lines with an
      optional prompt.
    alsoFor:
      - claim: >-
          Any CLI transcript, install snippet or log excerpt on a marketing
          page.
        via: prop Terminal.title
      - claim: >-
          A single command with no chrome around it, by rendering one
          TerminalLine inside your own container.
        via: export TerminalLine
    watchFor:
      - note: >-
          The frame is a CSS class in effects.css, not markup, so the look is
          available without importing the component. TerminalBlock does not
          use that class and its frame is 12px where this is 8px — the two
          terminals do not currently match.
        via: export Terminal
    notFor:
      - instead: TerminalBlock
        why: >-
          An install block with a copy button. That is TerminalBlock, which is
          the client-side sibling.
      - instead: ProductWindow
        why: >-
          Framing a product mock rather than text. That is ProductWindow,
          which inverts to light by default.
    sameAs: [sections/terminal-block#TerminalBlock]
  sections/agent-callout:
    import: "@skene/design-system/sections/agent-callout"
    exports: [AgentCallout]
    composes: [patterns/skene-mark]
    polarity: inherits
    seen: [section-agent-callout]
    overrides: [style, className]
    props:
      AgentCallout:
        avatar: { type: React.ReactNode }
        eyebrow: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
        evidence: { type: React.ReactNode }
    useFor: >-
      The verdict block: an avatar, a claim in bold, and the evidence under
      it, in a peach-bordered frame on its own tinted ground. It is the moment
      Skene speaks on the page.
    alsoFor:
      - claim: >-
          Any attributed statement — a customer quote, a reviewer's note, an
          assistant's summary. Nothing in it is Skene-specific except the
          default avatar.
        via: prop AgentCallout.avatar
      - claim: >-
          A one-line callout with no kicker and no evidence: both slots are
          optional, which is exactly how the nested instance in the release
          window renders.
        via: prop AgentCallout.eyebrow
    watchFor:
      - note: >-
          It paints its own near-black fill, which is why the invariant
          chrome.text.* roles are correct inside it. Give it a light variant
          and every text class in it has to move to the theme-aware role.
        via: inline style
      - note: >-
          The evidence separators are content, not styling — pass the dots you
          want.
        via: prop AgentCallout.evidence
    notFor:
      - instead: RecommendationCard
        why: >-
          A proposal rather than a verdict. That is RecommendationCard, which
          deliberately carries no status colour.
      - instead: Finding
        why: >-
          A measured state with a status. That is Finding.
  sections/annotated-curve:
    import: "@skene/design-system/sections/annotated-curve"
    exports: [AnnotatedCurve]
    polarity: inherits
    seen: [section-annotated-curve]
    overrides: [style, className]
    props:
      AnnotatedCurve:
        points: { type: "CurvePoint[]", required: true }
        stroke: { type: CurveStrokeToken, default: "'brand-peach'" }
        aspect: { type: number, default: 2 }
        offset: { type: number, default: 14 }
    types:
      CurvePoint:
        x: { type: number, required: true }
        y: { type: number, required: true }
        label: { type: React.ReactNode }
        place: { type: CurveLabelPlacement }
        align: { type: CurveLabelAlign }
        className: { type: string }
    useFor: >-
      A narrative plotting frame: a Catmull-Rom spline drawn through
      hand-authored 0-100 percentage points, with HTML callout boxes pinned to
      the points that carry labels. The split is the whole design — the SVG is
      `aria-hidden` decoration and the callouts are an ordered list of real
      HTML, so the copy wraps, selects, finds, and is read in array order. It
      is for making an argument that has a *shape* (a rise, a dip, a recovery)
      where the copy is the payload and the curve is the frame the copy hangs
      on, not for showing measured values.
    alsoFor:
      - claim: >-
          Falling, dipping, or S-shaped stories, not just the rising one. `y`
          runs from the top (0 = top), so any progression is just a different
          y sequence, and `stroke` picks from a 5-token union (`brand-peach`,
          `brand-peach-deep`, `accent-violet`, `accent-blue`,
          `semantic-matcha`) — a decline in `semantic-error-red` is the one
          thing NOT available, since red is not in `CurveStrokeToken`.
        via: type CurvePoint.y
      - claim: >-
          Denser callout layouts by alternating sides. `place` takes `above |
          below | left | right` and `align` takes `start | center | end`, so
          callouts can zig-zag above and below the sweep, and a node near the
          frame edge can anchor its box by its own left or right edge instead
          of hanging outside. `offset` (default 14px) tunes the gap for all of
          them at once.
        via: type CurvePoint.place
      - claim: >-
          Shaping the sweep without adding content: a point with `label`
          omitted is an anchor — no marker, no box, no entry in the `<ol>`.
          That is how you get a curve that runs edge to edge, or a deliberate
          valley between two labelled peaks, with only two or three actual
          callouts.
        via: type CurvePoint.label
      - claim: >-
          Reshaping the band via `aspect` (default 2), which sets both the
          wrapper's `aspectRatio` and the derived viewBox height. A wide hero
          strip (`aspect={4}`) or a squarer inline figure (`aspect={1.2}`)
          both scale uniformly because `preserveAspectRatio` is `xMidYMid
          meet`.
        via: default aspect=2
      - claim: >-
          Rich callouts, not just strings. `label` is a `ReactNode`, so a box
          can hold a figure plus a caption, a `Chip`, or emphasis markup;
          per-point `className` merges into the callout `<li>`, which is the
          intended place to override the default `max-w-[62%]` width for one
          long box.
        via: type CurvePoint.label
    watchFor:
      - note: >-
          No control-point API, and the spline is honest about it: the header
          states it can overshoot BETWEEN two points that are close in x and
          far apart in y. The documented fix is to spread the x values, not to
          fight it with anchors.
        via: prop AnnotatedCurve.points
      - note: >-
          `aspect` is load-bearing, not layout sugar. The viewBox height is
          derived from it, and `preserveAspectRatio="xMidYMid meet"` is chosen
          so node `<circle>`s stay circles — switching to `none` (the obvious
          way to fit an arbitrary box) scales x and y differently and renders
          every node as an ellipse. Setting a fixed height in `className`
          fights the inline `aspectRatio` style.
        via: prop AnnotatedCurve.aspect
      - note: >-
          The callout boxes are deliberately opaque (`bg-surface-1`), because
          every box sits on a point that is ON the stroke by construction. Any
          translucency puts a peach line straight through the middle of a
          monospace label.
        via: prop AnnotatedCurve.stroke
      - note: >-
          Reading order is array order, deliberately not sorted by x. The
          curve is `aria-hidden`, so the `<ol>` of callouts is the entire
          accessible content; reordering the `points` array for visual reasons
          silently reorders what a screen reader hears. Also note the boxes
          use mode-aware `surface.*` / `text.*`, so an always-dark instance
          inside a light page has to carry `dark` on its container.
        via: prop AnnotatedCurve.points
    notFor:
      - instead: AnnotatedCurve
        why: >-
          Actual data visualisation. There is no scale, no axis, no data
          binding — every coordinate is a hand-placed percentage, and the path
          is generated from those percentages. If numbers drive the shape,
          this will drift from them silently; use a real chart.
      - instead: JourneyTrack
        why: >-
          A step sequence that happens to be labelled. If there is no curve
          carrying the argument, use `JourneyTrack` (state per step) or
          `PipelineStepper` (progress through a running job); for a plain
          numbered list on the dark page, the `NumberedStep` pattern.
  sections/artifact-shell:
    import: "@skene/design-system/sections/artifact-shell"
    exports: [ArtFrame, ArtPanel, ArtTitle, AppWindow, PanelCaption, AppPanel, StatPill, DataTable, DataRow, DataCell]
    composes: [ui/table]
    polarity: applies-light
    seen: [section-artifact-shell]
    overrides: [style, className]
    customProperties: [--border]
    props:
      ArtFrame:
        kind: { type: ArtFrameKind, required: true }
        row: { type: boolean, default: "false" }
        children: { type: React.ReactNode }
      ArtPanel:
        bar: { type: React.ReactNode }
        children: { type: React.ReactNode }
      ArtTitle:
        children: { type: React.ReactNode, required: true }
      AppWindow:
        crumb: { type: React.ReactNode }
        actions: { type: React.ReactNode }
        children: { type: React.ReactNode }
      ArtifactHeader:
        title: { type: React.ReactNode }
        source: { type: React.ReactNode }
        separator: { type: React.ReactNode }
        summary: { type: React.ReactNode }
        summaryStatus: { type: StatPillStatus }
        actions: { type: React.ReactNode }
      PanelCaption:
        children: { type: React.ReactNode, required: true }
      AppPanel:
        children: { type: React.ReactNode }
      StatPill:
        status: { type: StatPillStatus, required: true }
        children: { type: React.ReactNode, required: true }
      DataTable:
        columns: { type: "React.ReactNode[]", required: true }
        children: { type: React.ReactNode, required: true }
      DataRow:
        children: { type: React.ReactNode, required: true }
      DataCell:
        mono: { type: boolean }
        muted: { type: boolean }
        children: { type: React.ReactNode }
    useFor: >-
      The shell every drawn Skene Cloud artifact is built from: the textured
      field, the light app window, its panels, the status pill and the data
      table.
    alsoFor:
      - claim: >-
          Any product screenshot you would rather draw than capture — the real
          screen carries a customer's repository name and counts, and a
          drawing does not.
        via: export AppWindow
      - claim: >-
          A table at product density on a marketing page, via DataTable, which
          composes ui/table rather than restyling it.
        via: export DataTable
      - claim: >-
          A dark panel with a bar, via ArtPanel, for anything that is chrome
          rather than app surface.
        via: prop ArtPanel.bar
    watchFor:
      - note: >-
          AppWindow drops its whole bar when neither crumb nor actions is
          given. Passing an empty element instead of undefined leaves a stray
          flex row that reads as a rendering fault.
        via: prop AppWindow.crumb
      - note: >-
          AppWindow forces `light` on itself. That is load-bearing: the
          artifact is a light product screen on a dark marketing page, and
          without it every mode-aware token inside resolves for the wrong
          ground.
        via: export AppWindow
      - note: >-
          StatPill's vocabulary is bad | warn | ok, which is the same three
          semantic colours as Finding's good | warn | danger under different
          names.
        via: prop StatPill.status
    notFor:
      - instead: ProductWindow
        why: >-
          A window in the marketing register, with a 640px cap and a modal
          shadow. That is ProductWindow.
      - instead: SectionBackdrop
        why: >-
          A halftone field on a marketing band. ArtFrame is the artifact-layer
          equivalent and loads the same three textures under different key
          names.
    sameAs: [sections/section-backdrop#SectionBackdrop]
  sections/ask-widget:
    import: "@skene/design-system/sections/ask-widget"
    exports: [AskWidget]
    client: true
    composes: [same-layer/chip]
    polarity: inherits
    seen: [section-ask-widget]
    overrides: [className, use client]
    props:
      AskWidget:
        avatar: { type: React.ReactNode }
        name: { type: React.ReactNode }
        question: { type: React.ReactNode, required: true }
        lede: { type: React.ReactNode }
        placeholder: { type: string }
        submitLabel: { type: React.ReactNode, required: true }
        value: { type: string, required: true }
        onValueChange: { type: "(value: string) => void", required: true }
        onSubmit: { type: "(value: string) => void" }
        showAiBadge: { type: boolean, default: "true" }
        aiBadgeLabel: { type: React.ReactNode, default: "'AI'" }
    useFor: >-
      The "ask us anything" prompt block: an attributed question rendered as
      the loud heading, a quiet borderless textarea that the heading labels
      via `aria-labelledby`, an AI-disclosure badge, and a small submit sized
      to its label in the bottom-right. It is the package's one genuinely
      interactive section — a controlled textarea plus a submit handler — and
      it lives in its own module specifically so `'use client'` does not
      spread to server-renderable siblings. The restraint is the design: it is
      a low-commitment probe, so a full-bleed primary button and a boxed input
      would make it read as a form rather than as a question.
    alsoFor:
      - claim: >-
          Any single free-text capture on a dark page — a waitlist "what are
          you trying to fix?", a feedback prompt, a qualification question.
          `question`, `lede`, `placeholder` and `submitLabel` are all props
          and nothing in the file is Skene-specific.
        via: prop AskWidget.question
      - claim: >-
          Unattributed use: omit `avatar` and `name`. The header row keeps its
          `min-h-[32px]` so the block's rhythm holds and the badge stays put
          on the right.
        via: prop AskWidget.avatar
      - claim: >-
          Non-AI contexts: `showAiBadge={false}` when no model is involved or
          the surrounding section already discloses it. `aiBadgeLabel` is a
          node, so the chip can carry "BETA" or an icon instead — but note the
          default `true` is a disclosure decision, not a styling default.
        via: prop AskWidget.showAiBadge
      - claim: >-
          Prefilled or externally driven text — it is fully controlled through
          `value` / `onValueChange`, so a parent can seed it with an example
          prompt, restore a draft, or clear it after submit.
        via: prop AskWidget.value
      - claim: >-
          Rendering with no handler at all: `onSubmit` is optional and the
          form always `preventDefault`s, so the block is safe in a gallery or
          preview with nowhere to submit (the gallery case does exactly this).
        via: prop AskWidget.onSubmit
    watchFor:
      - note: >-
          `chrome.text.*` and `chrome.surface.*` throughout are correct ONLY
          because the panel paints its own invariant ground. Drop this inside
          a `light` surface (a `LightSectionCard`, a `Bridge` band) or swap
          the fill for a mode-aware one and every text class in here becomes
          cream on cream. The peach submit is the exception — `brand.peach` /
          `brand.peach-text` move together.
        via: use client
      - note: >-
          `'use client'` is on the module, so whoever owns `value` becomes a
          client component too. Keep the owner in an island file; the gallery
          has `islands.tsx` precisely so pulling this in does not move every
          server-rendered sibling off the server path.
        via: prop AskWidget.value
      - note: >-
          There is no pending, disabled, or error state and no submit gating —
          the button fires `onSubmit('')` on an empty textarea as happily as
          on a filled one. Adding a `pending`/`disabled` prop is a small
          change, but it IS a change; do not assume it is there.
        via: prop AskWidget.onSubmit
      - note: >-
          The question renders as a fixed `<h3>` whose `useId` id is the
          textarea's only accessible name. Fine mid-page, wrong if this block
          is a page's primary heading — there is no `as` or `headingLevel`
          prop, and adding one is the small addition you would need.
        via: prop AskWidget.name
    notFor:
      - instead: Textarea
        why: >-
          A real form — multiple fields, validation, or anything that posts to
          a route. The textarea has no `name`, the `<form>` has no `action`,
          and submit is always intercepted. Use the `ui/` primitives
          (`Textarea`, `Input`, `Button`) and own the form yourself.
      - instead: Input
        why: >-
          A single-line capture like an email signup. The 104px `min-h`,
          `resize-none` textarea and clamp(1.6rem…2.35rem) heading are sized
          for a paragraph-length answer; for an email one-liner use an `Input`
          plus `Button` inside `FinalCta`'s `actions` slot.
  sections/billing-toggle:
    import: "@skene/design-system/sections/billing-toggle"
    exports: [BillingToggle]
    client: true
    polarity: inherits
    seen: [section-billing-toggle]
    overrides: [className, use client]
    props:
      BillingToggle:
        yearly: { type: boolean, required: true }
        onChange: { type: "(yearly: boolean) => void", required: true }
        monthlyLabel: { type: React.ReactNode, default: "'Billed monthly'" }
        yearlyLabel: { type: React.ReactNode, default: "'Billed yearly'" }
    useFor: >-
      The monthly/yearly switch, and the only `'use client'` file in the
      pricing section. It exists as its own module for a structural reason
      rather than a visual one: putting the directive in `plan-card.tsx` would
      drag the whole pure-markup card across the client boundary, so the
      interactivity was quarantined here (sections.md rule 4). It is fully
      controlled — `yearly` in, `onChange` out — and makes both word labels
      clickable, not just the 40px track, because the words are the obvious
      target.
    alsoFor:
      - claim: >-
          Any two-word binary switch — the pricing wording lives entirely in
          props. `monthlyLabel`/`yearlyLabel` are `ReactNode`, so "USD / EUR",
          "Self-serve / Enterprise", "Cloud / Self-hosted" all work with no
          code change.
        via: prop BillingToggle.monthlyLabel
      - claim: >-
          Labels that carry a badge: since they are `ReactNode` and the row is
          `flex items-center gap-3`, `yearlyLabel={<>Billed yearly
          <Chip>-20%</Chip></>}` renders inline.
        via: prop BillingToggle.yearlyLabel
      - claim: >-
          Driving more than one section from one switch. It holds no internal
          state, so a single `useState` in a page island can feed the
          `PlanGrid` prices and a comparison table from the same value — the
          demo (`docs-app/app/pricing-demo.tsx`) does exactly this pattern
          with one plan grid.
        via: prop BillingToggle.onValueChange
      - claim: >-
          Placement and scale via `className`, which merges into the outer
          flex row through tailwind-merge: `mx-auto`, `justify-center`,
          `text-[12px]` all take.
        via: className
    watchFor:
      - note: >-
          `aria-label="Bill yearly"` on the switch is hardcoded and not
          derived from `yearlyLabel`. Repurpose the labels and the accessible
          name still says "Bill yearly" — fixing that needs one small prop
          addition (`switchLabel` / `aria-label` passthrough).
        via: prop BillingToggle.yearlyLabel
      - note: >-
          Labels use invariant `chrome.text.*` (`text-chrome-text-primary`
          when active). Correct only on an always-dark surface; on a cream
          panel the active label is cream on cream. It is not safe inside a
          featured `PlanCard` or a `LightSectionCard`.
        via: prop BillingToggle.value
      - note: >-
          The knob positions `left-1` and `left-[26px]` are hand-fitted to the
          track's `h-6 w-11` and the knob's `size-4`, and only `left` is
          transitioned. Resizing the track via `className` leaves the knob
          travelling to the wrong stop.
        via: className
      - note: >-
          Controlled-only: there is no `defaultYearly` and no internal state.
          Omit `onChange` wiring and you ship a switch that visibly does
          nothing.
        via: prop BillingToggle.onChange
      - note: >-
          It is the client boundary. Deep-import
          `@skene/design-system/sections/billing-toggle` rather than pulling
          it from the root barrel next to server-rendered siblings.
        via: use client
    notFor:
      - instead: Switch
        why: >-
          A settings or form boolean — use `ui/switch` or `SettingsField`.
          This one has marketing-sized side labels, a pricing-specific
          hardcoded aria-label, and no form/name/id integration.
      - instead: PillNav
        why: >-
          Three or more options (a third billing term, a segmented control).
          It is a two-state switch with `aria-checked`; use `ui/tabs` or the
          `PillNav` pattern instead.
  sections/bridge:
    import: "@skene/design-system/sections/bridge"
    exports: [BridgeNode, Bridge]
    composes: [patterns/marketing]
    polarity: applies-both
    seen: [section-bridge]
    overrides: [style, className]
    customProperties: [--shadow-modal]
    props:
      BridgeNode:
        label: { type: React.ReactNode }
        title: { type: React.ReactNode }
        items: { type: "string[]" }
        icon: { type: React.ReactNode }
        featured: { type: boolean, default: "false" }
      Bridge:
        eyebrow: { type: React.ReactNode }
        title: { type: React.ReactNode }
        titleAs: { type: "'h2' | 'h3'", default: "'h2'" }
        lede: { type: React.ReactNode }
        caption: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      A whole cream band (a `<section>`, not a card) that lays N `BridgeNode`
      cards in a row, interleaves arrows between them, and inverts one of them
      to dark and lifts it. It exists to argue POSITION — that the featured
      thing sits between the others — and the tone difference is the argument,
      not styling: three cards in one tone read as three peers and the band
      says nothing. Structurally it is also the package's one doubly-nested
      inversion (`light` band, `dark` card inside it), so it doubles as the
      worked example of how the two subtree switches nest.
    alsoFor:
      - claim: >-
          Any node count, not just three. `Bridge` runs `Children.toArray` and
          emits N-1 arrows, and each node gets `flex-1 basis-0`, so a two-card
          before/after or a four-stage handoff works with no change.
        via: export Bridge
      - claim: >-
          A plain sequence band with no subject: omit `featured` on every
          `BridgeNode` and you get N peer cream cards joined by arrows — right
          for when the argument is order rather than position.
        via: prop BridgeNode.featured
      - claim: >-
          A cream heading block on a dark page. `eyebrow` + `title` + `lede` +
          `caption` render a centred, max-w-[880px] header independent of the
          cards; pass one child and no arrows are drawn at all.
        via: prop Bridge.eyebrow
      - claim: >-
          `BridgeNode` is exported on its own and composes inside any other
          `light` surface (e.g. a `LightSectionCard` visual slot). Its
          non-featured styling — `bg-surface-0`, `border-chrome-line-on-light`
          — is written for a light ancestor.
        via: export BridgeNode
      - claim: >-
          Branding the subject card: `icon` takes any node (the live section
          uses a glyph, an inline SVG logo works), `items` takes three short
          fragments, and `title` composes with `<Accent>` because
          `brand.peach` is mode-aware and lands on its light value (#89684a)
          inside the band.
        via: prop BridgeNode.icon
    watchFor:
      - note: >-
          The `light` class on the root is unconditional and written first,
          and the featured card's `dark` is the counterpart. `cn` is
          tailwind-merge, so a `className` background WILL win over
          `bg-brand-light` while leaving `light` in place — override the fill
          with anything dark and you get exactly the invisible-text failure
          (`text.primary` #faf1e9 on #faf1e9) the file header documents.
        via: prop BridgeNode.featured
      - note: >-
          Arrows are unconditional between children — there is no prop to
          suppress them. Anything you pass as a child that is not part of a
          left-to-right sequence still gets an arrow after it unless it is
          last.
        via: prop Bridge.children
      - note: >-
          `featured` is a per-node boolean with nothing enforcing exactly one.
          Two featured cards render two dark lifted cards and the band loses
          its point. Also note the lift is `md:-translate-y-3`: below `md` the
          row stacks and the featured card is dark but not raised.
        via: prop BridgeNode.featured
      - note: >-
          The kicker is a hand-rolled Eyebrow-SHAPED chip, deliberately not
          `<Eyebrow>` — `Eyebrow` is built from `chrome.surface.border` /
          `chrome.text.muted`, which are invariant and render near-invisible
          on cream. The same trap applies to anything you pass into any slot
          that uses `chrome.text.*`.
        via: prop Bridge.eyebrow
      - note: >-
          The outer cards' fill is `bg-surface-0` (mode-aware → #fafafa inside
          the band), deliberately a shade off the band's cream `brand.light`.
          Do not "fix" it to `bg-brand-light` — the cards then disappear into
          the band.
        via: prop BridgeNode.featured
    notFor:
      - instead: ValueCards
        why: >-
          A generic 3-up feature or value grid. The arrows assert a
          relationship and the dark card asserts primacy; if you just want a
          row of peer cards use `ValueCards` (which argues by cost/gain
          contrast) or a plain grid of primitives.
      - instead: PipelineStepper
        why: >-
          Anything with state or progress. The arrows are static and
          `aria-hidden`, and there is no per-node status. For a job running
          now use `PipelineStepper` (done/active/pending); for funnel steps
          carrying health use `JourneyTrack`, whose connector is a gradient
          between the two states it joins.
    sameAs: [sections/plan-card#PlanCard]
  sections/card-animation-integrations:
    import: "@skene/design-system/sections/card-animation-integrations"
    exports: [INTEGRATION_ANIMATION_CARDS, INTEGRATION_ANIMATION_DETAILS, CardAnimationIntegrations]
    client: true
    composes: [lib/use-container-scale]
    polarity: inherits
    seen: []
    overrides: [style, className, use client]
    customProperties: [--cursor]
    props:
      CardAnimationIntegrations:
        backgroundImage: { type: string, default: INTEGRATIONS_TEXTURE }
        cards: { type: "IntegrationAnimationCard[]", default: INTEGRATION_ANIMATION_CARDS }
        details: { type: "IntegrationAnimationDetail[]", default: INTEGRATION_ANIMATION_DETAILS }
    types:
      IntegrationAnimationCard:
        variant: { type: CardVariant, required: true }
        icon: { type: LucideIcon, required: true }
        title: { type: string, required: true }
        context: { type: string, required: true }
      IntegrationAnimationDetail:
        badge: { type: string, required: true }
        badgeVariant: { type: BadgeVariant, required: true }
        text: { type: string, required: true }
        code: { type: string, required: true }
    useFor: >-
      Four integration cards on a textured field, cycling detail copy with
      GSAP: MCP server, GitHub App, Cloud API, and repo audit. Ported from
      skene-marketing-website's CardAnimationIntegrations.
    alsoFor:
      - claim: >-
          The visual slot of a cream band — drop it in
          `LightSectionCard.visual` or `IntegrationsHighlight`, which is the
          pre-composed homepage band.
        via: export CardAnimationIntegrations
      - claim: >-
          Custom card or detail sets by passing `cards` and `details`;
          defaults match the live marketing animation.
        via: prop CardAnimationIntegrations.cards
      - claim: >-
          A different halftone field via `backgroundImage`; defaults to
          `assetUrls.integrationsField`.
        via: prop CardAnimationIntegrations.backgroundImage
    watchFor:
      - note: >-
          Client-only: uses GSAP and ScrollTrigger. Importing it pulls a
          client boundary at this file.
        via: export CardAnimationIntegrations
      - note: >-
          Cards and detail panel start at `visibility: hidden`; GSAP drives
          `autoAlpha`. Do not remove that or the first paint flashes every
          card.
        via: export CardAnimationIntegrations
    notFor:
      - instead: SurfaceCards
        why: >-
          A static 2x2 grid where every detail is visible at once. Use this
          when you need motion and one active card at a time.
      - instead: SurfaceTiles
        why: >-
          A row of tiles with a single detail panel under the chosen one.
  sections/check-list:
    import: "@skene/design-system/sections/check-list"
    exports: [CheckList, CheckItem]
    polarity: inherits
    seen: [section-check-list]
    overrides: [style, className]
    customProperties: [--check-rule]
    props:
      CheckList:
        onLight: { type: boolean, default: "false" }
        dense: { type: boolean, default: "false" }
        children: { type: React.ReactNode, required: true }
      CheckItem:
        dense: { type: boolean, default: "false" }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      The rule-separated feature list with a peach check — the single
      highest-frequency element on a Skene marketing page, previously
      hand-written at every call site. `CheckList` is a bare `<ul>` that sets
      one CSS variable (`--check-rule`); `CheckItem` is an `<li>` whose
      separator is a *top border on each row* rather than a divider element,
      so a list of one still reads as part of its card instead of floating.
      The check is a real `aria-hidden` `<span>`, not a `::before`, precisely
      so a screen reader does not announce "tick" before every line.
    alsoFor:
      - claim: >-
          Any proof list in a section body, not just plan cards — the gallery
          uses it directly inside `FeatureRow` (dark, no flags) and inside
          `LightSectionCard` (`onLight`).
        via: prop CheckList.onLight
      - claim: >-
          Requirement / "what you get" lists on light product chrome: nest it
          in a `ProductWindow` (whose `tone="light"` default carries the
          `light` class) and pass `onLight`.
        via: prop CheckList.onLight
      - claim: >-
          Rows with structure, not just strings. `CheckItem` children are
          `ReactNode`, so links, `<strong>`, or a trailing `<Chip>` all
          render, and the aria-hidden glyph keeps the announcement clean.
        via: export CheckItem
      - claim: >-
          Two densities on the same page: `dense` (13px, `py-[11px]`) for card
          interiors, the default (14px, `py-3`) for section copy.
        via: prop CheckItem.dense
      - claim: >-
          Per-row tweaks via `className` on `CheckItem` — `cn` is
          tailwind-merge, so `border-t-0` on the first row or a different
          `py-*` actually replaces the base utility.
        via: export CheckItem
    watchFor:
      - note: >-
          `dense` does not propagate. It is a separate prop on `CheckList`
          (margin) and on `CheckItem` (padding + type size); set it on both or
          you get tight spacing with 14px text.
        via: prop CheckItem.dense
      - note: >-
          `onLight` does NOT create the light context — it only chooses
          between `--color-chrome-line-on-light` and
          `--color-chrome-line-subtle` for the rule. The peach check and the
          `text.*` type invert only if a `light` ancestor exists (featured
          `PlanCard`, `LightSectionCard`, light `ProductWindow`). On a bare
          cream `<div>` you must add `light` yourself, as the gallery case
          does.
        via: prop CheckList.onLight
      - note: >-
          The rule colour is an inline `style={{ borderTopColor:
          'var(--check-rule)' }}` on every item, so a `border-*` colour
          utility in `className` will not override it — re-set `--check-rule`
          instead.
        via: inline style
      - note: >-
          Every item carries `border-t`, including the first, so the list
          always opens with a hairline. That is intentional inside a card;
          strip it with `className="border-t-0"` on the first `CheckItem` if
          the list stands alone.
        via: export CheckItem
      - note: >-
          Type is `text-text-muted-strong` (theme-aware) by design — swapping
          in a `chrome.text.*` class reintroduces the exact bug the header
          warns about.
        via: className
    notFor:
      - instead: Checkbox
        why: >-
          An interactive checklist or to-do list. There is no checked state,
          no input, and the glyph is `aria-hidden` — use `ui/checkbox` (or
          `SettingsField`) for anything the user toggles.
      - instead: CheckItem
        why: >-
          An included/not-included comparison. The ✓ glyph and its
          `text-brand-peach` colour are hardcoded with no icon or tone prop; a
          cross/dash row would need a code change (e.g. a `tone`/`icon` prop
          on `CheckItem`). `ComparisonTable`'s `TableCheck` / `TableDash`
          already do this.
  sections/chip:
    import: "@skene/design-system/sections/chip"
    exports: [Chip]
    polarity: inherits
    seen: [section-chip]
    overrides: [className]
    props:
      Chip:
        tone: { type: ChipTone, default: "'neutral'" }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      The 10px monospace uppercase rectangle, extracted from two copies that
      were written independently — `PlanCard`'s inline tier span and
      `ProductWindow`'s `WindowStatus` — which had already drifted apart on
      tracking before anyone noticed. Its job is to hold the geometry still:
      `tone` carries colour and nothing else, with tracking as the single
      declared exception. It exists as much to stop a third inline copy being
      written as to render the two that exist.
    alsoFor:
      - claim: >-
          An identity marker on either ground with `tone="neutral"`. This is
          the one tone allowed to use invariant `chrome.surface-darker` /
          `brand.light`, because its fill is near-black on both the dark page
          AND the featured cream `PlanCard` — there is no inversion for an
          invariant token to get wrong.
        via: prop Chip.tone
      - claim: >-
          A state marker inside a light surface with `tone="healthy"` (matcha)
          or `tone="live"` (violet). Both derive their fill through
          `color-mix` from mode-aware tokens, so they follow a `light`
          ancestor down to the light value rather than laying a dark-mode tint
          on cream — safe inside a light `ProductWindow` body or a cream card.
        via: prop Chip.tone
      - claim: >-
          Wrapping in a narrower-vocabulary named component. `WindowStatus`
          (product-window.tsx:97) is the sanctioned template: it restricts
          `tone` to `'healthy' | 'live'`, pins its tracking override, and
          keeps the name callers actually look for. Do that again rather than
          adding an inline chip.
        via: prop Chip.tone
      - claim: >-
          Matching an already-shipped rendering. `className` merges last via
          `cn`, so a `tracking-*` utility beats the base 0.08em — the
          documented, and only documented, override.
        via: className
      - claim: >-
          Non-string content: `children` is a `ReactNode`, so a glyph plus a
          word, or a count, works. `shrink-0` is in the base, so the chip is
          safe as the fixed item in a flex row opposite a title that wraps.
        via: prop Chip.children
      - claim: >-
          A breakage or defect marker with `tone="danger"`. Its recipe
          deviates from `healthy`/`live` on purpose: the ink is the on-tint
          token (`--color-semantic-error-red-on-tint`), the split `StatPill`
          and `Finding` both shipped without and measured below the floor for,
          and the tint is 12% — inside the band those tokens were measured
          for. Both halves are mode-aware, so it holds inside a light
          `ProductWindow` as well as on the page.
        via: prop Chip.tone
      - claim: >-
          A caution marker with `tone="warn"` (amber): present but degraded,
          deprecated, or waiting on a decision. Same corrected recipe as
          `danger` — amber on-tint ink over a 12% tint — added because two
          marketing pages were retinting `tone="neutral"` through a shared
          amber `className`, base ink on a 15% fill, which is the inline fork
          plus the measured-band miss in one constant.
        via: prop Chip.tone
    watchFor:
      - note: >-
          `className` merges last and therefore beats the base for *any*
          utility, but `tracking-*` is the only override this package
          sanctions. Changing `px-[7px]`, `py-1`, `rounded-[5px]` or
          `text-[10px]` at a call site re-forks the component the extraction
          exists to prevent.
        via: className
      - note: >-
          Tracking is unreconciled on purpose: `Chip` holds the tier chip's
          0.08em and `WindowStatus` overrides back to 0.05em, because both
          values shipped and were signed off in the browser. "Fixing" either
          one silently restyles a verified surface — about 5px across
          "DASHBOARD: HEALTHY", per the note at the override.
        via: export Chip
      - note: >-
          `healthy` and `live` set their colour in an inline `style` from the
          `TONES` table, so a `text-*` utility in `className` will not
          override them. Only `neutral` colours via classes.
        via: className
      - note: >-
          Adding a tone is a row in `TONES`, never a branch at the call site —
          and the file's stated rule is to add one only the day something
          actually renders it. If you add a light-filled tone, do not copy
          `neutral`'s invariant `chrome.*` licence; that exemption depends on
          the fill being near-black on both grounds.
        via: prop Chip.tone
    notFor:
      - instead: Badge
        why: >-
          General status on a product surface. `Badge` (ui) is the shadcn
          primitive for that; `Chip` is section furniture locked at 10px mono,
          and stretching it to product use will produce pressure to make the
          geometry variable — the one thing it is here to prevent.
      - instead: StatChip
        why: >-
          A pill beside a heading. `StatChip` (a fact) or `MetaChip` (a
          promise) own that slot at `rounded-full` 12px; `WindowStatus` owns
          the window title bar's right-hand slot.
  sections/code:
    import: "@skene/design-system/sections/code"
    exports: [Code, PROSE_CODE]
    polarity: applies-both
    seen: []
    overrides: [className]
    customProperties: [--font-size-body]
    props:
      Code:
        children: { type: React.ReactNode, required: true }
        onLight: { type: boolean }
    useFor: >-
      The inline identifier chip inside a sentence: an event name, a column, a
      flag, a path. Extracted from SEVEN copies — six byte-identical component
      declarations across skene-site route files, verified by comparing the
      emitted class string, plus a seventh spelling as `PROSE_CODE`, the same
      recipe as a descendant selector for prose the author cannot reach
      element by element. The oldest open entry on that repository's gap list,
      on a site where an event name appears in nearly every paragraph of body
      copy.
    alsoFor:
      - claim: >-
          Prose the caller does not author element by element — MDX, a table
          cell, a body rendered from a string. Applied to the CONTAINING block
          rather than each mark, because there is no `<code>` to wrap. Kept as
          a second mechanism deliberately: merging it into the component would
          leave that case with no answer.
        via: PROSE_CODE
    notFor:
      - instead: TerminalBlock
        why: >-
          Anything block-level. `TerminalBlock` renders a command as its own
          surface; this mark sits INSIDE running text at body size, and takes
          the body contrast floor rather than the large-text one because of
          it.
      - instead: Chip
        why: >-
          A status or identity marker beside text. `Chip` is padded and sized
          to sit NEXT TO a sentence at 10px mono; this sits in one at body
          size. Reaching for `Chip` here produces pressure to make its
          geometry variable, which is the one thing it exists to prevent.
      - instead: Badge
        why: >-
          A theme-neutral status marker. `Badge` is shadcn's and neutral by
          construction; this carries brand ink on a brand surface, which is
          why it is a section rather than a primitive.
  sections/comparison-table:
    import: "@skene/design-system/sections/comparison-table"
    exports: [ComparisonRow, ComparisonTable, TableCheck, TableDash]
    polarity: inherits
    seen: [section-comparison-table]
    overrides: [style, className]
    customProperties: [--table-rule]
    props:
      ComparisonRow:
        header: { type: React.ReactNode, required: true }
        cells: { type: "React.ReactNode[]", required: true }
        featuredIndex: { type: number }
      ComparisonTable:
        columns: { type: "React.ReactNode[]", required: true }
        featuredIndex: { type: number }
        caption: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
        onLight: { type: boolean, default: "false" }
      TableMarker:
        label: { type: React.ReactNode }
    useFor: >-
      A real semantic `<table>` for capability comparison — one row per claim,
      one column per approach, with your column picked out. The featured
      column is washed in the head *and* every body cell so it reads as one
      continuous object top to bottom, and the header additionally turns peach
      so its identity is stated once in words rather than only in colour. The
      whole component is really the pairing of `min-width: 820px` on the table
      with `overflow-x: auto` + `tabIndex={0}` on the wrapper: a comparison
      that reflows into stacked cards stops being a comparison, so on narrow
      screens it keeps its shape and scrolls sideways instead.
    alsoFor:
      - claim: >-
          A plan or pricing feature matrix. `columns` and each row's `cells`
          are `React.ReactNode[]`, so prices, phrases and glyphs all drop in;
          `featuredIndex` marks the recommended plan.
        via: prop ComparisonTable.columns
      - claim: >-
          A plain spec sheet with nothing highlighted — omit `featuredIndex`
          and no wash renders anywhere, head or body.
        via: prop ComparisonTable.featuredIndex
      - claim: >-
          The same table on a cream band, via `onLight` — the only polarity
          prop, and it switches exactly one thing: `--table-rule` from
          `chrome.line.subtle` to `chrome.line.onLight`. Everything else is
          mode-aware already.
        via: prop ComparisonTable.onLight
      - claim: >-
          Highlighting a different column on one row: `ComparisonRow` accepts
          its own `featuredIndex`, and the table's injection uses
          `child.props.featuredIndex ?? featuredIndex`, so an explicit per-row
          value wins.
        via: export ComparisonRow
      - claim: >-
          `ComparisonRow` rendered outside a `ComparisonTable` (its
          `featuredIndex` prop is documented for exactly this), and
          `TableCheck`/`TableDash` reused anywhere as accessible yes/no glyphs
          — both take a `label` prop precisely so a translated page can
          replace the English default.
        via: export ComparisonRow
      - claim: >-
          A footnote or source line under the table via `caption` — it is a
          real `<caption>` with `[caption-side:bottom]`, so it names the table
          for assistive tech and reads as a note visually.
        via: prop ComparisonTable.caption
    watchFor:
      - note: >-
          Never put `min-w-*` on the wrapper or `overflow` on the table. The
          source calls this out: swap them and the page body scrolls
          horizontally instead of the panel. `className` lands on the wrapper,
          so a stray `min-w` there is the easy mistake.
        via: className
      - note: >-
          `featuredIndex` indexes `columns` *including* the leading row-header
          column, while body cells compute `featuredIndex === i + 1`. That is
          intentional (one index space for both) but it means
          `featuredIndex={0}` washes the header cell and nothing in the body —
          a half-marked column. Valid values start at 1.
        via: prop ComparisonTable.featuredIndex
      - note: >-
          Column widths are `w-[40%]` for the row header and `w-[20%]` for
          every other column regardless of how many there are. It is tuned for
          three answer columns; five answer columns declares 140% and the
          browser renegotiates it.
        via: prop ComparisonRow.header
      - note: >-
          `featuredIndex` reaches rows by `cloneElement` over
          `Children.toArray`, not by context (deliberately — `createContext`
          would drag this static table across the client boundary to pass one
          number). Rows must be direct, valid element children: wrap them in a
          Fragment or a wrapper component and the injection silently stops.
          Similarly, the last-row rule removal is
          `[&>tr:last-child>*]:border-b-0` on the `<tbody>`, so a `<tfoot>` or
          an extra element in there breaks it.
        via: prop ComparisonTable.featuredIndex
      - note: >-
          The accessibility contract is load-bearing and easy to erode: `<th
          scope="col">` in the head, `<th scope="row">` per row, and glyph
          cells carrying an `sr-only` word — a cell whose entire content is
          `aria-hidden` reads as "no data", not "no". Keep `label` populated
          when you pass custom markers.
        via: prop TableMarker.label
    notFor:
      - instead: Table
        why: >-
          An interactive or long data table — sorting, pagination, selection,
          hundreds of rows. This is static markup with no `use client`; use
          the `ui/table` primitive on a product surface.
      - instead: PlanCard
        why: >-
          A pricing layout where each column needs its own frame, tier chip
          and CTA button. That is `PlanCard`; a table column cannot hold an
          action.
  sections/discovery-table:
    import: "@skene/design-system/sections/discovery-table"
    exports: [DiscoveryTable]
    composes: [same-layer/artifact-shell]
    polarity: inherits
    seen: [section-discovery-table]
    props:
      DiscoveryTable:
        columns: { type: DiscoveryColumns, required: true }
        rows: { type: "DiscoveryEvent[]", required: true }
        title: { type: React.ReactNode }
        source: { type: React.ReactNode }
        separator: { type: React.ReactNode, default: "'/'" }
        summary: { type: React.ReactNode }
        summaryStatus: { type: StatPillStatus, default: "'bad'" }
        actions: { type: React.ReactNode }
    types:
      DiscoveryColumns:
        event: { type: React.ReactNode, required: true }
        type: { type: React.ReactNode, required: true }
        foundAt: { type: React.ReactNode, required: true }
        status: { type: React.ReactNode, required: true }
      DiscoveryEvent:
        event: { type: React.ReactNode, required: true }
        type: { type: React.ReactNode, required: true }
        foundAt: { type: React.ReactNode }
        status: { type: StatPillStatus, required: true }
        statusLabel: { type: React.ReactNode, required: true }
    useFor: >-
      The discovery artifact: the events Skene found, where it found them, and
      whether each one verified.
    alsoFor:
      - claim: >-
          Any found-things table with a per-row state — files scanned,
          endpoints discovered, records matched. Every column header is a prop
          and every cell is a node.
        via: prop DiscoveryTable.columns
      - claim: >-
          A table with no header bar at all: title, source, summary and
          actions are all optional and the window drops the bar when they are
          absent.
        via: prop DiscoveryTable.summary
    watchFor:
      - note: >-
          `foundAt` is the column allowed to be empty, and an empty cell is
          what breaks a table's alignment. The gallery case carries a row
          without one for that reason.
        via: type DiscoveryEvent.foundAt
    notFor:
      - instead: EvaluatorList
        why: >-
          A list of evaluations rather than of found events. That is
          EvaluatorList, which is the same window with a different column
          contract.
      - instead: KeyValueTable
        why: >-
          A settings or reference table, or any table of three columns or
          fewer. That is KeyValueTable's job — it owns per-column formatting
          at two densities and a headerless `<dl>` rendering — while this
          module is the fixed four-column discovery artifact: event, type,
          where it was found, whether it verified. Narrowing it re-derives
          KeyValueTable with the discovery chrome attached.
  sections/evaluator-check:
    import: "@skene/design-system/sections/evaluator-check"
    exports: [CheckChip, CheckFigure, CheckOperand, CheckResult, EvaluatorCheck]
    composes: [ui/badge, same-layer/artifact-shell]
    polarity: inherits
    seen: [section-evaluator-check]
    overrides: [style, className]
    customProperties: [--border]
    props:
      CheckChip:
        role: { type: boolean, default: "false" }
        children: { type: React.ReactNode, required: true }
      CheckFigure:
        label: { type: React.ReactNode, required: true }
        value: { type: React.ReactNode, required: true }
      CheckOperand:
        name: { type: React.ReactNode, required: true }
        chips: { type: React.ReactNode }
        tone: { type: StatPillStatus, default: "'warn'" }
        figures: { type: React.ReactNode }
      CheckResult:
        label: { type: React.ReactNode, required: true }
        value: { type: React.ReactNode, required: true }
      EvaluatorCheck:
        crumb: { type: React.ReactNode }
        actions: { type: React.ReactNode }
        heading: { type: React.ReactNode, required: true }
        headingNote: { type: React.ReactNode }
        metric: { type: React.ReactNode, required: true }
        formula: { type: React.ReactNode }
        qualifiers: { type: React.ReactNode }
        children: { type: React.ReactNode }
        results: { type: React.ReactNode }
        note: { type: React.ReactNode }
    useFor: >-
      The evaluator's Check tab: a metric, the formula under it, one row per
      operand, and the results it produced.
    alsoFor:
      - claim: >-
          Any computed-value explanation — a score, a rate, a derived KPI. The
          formula is a slot, so the operands can be anything.
        via: prop EvaluatorCheck.formula
      - claim: >-
          A metric with no formula at all: pass `metric` and `results` and
          leave the middle out.
        via: prop EvaluatorCheck.metric
    watchFor:
      - note: >-
          CheckChip and TagChip are the same 11px mono tag under two names —
          recorded as a known duplicate in the source rather than laundered.
        via: export CheckChip
    notFor:
      - instead: EvaluatorVerify
        why: >-
          The requirements a signal must meet, rather than the arithmetic.
          That is EvaluatorVerify.
      - instead: ScoreRing
        why: >-
          A single score with no working shown. That is ScoreRing.
    sameAs: [sections/overview-tiles#OverviewTile]
  sections/evaluator-list:
    import: "@skene/design-system/sections/evaluator-list"
    exports: [EvaluatorList, EvaluatorNote]
    composes: [same-layer/artifact-shell]
    polarity: inherits
    seen: [section-evaluator-list]
    overrides: [className]
    props:
      EvaluatorList:
        crumb: { type: React.ReactNode }
        summary: { type: "{ status: StatPillStatus; label: React.ReactNode }" }
        columns: { type: EvaluatorListColumns, required: true }
        evaluations: { type: "EvaluationEntry[]", required: true }
        note: { type: React.ReactNode }
        frame: { type: ArtFrameKind | false, default: "'jr'" }
      EvaluatorNote:
        children: { type: React.ReactNode, required: true }
    types:
      EvaluatorListColumns:
        name: { type: React.ReactNode, required: true }
        check: { type: React.ReactNode, required: true }
        metric: { type: React.ReactNode, required: true }
        confirmed: { type: React.ReactNode, required: true }
      EvaluationEntry:
        name: { type: React.ReactNode, required: true }
        check: { type: "{ status: StatPillStatus; label: React.ReactNode }", required: true }
        metric: { type: React.ReactNode }
        confirmed: { type: React.ReactNode }
    useFor: >-
      The evaluator index: every evaluation in a workspace, and whether the
      signals it depends on were found.
    alsoFor:
      - claim: >-
          Any status list with a per-row check — jobs, monitors, integrations
          tests. Four columns, all named by prop.
        via: prop EvaluatorList.columns
      - claim: >-
          Unframed, by passing `frame={false}` — the textured field is a
          placement decision, not a property of the artifact.
        via: prop EvaluatorList.frame
    watchFor:
      - note: >-
          EvaluatorNote is exported from here and re-typed in three other
          files. Import it rather than adding a fourth copy.
        via: export EvaluatorNote
    notFor:
      - instead: EvaluatorPanel
        why: >-
          The two-pane version, list beside detail. That is EvaluatorPanel.
      - instead: DiscoveryTable
        why: >-
          Found events rather than evaluations. That is DiscoveryTable.
  sections/evaluator-panel:
    import: "@skene/design-system/sections/evaluator-panel"
    exports: [EvaluatorPanel]
    composes: [same-layer/artifact-shell, same-layer/evaluator-list, same-layer/evaluator-verify]
    polarity: applies-dark
    seen: [section-evaluator-panel]
    overrides: [className]
    props:
      EvaluatorPanel:
        crumb: { type: React.ReactNode }
        summary: { type: "{ status: StatPillStatus; label: React.ReactNode }" }
        list: { type: EvaluatorPanelList, required: true }
        detail: { type: EvaluatorPanelDetail, required: true }
        note: { type: React.ReactNode }
        split: { type: boolean, default: "false" }
        activeIndex: { type: number, default: 0 }
        frame: { type: ArtFrameKind | false, default: "'jr'" }
    types:
      EvaluatorPanelList:
        columns: { type: EvaluatorListColumns, required: true }
        evaluations: { type: "EvaluationEntry[]", required: true }
      EvaluatorPanelDetail:
        title: { type: React.ReactNode, required: true }
        subtitle: { type: React.ReactNode }
        requirements: { type: "VerifyRequirement[]", required: true }
    useFor: >-
      The two-pane evaluator: the index on one side, one evaluation's
      requirements on the other.
    alsoFor:
      - claim: >-
          Any master-detail artifact where the detail is a checklist — a rule
          and its conditions, a policy and its clauses.
        via: prop EvaluatorPanel.detail
      - claim: >-
          The same list as EvaluatorList with a different detail pane, since
          `list` and `detail` are independent props.
        via: prop EvaluatorPanel.list
      - claim: >-
          The marketing wireframes' side-by-side cut with `split`: the index
          in a dark left pane (the package's own `dark` subtree switch, nested
          inside the window's forced `light` the way the product nests its
          sidebar) with `activeIndex` picking out the open row, the
          requirements in the cream right pane. Stacks back below `md`.
        via: prop EvaluatorPanel.split
    watchFor:
      - note: >-
          Its VerifyRow and MetaPill are copied line-for-line from
          evaluator-verify. The source says so and defers the merge; do not
          add a third copy.
        via: prop EvaluatorPanel.detail
      - note: >-
          In `split` mode the index renders at lower resolution — name and
          confirmed count per row; the check pill and metric belong to the
          stacked table. A caller needing all four columns beside the detail
          has outgrown the split and wants two windows.
        via: prop EvaluatorPanel.activeIndex
    notFor:
      - instead: EvaluatorVerify
        why: >-
          Only the requirements, with no index beside them. That is
          EvaluatorVerify.
  sections/evaluator-verify:
    import: "@skene/design-system/sections/evaluator-verify"
    exports: [MetaPill, VerifyRow, EvaluatorVerify]
    composes: [same-layer/evaluator-list, same-layer/key-value-table, same-layer/artifact-shell]
    polarity: inherits
    seen: [section-evaluator-verify]
    overrides: [style, className]
    customProperties: [--border]
    props:
      EvaluatorVerify:
        crumb: { type: React.ReactNode }
        summary: { type: "{ status: StatPillStatus; label: React.ReactNode }" }
        title: { type: React.ReactNode, required: true }
        subtitle: { type: React.ReactNode }
        requirements: { type: "VerifyRequirement[]", required: true }
        note: { type: React.ReactNode }
        frame: { type: ArtFrameKind | false, default: "'jr'" }
    types:
      VerifyField:
        name: { type: React.ReactNode, required: true }
        note: { type: React.ReactNode }
        status: { type: StatPillStatus, required: true }
        verdict: { type: React.ReactNode, required: true }
      VerifyRequirement:
        tags: { type: "React.ReactNode[]" }
        fields: { type: "VerifyField[]" }
    useFor: >-
      The requirements an evaluation depends on: one row per event, its
      verdict, and the fields it must carry.
    alsoFor:
      - claim: >-
          Any requirements checklist with nested sub-requirements — a schema
          contract, a compliance list, a validation report.
        via: prop EvaluatorVerify.requirements
      - claim: >-
          A flat list, by omitting `fields` on every requirement: the indent
          is what says which row to read, so uniform rows are a deliberate
          choice.
        via: type VerifyRequirement.fields
    watchFor:
      - note: >-
          `tags` is free-form because the package does not know the product's
          vocabulary. That is also why nothing validates them.
        via: type VerifyRequirement.tags
    notFor:
      - instead: EvaluatorPanel
        why: >-
          The same rows with the index beside them. That is EvaluatorPanel.
  sections/faq-band:
    import: "@skene/design-system/sections/faq-band"
    exports: [FaqBand, FaqRow]
    client: true
    composes: [patterns/marketing]
    polarity: applies-light
    seen: [section-faq-band]
    overrides: [className, use client]
    props:
      FaqBand:
        eyebrow: { type: React.ReactNode }
        title: { type: React.ReactNode, required: true }
        note: { type: React.ReactNode }
        actions: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
        multiple: { type: boolean }
      FaqRow:
        question: { type: React.ReactNode, required: true }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      The FAQ band: a heading column that stays put, and the questions beside
      it on a cream ground with a hairline per row and a round toggle.
    alsoFor:
      - claim: >-
          Any disclosure band on a marketing page — objections, a glossary,
          what's included.
        via: prop FaqRow.question
      - claim: >-
          Many rows open at once, via `multiple`, when the answers are short
          enough to scan together.
        via: prop FaqBand.multiple
      - claim: >-
          A heading column that closes with a CTA: `actions` renders under the
          note (or under the title when there is no note), so the wireframes'
          head button beside the questions no longer needs a hand-built
          column. Pass the variant that survives the cream ground — the same
          inversion caveat as the answers' links.
        via: prop FaqBand.actions
    watchFor:
      - note: >-
          `light` on the root is unconditional and there is no dark variant.
          The band ships in one tone because every FAQ on both surfaces is the
          cream one.
        via: export FaqBand
      - note: >-
          It composes Radix directly rather than ui/accordion, whose trigger
          bakes in a chevron where this band's mark is a round plus.
        via: use client
    notFor:
      - instead: Accordion
        why: >-
          A disclosure list on a product surface. That is ui/accordion, the
          primitive underneath.
      - instead: QuestionCard
        why: >-
          A static teaser grid of questions with no disclosure. That is
          QuestionGrid.
  sections/feature-row:
    import: "@skene/design-system/sections/feature-row"
    exports: [FeatureIcon, FeatureRow, FeatureStack]
    composes: [same-layer/section-backdrop]
    polarity: inherits
    seen: [section-feature-row]
    overrides: [style, className]
    customProperties: [--font-size-marketing-xl, --font-size-card-title]
    props:
      FeatureIcon:
        accent: { type: FeatureAccent, default: "'peach'" }
        children: { type: React.ReactNode, required: true }
      FeatureRow:
        reverse: { type: boolean, default: "false" }
        n: { type: React.ReactNode }
        eyebrow: { type: React.ReactNode }
        icon: { type: React.ReactNode }
        title: { type: React.ReactNode }
        lede: { type: React.ReactNode }
        children: { type: React.ReactNode }
        actions: { type: React.ReactNode }
        visual: { type: React.ReactNode }
        texture: { type: BackdropTexture }
        textureSrc: { type: string }
        sheen: { type: boolean, default: "true" }
        splitAt: { type: FeatureRowSplit, default: "'md'" }
        titleAs: { type: "'h2' | 'h3'", default: "'h3'" }
        titleScale: { type: "'row' | 'section' | 'cell'", default: "'row'" }
    useFor: >-
      A whole dark band of a page: a copy column (corner marker, ringed icon,
      title, italic lede, proof list, pinned actions) beside a visual panel,
      mirrored per row by `reverse`. The shape is an argument, not a layout —
      `title` + `lede` are the promise and `children` (usually a `CheckList`)
      is the proof, which is why the lede is its own slot rather than the
      first paragraph of the body. Ships with `FeatureStack` (the `grid gap-6`
      rhythm wrapper) and `FeatureIcon` (a ringed accent glyph in
      peach/violet/blue) so a three-row feature section is three prop sets
      rather than a re-derived grid.
    alsoFor:
      - claim: >-
          A one-off split band anywhere on the page — used without
          `FeatureStack`, with `n` and `icon` omitted, it is just
          copy-beside-visual; nothing couples it to a numbered list.
        via: export FeatureStack
      - claim: >-
          A copy-only band with no product surface at all. Omit `visual`,
          `texture` and `textureSrc` and the row drops its second cell, its
          600px floor and its split grid class, so it is one column sized to
          its copy rather than a half-filled card. This is what lets a page of
          mixed bands read as one object: skene-site has 21 copy-only bands
          against 29 with visuals, and until 0.9.18 the copy-only ones sat
          bare on the page ground beside bordered cards. `splitAt` and
          `reverse` go inert rather than erroring, so a consumer can pass them
          uniformly across a mixed set.
        via: prop FeatureRow.visual
      - claim: >-
          A grid cell's own type scale: `titleScale="cell"` renders the title
          at `--font-size-card-title` (20px), the token skene-site's cards
          already carried. Added in 0.9.20 with the grid-cell role, because
          `row` is a 28-40.8px clamp and `/resources/glossary`'s eighteen
          terms would each have had a heading larger than the section heading
          above them.
        via: prop FeatureRow.titleScale
      - claim: >-
          A cell in a 2-up or 3-up grid of small cards, which `ui/card` used
          to own on marketing pages. Since 0.9.19
          `render_marketing_cards_as_feature_row` makes this the only
          marketing card, and the copy-only path is what makes it affordable:
          a cell with no visual has no 600px floor, so skene-site's 18
          glossary terms stay near their 159px each instead of becoming
          11,232px of stacked bands. One component, and deliberately not one
          picture - a copy-only cell and a row with a visual are the same card
          at two densities.
        via: prop FeatureRow.visual
      - claim: >-
          The band that used to be cream. `LightSectionCard` keeps its export
          and its `light` mechanism for product and gallery use, but a
          marketing page that alternates one repeating object cannot also
          alternate polarity without the cream band reading as a second
          system. Removing `light` from such a call site is not cosmetic:
          every mode-aware token in the subtree keeps its dark value against a
          cream fill, and `text.primary` lands at #faf1e9 on #faf1e9, which is
          absent rather than dim.
        via: prop FeatureRow.texture
      - claim: >-
          Framing something other than a ProductWindow: `visual` is an
          unconstrained ReactNode, so an `<img>`, a `Terminal`, an
          `AnnotatedCurve` or a chart all drop in, and omitting
          `texture`/`textureSrc` gives a plain `p-[34px]` panel instead of a
          halftone field.
        via: prop FeatureRow.visual
      - claim: >-
          Non-Skene artwork behind the visual: `textureSrc` takes any URL and
          overrides `texture`, so a consumer with its own texture gets the
          same inset behaviour without touching the three bundled site fields.
        via: prop FeatureRow.textureSrc
      - claim: >-
          Body content that is not a checklist — `children` gets a full-width
          wrapper (deliberately `w-full`, not the prose measure) so a small
          table, a rule-separated spec list, or paragraphs reach the column
          edge.
        via: prop FeatureRow.children
      - claim: >-
          Reusing `FeatureIcon` on its own: it is a separate export taking
          `accent`, `className` and any `children` glyph or SVG, so the same
          three-way colour coding works in cards or lists elsewhere.
        via: export FeatureIcon
      - claim: >-
          Any marker in the corner slot: `n` is a ReactNode, so "01", "Step
          3", a date, or a small `Eyebrow` all render in the mono top-right
          position.
        via: prop FeatureRow.n
    watchFor:
      - note: >-
          Dark-surface only. The root is `bg-chrome-surface-1` and the title
          uses `text-chrome-text-primary` — invariant `chrome.*` tokens that
          by definition cannot follow a `light` ancestor (docs/sections.md
          rule 1). Adding `light` to `className` will not invert it.
        via: prop FeatureRow.title
      - note: >-
          `min-h-[600px]` applies at every breakpoint, and `actions` is pinned
          with `mt-auto` against that height. A short row will be mostly
          whitespace; `cn` is twMerge so `className="min-h-0"` wins, but then
          the actions pinning stops meaning anything.
        via: prop FeatureRow.actions
      - note: >-
          `reverse` only takes effect at `md:` (it sets `md:col-start-*`) —
          below md the copy column is always first. And it must be set
          explicitly per row: deriving it from an index breaks the moment a
          row is inserted or reordered, and these rows are content.
        via: prop FeatureRow.reverse
      - note: >-
          There is an always-on sheen over the visual cell — an `aria-hidden
          pointer-events-none` span with a hardcoded white 135° gradient. It
          is not a prop and cannot be switched off; harmless over a mock,
          visible over a photograph.
        via: prop FeatureRow.visual
    notFor:
      - instead: Card
        why: >-
          A container on a PRODUCT surface — a workspace panel, a settings
          block, anything inside Skene Cloud.
          `render_marketing_cards_as_feature_row` in machine/rules.yaml scopes
          this component to marketing pages and nothing else; `ui/card`
          remains the generic product container it has always been.
      - instead: AppPanel
        why: >-
          A panel INSIDE a drawn artifact. An artifact's own chrome is
          `AppPanel` within `ArtifactShell`; this component is what the
          artifact sits in, not what it is made of. Nesting one in the other
          puts a 600px marketing band inside a depiction.
  sections/final-cta:
    import: "@skene/design-system/sections/final-cta"
    exports: [FinalCta]
    polarity: inherits
    seen: [section-final-cta, section-final-cta-eyebrow]
    overrides: [style, className]
    props:
      FinalCta:
        backdrop: { type: string | false }
        actions: { type: React.ReactNode }
        lede: { type: React.ReactNode }
        eyebrow: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      The closing band: full-bleed, centred, one large heading, an optional
      lede and an actions row, over a textured dark backdrop. It appears twice
      on the live homepage and once per subpage, and every instance had
      previously been rebuilt by hand. The default backdrop (`pixel-bg.webp`,
      143 KB) ships with the package and is resolved from the module itself,
      on the principle that the default should produce the section the site
      actually has rather than a stripped-down gradient the caller has to
      re-dress.
    alsoFor:
      - claim: >-
          Any full-bleed closing band, not just signup — `children` is the
          heading node and `actions` is a free slot, so waitlist, newsletter,
          "book a demo", or an end-of-doc band all fit without changes.
        via: prop FinalCta.children
      - claim: >-
          Per-page texture: `backdrop` takes any URL string (including a
          `data:` URI); `backdrop={false}` renders the gradient alone for a
          quieter band on a page that already has texture.
        via: prop FinalCta.backdrop
      - claim: >-
          Non-button actions. The wrapper is `flex flex-col … sm:flex-row
          gap-3`, so an email input plus a submit button, or a client `<form>`
          island, drops in as `actions` while the band itself stays a server
          component.
        via: prop FinalCta.actions
      - claim: >-
          Height and rhythm tuning via `className` — `min-h-*` and padding
          merge through tailwind-merge, so `min-h-[380px]` makes a mid-page
          band out of the same component.
        via: className
    watchFor:
      - note: >-
          Every colour is an inline `style`: the section background
          (`--color-chrome-surface-deep`) and the `linear-gradient(...) ,
          url(...)` scrim with `saturate(70%)`. Utility classes in `className`
          lose to inline styles, so you cannot recolour or re-scrim it from
          the call site.
        via: inline style
      - note: >-
          All type uses invariant `chrome.text.*`. This band is dark by
          construction — adding `light` will not invert it and will break any
          mode-aware node you pass into `actions`.
        via: prop FinalCta.actions
      - note: >-
          The heading is a hardcoded `<h2>` at `clamp(2.75rem, 5vw, 5rem)`. A
          page that needs this to be its `<h1>`, or a visibly smaller heading,
          needs a prop addition (`as`/`headingLevel`) rather than a class.
        via: prop FinalCta.title
      - note: >-
          The default backdrop resolves via `new
          URL('../../assets/pixel-bg.webp', import.meta.url)`. Bundlers that
          understand that pattern (Next included) emit a real asset URL; one
          that does not will emit a broken path — pass an explicit URL or
          `false` as the escape hatch.
        via: prop FinalCta.backdrop
      - note: >-
          `min-h-[560px]` / `md:min-h-[610px]` plus `py-[90px]`: it is a whole
          band and will dominate a short page.
        via: className
    notFor:
      - instead: LightSectionCard
        why: >-
          A cream or inverted CTA panel, or an inline mid-page CTA card — use
          `LightSectionCard`, which is the documented choice for "a cream
          panel with copy and buttons" and carries the `light` class properly.
      - instead: DitheredMedia
        why: >-
          A hero. The fixed dark scrim, `<h2>`, and centred single-column
          layout are closing-band shape; use `DitheredMedia` for a full hero
          composition or `HeroBackdrop` for a hero strip.
  sections/finding-card:
    import: "@skene/design-system/sections/finding-card"
    exports: [Finding, MetricCard, Sparkline]
    composes: [lib/status]
    polarity: inherits
    seen: [section-finding-card]
    overrides: [style, className]
    props:
      Finding:
        status: { type: FindingStatus, required: true }
        tag: { type: React.ReactNode, required: true }
        title: { type: React.ReactNode, required: true }
        note: { type: React.ReactNode }
        onLight: { type: boolean, default: "true" }
      MetricCard:
        label: { type: React.ReactNode, required: true }
        value: { type: React.ReactNode, required: true }
        delta: { type: React.ReactNode }
        trend: { type: FindingStatus, default: "'danger'" }
        children: { type: React.ReactNode }
      Sparkline:
        bars: { type: "number[]", required: true }
        highlight: { type: number }
    useFor: >-
      Three small pieces that together fill a product window with Skene's
      actual argument: `Finding` (a status-tagged row — tag, title,
      consequence), `MetricCard` (the headline number with a coloured delta),
      and `Sparkline` (an authored bar shape). The point of the set is the
      contradiction — a metric that looks fine above a list of steps that are
      unmeasured or renamed — so the status vocabulary is fixed at `good |
      warn | danger` bound to `semantic.matcha / warningAmber / errorRed`, the
      same three the dashboard uses. All content is props; nothing here knows
      what a Skene finding says.
    alsoFor:
      - claim: >-
          Any KPI tile: `MetricCard` takes `label`, `value`, `delta` and
          `trend` as ReactNodes and has no light/dark flag at all — it
          inherits colour from its parent — and `children` is an open slot
          under the number for whatever the caller wants there.
        via: export MetricCard
      - claim: >-
          Status rows on the dark page: `Finding onLight={false}` switches the
          card to `chrome.line.subtle` / `chrome.surface.2` /
          `chrome.text.primary`, which is what you want directly on the page
          ground or inside a `tone="dark"` ProductWindow.
        via: prop Finding.onLight
      - claim: >-
          Labelled list rows generally — `tag` is a ReactNode, not a number,
          so "GAP", "01", "P2" or "PII" all work; the same row shape serves
          audit results, a check-run summary, or a release-note list.
        via: prop Finding.tag
      - claim: >-
          A compact one-line variant: `note` is optional, and with it omitted
          the grid collapses to tag plus title with no second row.
        via: prop Finding.note
      - claim: >-
          `Sparkline` on its own: it is a pure `bars: number[]` (clamped
          0–100) plus a `highlight` index with no dependency on `MetricCard`,
          and `className` merges last (twMerge) so its `h-[74px]` and `mt-6`
          defaults are adjustable in a table cell or a card footer.
        via: export Sparkline
    watchFor:
      - note: >-
          `Finding`'s tag column is a hard `grid-cols-[68px_1fr]`. The tag
          does not widen the column — a longer string wraps or overflows
          inside 68px, and the type is 9px mono uppercase sized for roughly
          "STEP 3".
        via: export Finding
      - note: >-
          `onLight` defaults to **true**, the opposite of most flags in this
          package, because the default frame is a light `ProductWindow`. Put a
          `Finding` on the dark page without `onLight={false}` and you get a
          white card. Note also that the light case is `bg-white`, not the
          cream `brand.light` of its parent — deliberate, so the card floats
          on the window's fill.
        via: default onLight=true
      - note: >-
          `Sparkline` is `aria-hidden` and is explicitly not a chart: no axes,
          no scale, and `highlight` is an index because the copy decides which
          bar matters, not the data. Anything a reader must actually read has
          to live in `MetricCard`'s `value` or `delta`.
        via: export Sparkline
      - note: >-
          `MetricCard`'s `trend` defaults to `'danger'`, so an unspecified
          delta renders red; and its numeral is intentionally `font-normal` at
          2.6rem with tight tracking, because bolding it makes the page read
          like a dashboard instead of an argument about one.
        via: export MetricCard
    notFor:
      - instead: Sparkline
        why: >-
          Real data visualization. `Sparkline` has no scale, axes, tooltips or
          empty state, and its values are authored — reach for an actual
          charting component when the numbers are measured.
      - instead: Eyebrow
        why: >-
          Product-surface status inside the app. These are marketing
          components with hardcoded typographic scale and no loading/empty
          states; `ui/badge` is the shadcn status primitive for product
          surfaces (and `Eyebrow` is the section kicker — the three are not
          interchangeable).
  sections/flow-diagram:
    import: "@skene/design-system/sections/flow-diagram"
    exports: [FlowDiagram, FlowNode, FlowEdge]
    polarity: inherits
    seen: [section-flow-diagram]
    overrides: [className]
    props:
      FlowDiagram:
        children: { type: React.ReactNode, required: true }
        note: { type: React.ReactNode }
      FlowNode:
        label: { type: React.ReactNode, required: true }
        detail: { type: React.ReactNode }
      FlowEdge:
        value: { type: React.ReactNode }
        meta: { type: React.ReactNode }
    useFor: >-
      Nodes in a row joined by arrows, with a value and a note on each edge.
    alsoFor:
      - claim: >-
          Any pipeline or path with a measurable step-to-step drop — a funnel,
          a queue, a state machine.
        via: prop FlowEdge.value
      - claim: >-
          A plain sequence with unlabelled edges: `value` and `meta` are both
          optional.
        via: prop FlowEdge.meta
    watchFor:
      - note: >-
          It scrolls horizontally rather than wrapping, so a long chain stays
          a chain. That is deliberate and a wrap would read as two flows.
        via: prop FlowDiagram.children
    notFor:
      - instead: PipelineStepper
        why: >-
          Progress through named stages, with done/active/pending states. That
          is PipelineStepper.
      - instead: Funnel
        why: >-
          Proportional bars rather than nodes. That is Funnel.
  sections/footer:
    import: "@skene/design-system/sections/footer"
    exports: [SiteFooter, FooterColumn, FooterLink, SocialLinks, SocialLink]
    polarity: inherits
    seen: [section-footer]
    overrides: [style, className]
    props:
      SiteFooter:
        brand: { type: React.ReactNode }
        wordmark: { type: React.ReactNode }
        copyright: { type: React.ReactNode }
        legal: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
      FooterColumn:
        title: { type: React.ReactNode, required: true }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      The site footer as a set of composable parts — `SiteFooter` (brand
      column, link columns, bottom bar), `FooterColumn`, `FooterLink`,
      `SocialLinks`, `SocialLink`. The part actually worth reusing is the
      oversized wordmark: 29vw at 1.7% opacity, clipped by the footer's own
      `overflow-hidden`, so it reads as texture at a glance and only resolves
      into a word if you look. Rendering it at a "sensible" size or opacity is
      the obvious change and it is wrong every time.
    alsoFor:
      - claim: >-
          The sub-components stand alone. `FooterColumn` is a self-contained
          `<nav>` with its own heading and grid, so a link cluster works in a
          mega-menu, a sitemap block, or a docs index without `SiteFooter`
          around it.
        via: export FooterColumn
      - claim: >-
          Router-aware links: `FooterColumn` children are `ReactNode`, so
          `next/link` (or any framework Link) can be used directly where
          client-side navigation matters — `FooterLink` is a plain `<a href>`
          with no `asChild`.
        via: export FooterColumn
      - claim: >-
          A bar-only footer. `brand`, `wordmark`, `copyright` and `legal` are
          all optional and the bottom bar only renders when `copyright ||
          legal` is present, so a minimal legal strip is reachable.
        via: prop SiteFooter.brand
      - claim: >-
          `wordmark` takes any `ReactNode` — a product name, a single tagline
          word, an inline SVG — and it is `aria-hidden`, so it never enters
          the accessibility tree whatever you put there.
        via: prop SiteFooter.wordmark
      - claim: >-
          `brand` is a free slot: logo plus copy plus `SocialLinks` in the
          demo, but a newsletter form or a status badge fits the same column
          (`col-span-full lg:col-span-1`).
        via: prop SiteFooter.brand
    watchFor:
      - note: >-
          `FooterColumn` does `aria-label={String(title)}`. Pass a string.
          Pass JSX and every column's landmark is labelled "[object Object]" —
          the gallery case casts `title as string` for this reason.
        via: export FooterColumn
      - note: >-
          The link grid template is `lg:grid-cols-[1.7fr_repeat(3,1fr)]` —
          sized for brand plus exactly three columns — and it sits on an inner
          `<div>` that has no `className` hook. `className` lands on the
          `<footer>` root, so you cannot retemplate the columns from the call
          site; a fourth column wraps to a second row.
        via: prop SiteFooter.brand
      - note: >-
          The wordmark's `color: rgba(255,255,255,0.017)` is an inline style,
          so `text-*` utilities cannot touch it, and the value is deliberate —
          see the file header before "fixing" it.
        via: prop SiteFooter.wordmark
      - note: >-
          `overflow-hidden` on the root is what clips the wordmark, and it
          will equally clip anything absolutely positioned that you put in
          `brand` (a popover, a tooltip, a dropdown).
        via: prop SiteFooter.brand
      - note: >-
          Everything is invariant `chrome.*` (`bg-chrome-surface-deep-2`,
          `chrome-text-muted-warm`), so the whole component assumes an
          always-dark page.
        via: className
      - note: >-
          `SocialLink` requires `label` — the child is an icon, so without it
          the link has no accessible name. That requirement is in the type; do
          not work around it.
        via: export SocialLink
    notFor:
      - instead: Card
        why: >-
          An in-app or workspace footer, or any footer on a light page. The
          invariant `chrome.*` tokens cannot invert; build product-surface
          footers from `ui/card` / plain nav markup.
      - instead: FooterColumn
        why: >-
          Primary site navigation. `FooterColumn` is a column of quiet 14px
          links with a label-sized `<h2>`; use the `PillNav` pattern from
          `patterns/marketing` for the top bar.
  sections/funnel:
    import: "@skene/design-system/sections/funnel"
    exports: [FunnelRow, Funnel]
    composes: [same-layer/artifact-shell]
    polarity: inherits
    seen: [section-funnel]
    overrides: [style, className]
    customProperties: [--muted-foreground]
    props:
      FunnelRow:
        label: { type: React.ReactNode, required: true }
        note: { type: React.ReactNode }
        value: { type: React.ReactNode }
        state: { type: FunnelStepState, required: true }
        fill: { type: number }
      Funnel:
        title: { type: React.ReactNode, required: true }
        badge: { type: React.ReactNode }
        meta: { type: React.ReactNode }
        status: { type: FunnelStepState, default: "'ok'" }
        children: { type: React.ReactNode }
    useFor: >-
      The activation funnel as the reader's own dashboard would draw it: one
      bar per step, and three states because a broken number is not a low
      number.
    alsoFor:
      - claim: >-
          Any staged conversion chart where some steps are untrustworthy —
          onboarding, checkout, a signup path.
        via: prop FunnelRow.state
      - claim: >-
          A plain proportional bar chart, by leaving every row `ok` and
          passing `fill`.
        via: prop FunnelRow.fill
    watchFor:
      - note: >-
          `broken` renders a hatch, not a short solid bar, and `unknown`
          renders an empty dashed track with no fill element at all. A zero
          bar would be a lie, which is why the value cell says not measured
          instead of 0.
        via: prop FunnelRow.state
      - note: >-
          It is built on the light app window on purpose: this chart is the
          reader's own tool, not a Skene screen. Giving it a Skene crumb
          breaks the argument.
        via: prop Funnel.title
    notFor:
      - instead: MiniFunnel
        why: >-
          A small label/value/bar readout beside a journey track. That is
          MiniFunnel.
      - instead: Progress
        why: >-
          A determinate control-surface bar. That is ui/progress.
  sections/glyph-badge:
    import: "@skene/design-system/sections/glyph-badge"
    exports: [GlyphBadge]
    polarity: inherits
    seen: [section-glyph-badge]
    overrides: [style, className]
    props:
      GlyphBadge:
        tone: { type: GlyphBadgeTone, default: "'tint'" }
        size: { type: number, default: 38 }
        glyphSize: { type: number | string }
        children: { type: React.ReactNode }
    useFor: >-
      The round disc a glyph sits in at the head of a row: a circle, a
      hairline, a peach mark centred in it, `aria-hidden` always. It is the
      disc `TrustFact` draws, lifted out so it is reachable without the
      `<li>`, the separating rule and the qualifier slot that come with a fact
      row. `tone` picks the ground — `tint` is the cream-panel pair
      (`chrome.line.onLight` over a 12% peach wash), `muted` is the themed
      pair that follows the page — and `size` is one number, written to
      `style` so the glyph inside keeps whatever type size it inherits.
    alsoFor:
      - claim: >-
          Any icon-led row, on cream or on the page ground: a status glyph, a
          numbered marker, a two- or three-letter code. Nothing here knows
          what the mark means, and the disc still renders when `children` is
          empty — which is what keeps a stack of rows aligned on their titles
          when only some of them carry one.
        via: prop GlyphBadge.children
      - claim: >-
          The 32px events-row badge skene-site keeps a local file for:
          `size={32}` with `tone="muted"` and `font-mono` through `className`
          is that component, exactly.
        via: prop GlyphBadge.size
      - claim: >-
          A quiet initials or code disc — two or three characters,
          `tone="muted"`. At that point it is a circle with the themed border
          over `bg-muted` and carries no state at all.
        via: prop GlyphBadge.tone
    watchFor:
      - note: >-
          `size` is written to `style`, following `ScoreRing`, so a `size-*` /
          `h-*` / `w-*` utility passed through `className` cannot beat it:
          inline styles win and `cn` does not merge across the two. Pass the
          number.
        via: prop GlyphBadge.size
      - note: >-
          `tint` is cream-only. Its hairline is `chrome.line.onLight` — the
          invariant dark rule made for a cream fill — and its wash is a 12%
          peach mix written inline. On the dark page that border is all but
          gone; `muted` is the tone for a themed ground.
        via: "default tone='tint'"
      - note: >-
          `aria-hidden` is unconditional and there is no prop to lift it.
          Every glyph this has held is decoration beside a real title, and
          announcing "check mark" before the sentence only delays it. If your
          mark IS the content — an avatar identifying a person — it needs an
          element that will be read out.
        via: export GlyphBadge
      - note: >-
          Nothing scales with `size`. The glyph takes the ambient type size,
          because a tick and a three-letter city code do not want the same one
          — which is also why `TrustFact`'s 38px rendering did not move when
          the disc was extracted.
        via: prop GlyphBadge.size
    notFor:
      - instead: FeatureIcon
        why: >-
          The mark that carries a feature row's identity. `FeatureIcon` is
          44px with an accent-tinted border at 47%, a 7px inset ring and a
          peach/violet/blue union, and it is deliberately not `aria-hidden`.
      - instead: TrustFact
        why: >-
          A whole fact row — the disc plus a title, a qualifier and the rule
          under it, as an `<li>`. That is `TrustFact`, which composes this at
          its defaults.
    sameAs: [sections/trust-panel#TrustFact, sections/feature-row#FeatureIcon]
  sections/integration-rows:
    import: "@skene/design-system/sections/integration-rows"
    exports: [IntegrationRows]
    composes: [same-layer/artifact-shell]
    polarity: inherits
    seen: [section-integration-rows]
    overrides: [className]
    props:
      IntegrationRows:
        rows: { type: "Integration[]", required: true }
        title: { type: React.ReactNode }
        source: { type: React.ReactNode }
        separator: { type: React.ReactNode, default: "'/'" }
        summary: { type: React.ReactNode }
        summaryStatus: { type: StatPillStatus, default: "'ok'" }
        actions: { type: React.ReactNode }
    types:
      Integration:
        id: { type: string }
        name: { type: React.ReactNode, required: true }
        note: { type: React.ReactNode }
        status: { type: StatPillStatus }
        statusLabel: { type: React.ReactNode }
        aside: { type: React.ReactNode }
        className: { type: string }
    useFor: >-
      The integrations artifact: what Skene is attached to, and whether each
      connection is live.
    alsoFor:
      - claim: >-
          Any connection or account list where the right-hand cell is a state
          — data sources, webhooks, installed apps.
        via: type Integration.status
      - claim: >-
          A row whose supporting line is an identifier rather than a sentence,
          by passing a TagChip as the note — which is why `note` is a node.
        via: type Integration.note
      - claim: >-
          An extra cell per row via `aside`, for a timestamp or a link.
        via: type Integration.aside
    watchFor:
      - note: >-
          It is rows, not a table, and that is load-bearing at 390px: the left
          cell is prose of varying length and the right is a pill whose width
          is its word. A table column has one width for every row.
        via: prop IntegrationRows.rows
    notFor:
      - instead: DataRow
        why: >-
          A real column contract with headers. That is DataTable.
      - instead: KeyValueTable
        why: >-
          Key/value reference data. That is KeyValueTable.
  sections/integrations-highlight:
    import: "@skene/design-system/sections/integrations-highlight"
    exports: [IntegrationsHighlight]
    composes: [same-layer/card-animation-integrations, same-layer/light-section-card]
    polarity: inherits
    seen: []
    overrides: [className]
    props:
      IntegrationsHighlight:
        backgroundImage: { type: string }
        actions: { type: React.ReactNode }
    useFor: >-
      The homepage integrations band: cream copy column plus the four-card
      GSAP animation. Ported from skene-marketing-website's
      IntegrationsHighlight.
    alsoFor:
      - claim: >-
          Custom CTAs via `actions`; pass outline `<Button>`s sized for a
          cream card.
        via: prop IntegrationsHighlight.actions
      - claim: >-
          A different texture behind the animation via `backgroundImage`.
        via: prop IntegrationsHighlight.backgroundImage
    watchFor:
      - note: >-
          Composes `LightSectionCard` and `CardAnimationIntegrations`; the
          animation is client-only.
        via: export IntegrationsHighlight
    notFor:
      - instead: LightSectionCard
        why: >-
          A generic cream band when you want different copy or a static visual
          instead of this animation.
  sections/journey-signal-scene:
    import: "@skene/design-system/sections/journey-signal-scene"
    exports: [JourneySignalScene]
    client: true
    polarity: inherits
    seen: []
    overrides: [use client]
    customProperties: [--font-primary, --font-geist-sans, --font-mono, --font-geist-mono, --font-size-xs, --font-size-base, --line-height-relaxed, --radius-xs]
    useFor: >-
      Evidence, a traced journey step, and the PR review that catches it
      breaking, in one animated composition with a GTM/Engineering toggle. No
      props — content lives in named consts near the top of the source file,
      edited directly rather than passed in. Measures its own container width
      and switches between three hand-placed layouts (a three-panel row, a
      hero-column-width layout, a stacked phone layout) rather than using CSS
      breakpoints, because the same panel widths read differently depending on
      which parent gives it space.
    alsoFor:
      - claim: >-
          Any `light`-classed container at any width, not just the `Bridge`
          band it originally shipped inside. It measures its own container and
          switches layout at 720px and 420px, which is what let
          skene-marketing-website drop it into a split hero's narrower right
          column as a second, real placement rather than a copy.
        via: export JourneySignalScene
    watchFor:
      - note: >-
          Requires a `light` ancestor. Its tokens alias straight to this
          package's `--color-text-primary` etc., which default to the DARK
          reading (near-white) without one, and every card in the scene has a
          white/cream background regardless of page theme — without `light`
          somewhere above it, the ink text renders near-invisible on its own
          cards. `polarity: inherits` in the derived block below is why: this
          module sets no `light`/`dark` class itself, unlike a self-contained
          band such as `Bridge`.
        via: export JourneySignalScene
      - note: >-
          The only styled-components module in the package
          (`documentation/20260825_journey_signal_scene_design.md` records
          why: a straight port of a component the founder already rejected
          rebuilding on package primitives once). Importing it does not pull
          styled-components into anything else, but do not use it as precedent
          for a second one — the exception is this component's history, not a
          reopened door.
        via: export JourneySignalScene
    notFor:
      - instead: JourneyTrack
        why: >-
          A funnel or lifecycle strip with per-step status and no
          code/PR-review framing. This scene's Flows panel is a fixed
          three-row funnel illustrating the argument, not a general-purpose
          funnel primitive — for that, use `JourneyTrack`/`MiniFunnel`.
      - instead: PrReview
        why: >-
          A PR review card on its own, outside the evidence-and-journey-step
          composition, or with different content than the built-in demo. This
          module has no props to swap the review's contents; `PrReview` is the
          standalone primitive for a review that needs its own data.
  sections/journey-track:
    import: "@skene/design-system/sections/journey-track"
    exports: [JourneyStep, JourneyTrack, MiniFunnel]
    composes: [lib/status]
    polarity: inherits
    seen: [section-journey-track]
    overrides: [style, className]
    customProperties: [--journey-connector-angle, --mini-funnel-fill]
    props:
      JourneyTrack:
        steps: { type: "JourneyStepItem[]", required: true }
        title: { type: React.ReactNode }
        subtitle: { type: React.ReactNode }
      MiniFunnel:
        rows: { type: "MiniFunnelRowItem[]", required: true }
    types:
      JourneyStepItem:
        label: { type: React.ReactNode, required: true }
        note: { type: React.ReactNode }
        state: { type: JourneyStepState, required: true }
        glyph: { type: React.ReactNode }
      MiniFunnelRowItem:
        label: { type: React.ReactNode, required: true }
        value: { type: React.ReactNode, required: true }
        fill: { type: number, required: true }
    useFor: >-
      The numbered steps of a funnel on one line, where the connector between
      two steps is a gradient running from one step's status colour to the
      next's — the seam carries the state, not just the nodes. That is the
      section's argument, not a flourish: breakage happens *in the link* (an
      event that stops firing between checkout and confirmation), and the eye
      should find it before reading a label. The module also exports
      `MiniFunnel`, the small authored label/value/bar readout that usually
      sits beside the track.
    alsoFor:
      - claim: >-
          Any three-state pipeline, not just a purchase funnel: onboarding
          checklists, deploy stages, data-source health. States are the fixed
          `good | warn | danger` triple bound to matcha/amber/red — the same
          vocabulary `Finding` uses — and `note` is free prose, so the domain
          lives entirely in the caller's copy.
        via: type JourneyStepItem.note
      - claim: >-
          Building your own layout from `JourneyStep`, which is exported
          separately. Its `index` prop is a `ReactNode` and `JourneyTrack`
          merely fills in the 1-based position, so rendering steps directly
          lets you pass a glyph (✓, ✕, an icon) or your own numbering into the
          ring.
        via: export JourneyStep
      - claim: >-
          Both orientations with no prop: the track is a stacked column below
          `md` and a row from `md` up, and the connector's gradient angle
          rides a `--journey-connector-angle` custom property specifically
          because an inline style cannot hold a media query. You get vertical
          and horizontal for free — but only that pairing; forcing one
          orientation means overriding classes.
        via: inline style
      - claim: >-
          Server rendering and animated composition. There is no `use client`
          and no internal state — state arrives as props — so a track that
          advances composes by re-rendering, and it drops into a server
          component without pulling a client boundary around its siblings.
        via: type JourneyStepItem.state
      - claim: >-
          `MiniFunnel` on its own, anywhere a small ranked readout helps:
          quota usage, share-of-total, step drop-off. Its bar width is routed
          through the `--mini-funnel-fill` custom property rather than set on
          `width` directly, which is the deliberate seam for a wrapper to
          transition or override it (grow-on-scroll, staged entrance) without
          this component owning any animation or state.
        via: export MiniFunnel
      - claim: >-
          A verified or annotated track without composing steps by hand: each
          step's `glyph` replaces the ring's 1-based number (a ✓ on a proven
          step, per step, so a track can mix glyphed and numbered rings) while
          `JourneyTrack` still owns the connectors — the seam gradients keep
          deriving from the states with no re-derivation at the call site.
        via: type JourneyStepItem.glyph
    watchFor:
      - note: >-
          The 34px ring size is hard-coded into the connector, not read from
          it: `ml-[17px]` stacked and `md:mt-[17px]` in a row are both half
          the ring. Resizing the ring via `JourneyStep`'s `className` leaves
          the connector aligned to the old centre.
        via: export JourneyStep
      - note: >-
          This section owns no ground and carries no `light` / `dark` class of
          its own by design — every colour is a mode-aware role or derived
          from one, and nothing uses `chrome.text.*`. A caller putting it on a
          cream fill inside a dark page must put `light` on that band (rule
          2), or `semantic.matcha` resolves to its dark value at 1.16:1 on
          cream.
        via: type MiniFunnelRowItem.value
      - note: >-
          The ring is `aria-hidden` and the label stays `text.primary` in
          *every* state — that is the rule the section exists to keep, not an
          oversight. So `note` is the only place the state is both announced
          and readable; a caller who omits it ships a broken step that only
          sighted readers can identify.
        via: type JourneyStepItem.note
      - note: >-
          Two intentional non-obviousnesses that look like bugs: a `warn` end
          fades its connector to `surface.border` grey rather than
          contributing amber (an unmeasured step has no claim to make about
          the link), and `MiniFunnel`'s bars are `aria-hidden`, authored, and
          clamped 0-100 independently of `value` — the bar and the figure can
          disagree if the caller lets them.
        via: export MiniFunnel
    notFor:
      - instead: MiniFunnel
        why: >-
          A measured funnel chart. `MiniFunnel` has no axis and no scale, the
          widths are authored rather than computed, and its fill is
          `brand.peach` on purpose so quantities never borrow the status
          triple. For a shape-at-a-glance trend use `Sparkline`; for real
          numbers use a chart.
      - instead: PipelineStepper
        why: >-
          A progress indicator for a running job, or an interactive wizard.
          `PipelineStepper` owns the `done | active | pending` vocabulary and
          emphasises the active step; `JourneyTrack` has no active state, no
          state at all, and no click handling.
    sameAs: [sections/pipeline-stepper#PipelineStepper]
  sections/key-value-table:
    import: "@skene/design-system/sections/key-value-table"
    exports: [KeyValueTable, MaskedValue, TableNote, TagChip]
    composes: [same-layer/artifact-shell]
    polarity: inherits
    seen: [section-key-value-table]
    overrides: [style, className]
    customProperties: [--border]
    props:
      KeyValueTable:
        columns: { type: "KeyValueColumn[]", required: true }
        rows: { type: "KeyValueRow[]", required: true }
        density: { type: KeyValueDensity, default: "'reference'" }
        headerless: { type: boolean, default: "false" }
      MaskedValue:
        prefix: { type: React.ReactNode }
        length: { type: number, default: 16 }
      TableNote:
        children: { type: React.ReactNode, required: true }
      TagChip:
        variant: { type: TagChipVariant, default: "'outline'" }
        children: { type: React.ReactNode, required: true }
    types:
      KeyValueColumn:
        header: { type: React.ReactNode, required: true }
        mono: { type: boolean }
        muted: { type: boolean }
        strong: { type: boolean }
        nowrap: { type: boolean }
        className: { type: string }
      KeyValueRow:
        id: { type: string }
        cells: { type: "React.ReactNode[]", required: true }
        className: { type: string }
    useFor: >-
      The reference table: keys and values at two densities, with a masked
      value, a note and the 11px tag chip.
    alsoFor:
      - claim: >-
          Any settings, environment or schema reference — the `reference`
          density drops the row fill and hover so it stops reading as a data
          grid.
        via: prop KeyValueTable.density
      - claim: >-
          A secret or token display via MaskedValue, which shows a prefix and
          a fixed number of dots.
        via: prop MaskedValue.length
      - claim: >-
          Column-level formatting without touching cells: mono, muted, strong
          and nowrap are per-column flags.
        via: type KeyValueColumn.mono
      - claim: >-
          The headerless key/value list — a settings readout whose column
          headings would only repeat what every row already says. `headerless`
          renders the same rows and column flags as a semantic `<dl>` (the
          term, then one `<dd>` per value column) rather than a table with
          visually hidden headers; the file header records why `sr-only`
          `<th>`s were rejected.
        via: prop KeyValueTable.headerless
    watchFor:
      - note: >-
          TagChip is one of five names in this package for the same 11px mono
          tag. Prefer it, and do not add a sixth.
        via: prop TagChip.variant
    notFor:
      - instead: DiscoveryTable
        why: >-
          A found-things table with per-row status. That is DiscoveryTable.
      - instead: TableRow
        why: >-
          An interactive product grid. That is ui/table.
  sections/lifecycle-canvas:
    import: "@skene/design-system/sections/lifecycle-canvas"
    exports: [LifecycleCanvas]
    composes: [same-layer/artifact-shell, same-layer/key-value-table]
    polarity: inherits
    seen: [section-lifecycle-canvas]
    props:
      LifecycleCanvas:
        stages: { type: "LifecycleStageItem[]", required: true }
        title: { type: React.ReactNode }
        source: { type: React.ReactNode }
        separator: { type: React.ReactNode, default: "'/'" }
        summary: { type: React.ReactNode }
        summaryStatus: { type: StatPillStatus, default: "'ok'" }
        actions: { type: React.ReactNode }
    types:
      LifecycleMilestoneItem:
        name: { type: React.ReactNode, required: true }
        description: { type: React.ReactNode }
        bindings: { type: "React.ReactNode[]" }
      LifecycleStageItem:
        key: { type: React.ReactNode }
        name: { type: React.ReactNode, required: true }
        description: { type: React.ReactNode }
        milestones: { type: "LifecycleMilestoneItem[]" }
    useFor: >-
      The lifecycle artifact: stages across the canvas, each holding
      milestones and the signals bound to them.
    alsoFor:
      - claim: >-
          Any two-level map — phases and their steps, epics and their stories,
          a journey and its moments.
        via: type LifecycleStageItem.milestones
      - claim: >-
          A single-level row of stages, by omitting milestones entirely.
        via: type LifecycleStageItem.description
      - claim: >-
          Binding names as chips, since `bindings` is a list of nodes.
        via: type LifecycleMilestoneItem.bindings
    watchFor:
      - note: >-
          It scrolls horizontally with a 190px column floor rather than
          wrapping, so a long lifecycle stays one canvas.
        via: prop LifecycleCanvas.stages
    notFor:
      - instead: JourneyStep
        why: >-
          A single line of steps with a state-carrying connector. That is
          JourneyTrack.
      - instead: FlowNode
        why: >-
          Nodes joined by arrows with per-edge values. That is FlowDiagram.
  sections/light-section-card:
    import: "@skene/design-system/sections/light-section-card"
    exports: [LightSectionCard]
    composes: [patterns/marketing]
    polarity: applies-light
    seen: [section-light-section-card, light-section-card-steps]
    overrides: [style, className]
    customProperties: [--font-size-marketing-xl]
    props:
      LightSectionCard:
        eyebrow: { type: React.ReactNode }
        title: { type: React.ReactNode, required: true }
        titleScale: { type: "'display' | 'section'", default: "'display'" }
        lede: { type: React.ReactNode }
        children: { type: React.ReactNode }
        actions: { type: React.ReactNode }
        visual: { type: React.ReactNode }
        reverse: { type: boolean, default: "false" }
    useFor: >-
      The inverted band: one cream card carrying a whole section's worth of
      copy — heading, italic promise, a ruled proof block, actions — with an
      optional visual panel opposite. It is `FeatureRow` at the other
      polarity, and its `light` root is a load-bearing accessibility
      mechanism, which is why the two were deliberately NOT collapsed behind a
      `tone` flag. SCOPE NARROWED IN 0.9.19: this is no longer a marketing
      section band. `render_marketing_cards_as_feature_row` gives that role to
      `FeatureRow` alone, because a page that alternates one repeating object
      cannot also alternate polarity without the cream band reading as a
      second system. What remains is every non-marketing use — product
      surfaces, gallery cases, and any dark-document context needing a
      correctly-inverted cream subtree, which is the part no other component
      does.
    alsoFor:
      - claim: >-
          A closing CTA panel: `title` + `lede` + `actions`, no `visual` and
          no `children`. Without `visual` the grid stays single-column and you
          get a plain cream panel — `docs/sections.md` names this as the
          alternative to `FinalCta` when you want a panel rather than a
          full-bleed textured band.
        via: prop LightSectionCard.title
      - claim: >-
          Media-left layouts via `reverse`, which mirrors the grid with
          `md:col-start-*` / `md:row-start-1` on both columns rather than
          reordering the DOM (reading order stays copy-first).
        via: prop LightSectionCard.reverse
      - claim: >-
          Any node in `visual` — an image, a `ProductWindow` of either tone, a
          chart, an `AnnotatedCurve`. The column is `grid place-items-center`
          with no padding of its own and the root is `overflow-hidden`, so a
          full-bleed photo reaches the rounded edge and an inset one just pads
          the node you pass.
        via: prop LightSectionCard.visual
      - claim: >-
          `children` is a free body slot, not a list API: a `<CheckList
          onLight>`, prose, a small table. It is given full column width on
          purpose (not a prose measure) so a CheckList's rules run the width
          of the column.
        via: prop LightSectionCard.children
      - claim: >-
          `actions` is a slot rather than a label/href pair, so it takes one
          button, two, or a button plus fine print — and lets you pick a
          variant that survives the inversion.
        via: prop LightSectionCard.actions
      - claim: >-
          An eyebrowed band: `eyebrow` renders the package `Eyebrow` above the
          title with the on-cream overrides applied inside the card — the
          caller passes content, never colour, and cannot reintroduce the
          invisible-chrome-ink-on-cream trap the trust-panel story documents.
        via: prop LightSectionCard.eyebrow
    watchFor:
      - note: >-
          `light` on the root is unconditional and first in the class list.
          Anything dark you nest has to re-assert `dark` itself: the gallery
          writes `<ProductWindow tone="dark" className="dark">`, because
          ProductWindow's dark branch sets `chrome.*` fills but adds no `dark`
          class of its own.
        via: className
      - note: >-
          `brand.peach` inverts inside this card — #89684a, not #fec089 — so a
          default peach `<Button>` lands noticeably darker than the same
          button on the page around it. That is precisely why `actions` is a
          slot; pass the variant you actually want (the live section uses
          near-black buttons).
        via: prop LightSectionCard.actions
      - note: >-
          The horizontal rule and the whole lower block are gated on `hasProof
          = Boolean(children || actions)`. `title` + `lede` alone render a
          bare panel with no divider — that is deliberate (the rule can never
          appear with nothing under it), not a bug to patch.
        via: prop LightSectionCard.title
      - note: >-
          The column ratios are hardcoded (`md:grid-cols-[1.1fr_0.9fr]`,
          mirrored to `[0.9fr_1.1fr]` when `reverse`), apply only at `md`+,
          and only when `visual` is passed. Below `md` it is one column, copy
          first, regardless of `reverse`.
        via: prop LightSectionCard.reverse
    notFor:
      - instead: FeatureRow
        why: >-
          The same copy-plus-visual shape on a dark page — use `FeatureRow`.
          It now shares the `lede` / `actions` names deliberately, and the two
          were kept separate rather than merged behind a `tone` prop because
          the polarity difference is the `light` mechanism, not a style.
      - instead: ProductWindow
        why: >-
          A card inside a grid, or a small light frame around a mock. This is
          a whole band: a `<section>` with an `h2` at
          `clamp(2rem,3.2vw,3.25rem)` and 50px/46px vertical padding. For a
          light frame around a screenshot use `ProductWindow tone="light"`.
  sections/logo-row:
    import: "@skene/design-system/sections/logo-row"
    exports: [LogoSlot, LogoRow]
    polarity: inherits
    seen: []
    overrides: [style, className]
    customProperties: [--radius-md, --logo-row-count]
    props:
      LogoSlot:
        children: { type: React.ReactNode }
        label: { type: string }
      LogoRow:
        title: { type: React.ReactNode }
        stat: { type: React.ReactNode }
        count: { type: number, default: 5 }
        children: { type: React.ReactNode }
        caption: { type: React.ReactNode }
        decorative: { type: boolean, default: "true" }
    useFor: >-
      The proof strip: a centred heading, a stat line, a row of outlined logo
      slots, and the caption that explains them. The slots are EMPTY by
      default and that is the component's argument, not a missing feature —
      the strip asserts that named proof only appears with consent, so a
      `LogoSlot` renders a child only when given one and no fabricated
      customer mark ever goes in a slot. Every colour is a mode-aware role, so
      the strip survives both the dark page and a cream `light` ancestor with
      no `onLight` prop.
    alsoFor:
      - claim: >-
          A partially filled strip, honestly: pass fewer `LogoSlot` children
          than `count` and the remainder render as blanks, so a three-logo row
          keeps showing the two names it does not yet have.
        via: prop LogoRow.count
      - claim: >-
          `LogoSlot` on its own inside any grid you own — it is exported for
          the same reason `GlyphBadge` is, reachable without the strip around
          it, and a filled slot takes a `label` so the account is announced.
        via: prop LogoSlot.label
      - claim: >-
          A bare mid-page divider row: omit `title` and `stat` and only the
          slots and caption render — nothing conditional leaves an empty
          heading block behind.
        via: prop LogoRow.title
      - claim: >-
          A strip whose filled logos should reach a screen reader:
          `decorative` defaults to true because five empty boxes say nothing,
          and flipping it false un-hides the row the day real logos land.
        via: prop LogoRow.decorative
    watchFor:
      - note: >-
          `count` is also the column count from `sm` up, via a custom property
          on the grid. More children than `count` will wrap to a second line
          rather than being clipped, so keep the two in agreement.
        via: "--logo-row-count"
      - note: >-
          The caption is a prop so no copy is baked in, but a strip without
          one is a row of unexplained boxes — the wireframes always ship it
          ("These slots stay empty until an account agrees to be named
          on-site."). Pass it.
        via: prop LogoRow.caption
    notFor:
      - instead: StatChip
        why: >-
          A single figure beside a heading. That is a chip, not a band — this
          component earns its place only when the row of slots is the point.
      - instead: TrustPanel
        why: >-
          A claim standing next to itemised, checkable facts. The proof strip
          gestures at accounts; the trust panel argues with evidence.
  sections/mcp-block:
    import: "@skene/design-system/sections/mcp-block"
    exports: [McpBlock, McpCode, McpTool]
    composes: [same-layer/artifact-shell]
    polarity: inherits
    seen: [section-mcp-block]
    overrides: [className]
    props:
      McpBlock:
        title: { type: React.ReactNode }
        meta: { type: React.ReactNode }
        children: { type: React.ReactNode }
      McpCode:
        children: { type: React.ReactNode, required: true }
      McpTool:
        name: { type: React.ReactNode, required: true }
        description: { type: React.ReactNode }
    useFor: >-
      A panel inside the MCP artifact: a config snippet to paste, or the list
      of tools the server answers with.
    alsoFor:
      - claim: >-
          Any code-plus-catalogue pairing — an API key block and its scopes, a
          config and its options.
        via: export McpCode
      - claim: >-
          A tool or endpoint list on its own, via McpTool rows inside a titled
          block.
        via: prop McpTool.description
    watchFor:
      - note: >-
          It is one panel, not the window. The surface it depicts stacks two
          of these inside a single AppWindow, which is why there is no crumb
          prop here.
        via: prop McpBlock.meta
      - note: >-
          The code block takes themed tokens rather than chrome, because it is
          a settings screen and not a terminal.
        via: export McpCode
    notFor:
      - instead: Terminal
        why: >-
          A terminal transcript with traffic lights. That is
          patterns/terminal.
      - instead: TerminalBlock
        why: >-
          An install snippet with a copy button. That is TerminalBlock.
  sections/overview-tiles:
    import: "@skene/design-system/sections/overview-tiles"
    exports: [OverviewTiles, OverviewTile]
    polarity: inherits
    seen: [section-overview-tiles]
    overrides: [className]
    props:
      OverviewTiles:
        children: { type: React.ReactNode, required: true }
      OverviewTile:
        label: { type: React.ReactNode, required: true }
        value: { type: React.ReactNode, required: true }
        note: { type: React.ReactNode }
    useFor: >-
      The workspace overview: a row of small tiles, each a caption, one number
      and what the number is made of.
    alsoFor:
      - claim: >-
          Any set of commensurable counts — four numbers that belong in one
          sweep. A tile that styled itself differently would read as the
          important one.
        via: prop OverviewTile.value
      - claim: >-
          A ratio or a word instead of a count, since `value` is a node: 2 / 1
          / 0 / 0 and On are both valid.
        via: prop OverviewTile.value
    watchFor:
      - note: >-
          Its tile is byte-identical to CheckResult in evaluator-check — same
          root class string, same grid recipe at a different floor.
        via: export OverviewTile
    notFor:
      - instead: MetricCard
        why: >-
          One number as the subject of a whole panel. That is MetricCard.
      - instead: StatChip
        why: >-
          A single fact beside a heading. That is StatChip.
    sameAs: [sections/evaluator-check#CheckResult]
  sections/pipeline-stepper:
    import: "@skene/design-system/sections/pipeline-stepper"
    exports: [PipelineStep, PipelineStepper]
    polarity: inherits
    seen: [section-pipeline-stepper]
    overrides: [style, className]
    props:
      PipelineStepper:
        steps: { type: "PipelineStepItem[]", required: true }
        title: { type: React.ReactNode }
        subtitle: { type: React.ReactNode }
        onLight: { type: boolean, default: "true" }
    types:
      PipelineStepItem:
        label: { type: React.ReactNode, required: true }
        state: { type: PipelineStepState, required: true }
        icon: { type: React.ReactNode }
    useFor: >-
      A labelled progress track: N steps with state rings, joined by
      connectors the STEPPER owns and fills from the state of the step on
      their left, above an optional title/subtitle. It was built for a long
      job running inside a light `ProductWindow`, and two decisions carry that
      job — connectors are derived rather than drawn per-step, so N dots read
      as one track filling left to right; and emphasis runs backwards from
      instinct, with the ACTIVE step taking the label weight and a peach halo
      while done steps recede to matcha, because a running job's question is
      "what is it doing now", not "what has it finished".
    alsoFor:
      - claim: >-
          Any step count and any mix of states — `steps` is a plain array and
          connectors are derived (N-1), so a five-step onboarding checklist or
          a two-step form indicator works unchanged.
        via: prop PipelineStepper.steps
      - claim: >-
          Dark grounds via `onLight={false}`. The flag switches only the
          hairline token (`chrome.line.subtle` instead of
          `chrome.line.onLight`); everything legible already uses the
          theme-aware `text.*` role and follows a `light`/`dark` ancestor. Be
          aware the gallery case deliberately covers only the light path, so
          the dark rendering is supported by props but has no visual snapshot
          behind it.
        via: prop PipelineStepper.onLight
      - claim: >-
          A static "how it works" or completed-summary readout: `icon` per
          step replaces the ✓/dot with a number or glyph, and setting every
          step to `done` (or every step to `pending`) gives a finished or
          not-yet-started outline rather than a live job.
        via: type PipelineStepItem.icon
      - claim: >-
          A bare track with no header: omit `title` and `subtitle` and only
          the `<ol>` renders (the `mt-5` is conditional), so it drops under a
          heading you own or into a card you already have.
        via: prop PipelineStepper.title
      - claim: >-
          `PipelineStep` is exported separately for a single-step readout —
          though standalone steps get no connectors, which is the whole reason
          the array API exists.
        via: export PipelineStep
    watchFor:
      - note: >-
          `aria-current="step"` on the active step is the ONLY state exposed
          to assistive tech; the rings and glyphs are `aria-hidden` on
          purpose. Nothing is enforced, so two `active` steps emit two
          `aria-current="step"`, and `done` vs `pending` is invisible to a
          screen reader — if completion must be announced, it has to be in the
          `label`.
        via: type PipelineStepItem.label
      - note: >-
          The connector reads only the LEFT step's state, so an out-of-order
          array renders literally: a `done` after a `pending` draws a filled
          matcha rule leading into a hollow ring.
        via: type PipelineStepItem.state
      - note: >-
          The geometry is hand-computed and interlocking: a fixed 38px ring,
          and connector offsets of `ml-[18px]` (stacked) and `sm:mt-[18px]`
          (row) that are exactly its centre. Change the ring size and the
          track stops aligning with the rings. Steps also cap at
          `sm:max-w-[160px]`.
        via: prop PipelineStepper.steps
      - note: >-
          The breakpoint is `sm`, not `md` (the header notes three labelled
          steps need roughly 390px), and the root padding is a fixed
          `p-[22px]` sized for a ProductWindow body — both are worth
          re-checking if you drop this into a narrower or differently-padded
          container.
        via: prop PipelineStepper.steps
    notFor:
      - instead: JourneyTrack
        why: >-
          A funnel or journey diagram where each step carries health rather
          than progress — use `JourneyTrack`, whose connector is a gradient
          between the two states it joins so a break reads as happening in the
          link. PipelineStepper's connector is binary filled/not and its
          vocabulary is done/active/pending.
      - instead: PipelineStepper
        why: >-
          A self-advancing progress indicator. There is no `use client`, no
          timer, no internal state — deliberately, so the file stays
          server-renderable. Animating it means the parent owns the state and
          re-renders with new `steps`.
    sameAs: [sections/journey-track#JourneyTrack]
  sections/plan-card:
    import: "@skene/design-system/sections/plan-card"
    exports: [PlanGrid, PlanCard]
    composes: [same-layer/chip]
    polarity: applies-both
    seen: [section-plan-card]
    overrides: [style, className]
    customProperties: [--shadow-modal]
    props:
      PlanGrid:
        children: { type: React.ReactNode, required: true }
      PlanCard:
        tier: { type: React.ReactNode, required: true }
        tierAs: { type: "'h2' | 'h3'" }
        flag: { type: React.ReactNode }
        price: { type: React.ReactNode, required: true }
        unit: { type: React.ReactNode }
        summary: { type: React.ReactNode }
        features: { type: React.ReactNode }
        bestFor: { type: "{ label: React.ReactNode; value: React.ReactNode }" }
        action: { type: React.ReactNode }
        footnote: { type: React.ReactNode }
        featured: { type: boolean, default: "false" }
        featuredTone: { type: "'light' | 'dark'", default: "'light'" }
    useFor: >-
      A pricing tier card plus the grid that holds a row of them (`PlanGrid` +
      `PlanCard`). It is pure markup — no state, no client directive — because
      the only interactive part of a pricing section, the billing switch, was
      deliberately split into `billing-toggle.tsx` so this file stays
      server-renderable. The shape's real argument is comparison-by-inversion:
      `featured` flips one card to cream-on-dark, lifts it
      `md:-translate-y-3`, and drops a `--shadow-modal` on it, so a row of
      peers stops reading as peers and one of them becomes the recommendation.
    alsoFor:
      - claim: >-
          A billing/subscription panel in a product surface: `flag="Current
          plan"`, `bestFor={{label: 'Renews', value: 'Sep 12'}}` as a generic
          labelled metadata block, `action` as a Manage button, `footnote` for
          the fine print.
        via: prop PlanCard.flag
      - claim: >-
          Non-currency tiers. `price` is a `ReactNode` rendered in a
          `<strong>`, so "Free", "Custom", or "Let's talk" work as-is, and
          `unit` takes "/seat", "/yr", "per repo" — nothing in the component
          knows it is money.
        via: prop PlanCard.price
      - claim: >-
          Non-pricing package or offer cards — service tiers, plan-shaped
          feature bundles. `features` is an untyped `ReactNode` slot, so a
          `<dl>`, a `<Table>`, or plain paragraphs go in where the demo puts a
          `<CheckList>`.
        via: prop PlanCard.features
      - claim: >-
          Grids other than three-across. `PlanGrid` merges `className` through
          `cn` (clsx + tailwind-merge), so `md:grid-cols-2` or
          `lg:grid-cols-4` genuinely replaces the base `md:grid-cols-3` rather
          than fighting it.
        via: export PlanGrid
      - claim: >-
          Highlighting one item in any set of sibling cards — `featured`
          carries no pricing semantics, only the cream inversion and the lift.
        via: prop PlanCard.featured
      - claim: >-
          The featured promotion on a CREAM ground: `featuredTone="dark"`
          inverts the card to the invariant near-black fill with the `dark`
          class pinning every mode-aware token in the subtree, same lift and
          `--shadow-modal` — because the default cream inversion is
          cream-on-cream inside a light panel. A nested `CheckList` then wants
          its default rendering, not `onLight`.
        via: prop PlanCard.featuredTone
    watchFor:
      - note: >-
          `featured` applies the `light` class, and that is load-bearing, not
          decoration (sections.md rule 2). Anything you pass into
          `features`/`action`/`bestFor` must use the theme-aware `text.*`
          role; `chrome.text.*` is invariant and renders cream on the cream
          card, i.e. invisible. When `featured`, also pass `onLight` to a
          nested `CheckList`.
        via: prop PlanCard.featured
      - note: >-
          The tier marker is hardcoded `<Chip tone="neutral">` — no prop
          reaches it. A healthy/live-toned tier marker needs one small prop
          addition (e.g. `tierTone?: ChipTone` forwarded to `Chip`).
        via: prop PlanCard.tier
      - note: >-
          The featured shadow is an inline `style={{ boxShadow:
          'var(--shadow-modal)' }}`, so a `shadow-*` utility in `className`
          loses to it. Same for `bestFor`'s border colour, set inline from
          `--color-chrome-line-on-light`.
        via: prop PlanCard.bestFor
      - note: >-
          `PlanGrid` uses `items-start` on purpose: a stretched grid would
          re-equalise row height and cancel the featured card's
          `-translate-y-3`. Overriding to `items-stretch` silently kills the
          lift. Cards are held level by `min-h-[420px]` instead.
        via: export PlanGrid
      - note: >-
          The price renders at `clamp(2.55rem, 4vw, 4rem)`. Long strings
          ("Contact sales", "$1,299/mo") wrap or crowd the `unit` at that
          size.
        via: prop PlanCard.unit
    notFor:
      - instead: ComparisonTable
        why: >-
          A feature-by-feature comparison matrix across tiers — the card has
          no cell/row model. Use `sections/comparison-table`
          (`ComparisonTable`, `ComparisonRow`, `TableCheck`, `TableDash`); it
          is a deep import, not in the root barrel.
      - instead: LightSectionCard
        why: >-
          A generic content card or dashboard tile. The tier chip, oversized
          price and 420px floor are all pricing furniture — use `ui/card` for
          product surfaces, or `LightSectionCard` for a cream editorial panel.
    sameAs: [sections/bridge#BridgeNode]
  sections/pr-review:
    import: "@skene/design-system/sections/pr-review"
    exports: [PrReview]
    composes: [lib/status, same-layer/artifact-shell, same-layer/traffic-lights]
    polarity: inherits
    seen: [section-pr-review]
    overrides: [style, className]
    props:
      PrReview:
        status: { type: PrReviewStatus, required: true }
        repo: { type: React.ReactNode }
        statusLabel: { type: React.ReactNode }
        avatar: { type: React.ReactNode }
        author: { type: React.ReactNode }
        badge: { type: React.ReactNode }
        action: { type: React.ReactNode }
        title: { type: React.ReactNode }
        summary: { type: React.ReactNode }
        issuesLabel: { type: React.ReactNode }
        issues: { type: "PrReviewIssue[]" }
        fixLabel: { type: React.ReactNode }
        fix: { type: React.ReactNode }
        file: { type: React.ReactNode }
        fileNote: { type: React.ReactNode }
    types:
      PrReviewIssue:
        severity: { type: PrIssueSeverity }
        text: { type: React.ReactNode, required: true }
    useFor: >-
      The pull-request artifact: Skene's review on a PR, with findings by
      severity, a suggested fix and the file it lands in.
    alsoFor:
      - claim: >-
          Any review or audit output with ranked findings — a linter run, a
          security scan, a code review.
        via: prop PrReview.issues
      - claim: >-
          A passing review with no findings at all, via `status` and an empty
          issues list.
        via: prop PrReview.status
    watchFor:
      - note: >-
          Severity maps high/medium/low onto the same three semantic colours
          as every other status vocabulary in the package, under a fourth set
          of names.
        via: type PrReviewIssue.severity
      - note: >-
          Its author badge is StatPill minus the dot, hand-rolled in a file
          that already imports StatPill eight lines earlier.
        via: prop PrReview.badge
    notFor:
      - instead: SideBySideDiff
        why: >-
          The diff itself rather than the review around it. That is
          SideBySideDiff.
      - instead: Finding
        why: >-
          A single measured finding on a marketing band. That is Finding.
  sections/product-window:
    import: "@skene/design-system/sections/product-window"
    exports: [ProductWindow, WindowStatus, WindowToolbar, WindowChip]
    composes: [same-layer/chip]
    polarity: applies-light
    seen: [section-product-window]
    overrides: [style, className]
    customProperties: [--shadow-modal]
    props:
      ProductWindow:
        tone: { type: ProductWindowTone, default: "'light'" }
        title: { type: React.ReactNode }
        status: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
      WindowStatus:
        tone: { type: "'healthy' | 'live'", default: "'healthy'" }
        children: { type: React.ReactNode, required: true }
    useFor: >-
      The chrome that frames a product mock inside a marketing section:
      rounded border, modal shadow, and an optional title bar with a left
      title and a right `status` slot. Its default `tone="light"` is the
      argument rather than a style choice — the page around it is Skene's dark
      chrome, so the thing inside the frame reads as the customer's own tool;
      a dark window on a dark page reads as a screenshot of Skene itself.
      Ships alongside `WindowStatus` (the title bar's chip), `WindowToolbar`
      (a filter/breadcrumb strip) and `WindowChip`.
    alsoFor:
      - claim: >-
          The deliberate opposite reading: `tone="dark"` frames Skene's own
          surfaces (MCP output, a tracking plan, a CLI-adjacent view) on
          `chrome.surface.1`, and it is the mode `WindowToolbar` and
          `WindowChip` were built for.
        via: prop WindowStatus.tone
      - claim: >-
          Framing anything, not just a dashboard: `children` renders raw under
          the title bar, so `PipelineStepper`, a `Finding` list, a screenshot
          `<img>` or a table all fit — the gallery's
          `section-pipeline-stepper` case does exactly this.
        via: prop WindowStatus.children
      - claim: >-
          A chromeless light island: omit both `title` and `status` and the
          whole header block does not render, leaving a cream, `light`-scoped,
          shadowed panel for when you need light-on-dark inversion smaller
          than a full `LightSectionCard`.
        via: prop ProductWindow.title
      - claim: >-
          Any title-bar state marker: `status` is a ReactNode slot, and
          `WindowStatus` covers the two readings a window frame can express —
          default `healthy` (matcha) and `live` (violet) — while forwarding
          `className` merged last, so a caller's utility wins.
        via: prop ProductWindow.status
      - claim: >-
          Standalone use outside a feature row: nothing couples it to
          `FeatureRow`; it is a self-contained `max-w-[640px]` block and the
          gallery renders it directly.
        via: export ProductWindow
    watchFor:
      - note: >-
          `tone="light"` puts the `light` class on the root and that is
          load-bearing, not decoration: without it every mode-aware token
          inside — `semantic.matcha`, `errorRed`, `brand.peach` — resolves to
          its DARK value against the cream fill (matcha #d7f4ab on #faf1e9 is
          1.16:1). It also inverts whatever you pass as `children`, so a
          default peach `Button` lands much darker in here than on the page.
        via: prop WindowStatus.tone
      - note: >-
          `WindowToolbar` is a dark-window part despite living in this file:
          it hardcodes `border-chrome-line-subtle` and
          `text-chrome-text-muted-warm`, both invariant dark-surface tokens,
          so inside a light window the rule is near-invisible and the text
          colour is wrong. The window's own internal rules correctly switch to
          `chrome.line.onLight`.
        via: export WindowToolbar
      - note: >-
          `max-w-[640px]` is a class and can be overridden through `className`
          (cn is twMerge), but `boxShadow: var(--shadow-modal)` is an inline
          style and no class will beat it.
        via: inline style
      - note: >-
          Nesting `tone="dark"` inside a `light` ancestor needs
          `className="dark"` to pin it — the gallery does this for the dark
          window inside `LightSectionCard`, because otherwise the light
          ancestor pins that window's mode-aware tokens to their light values
          in both page modes.
        via: prop WindowStatus.tone
      - note: >-
          `WindowStatus` deliberately overrides the shared `Chip`'s
          `tracking-[0.08em]` back to `0.05em` to preserve its
          browser-verified rendering. If you touch chip geometry expecting one
          value everywhere, this is the declared exception.
        via: export WindowStatus
    notFor:
      - instead: Terminal
        why: >-
          Code, CLI output or a diff — that is `Terminal` (monospace, traffic
          lights). components.yaml states the two read as different objects on
          purpose and should not be substituted.
      - instead: LightSectionCard
        why: >-
          A whole cream section band carrying copy and buttons. This is a
          frame with a 640px cap and no title/lede/actions slots; use
          `LightSectionCard`.
  sections/question-grid:
    import: "@skene/design-system/sections/question-grid"
    exports: [QuestionGrid, QuestionCard]
    polarity: inherits
    seen: [section-question-grid]
    overrides: [style, className]
    customProperties: [--font-size-pill, --font-tracking-eyebrow]
    props:
      QuestionGrid:
        columns: { type: keyof typeof COLUMN_CLASS, default: 3 }
        children: { type: React.ReactNode, required: true }
      QuestionCard:
        tag: { type: React.ReactNode }
        title: { type: React.ReactNode, required: true }
        children: { type: React.ReactNode }
    useFor: >-
      A 1–4 column grid of near-empty cards, each one a mono category `tag`
      sitting at the top of the card with a question (or claim) below it and
      an optional answer. The card is deliberately a border, a 14px radius and
      a peach corner glow with no opaque fill — that is what lets it sit on a
      dark band or a cream one without needing a polarity class or a token
      audit. It exists for the "here is what you'll actually be able to
      answer" band, where the copy does all the work and the container must
      not compete with it.
    alsoFor:
      - claim: >-
          An FAQ or objection-handling teaser band: `tag` as the category
          ("BILLING", "OBJECTION"), `title` as the question, `children` as the
          short answer. Static only — see notFor.
        via: prop QuestionCard.tag
      - claim: >-
          A use-case or persona grid: `tag` as the audience ("FOR ENGINEERS"),
          `title` as the outcome. Same three slots, no change.
        via: prop QuestionCard.tag
      - claim: >-
          A 2-up or 4-up feature grid via the `columns` prop. `columns={4}` is
          not simply four across — the static map gives `grid-cols-1
          md:grid-cols-2 lg:grid-cols-4`, which is the sensible ladder for
          four short cards.
        via: prop QuestionGrid.columns
      - claim: >-
          A single full-width statement card with `columns={1}` — though the
          fixed 58px tag gap and `min-h` were tuned for a ~270px-wide card and
          will read as a lot of air at full bleed.
        via: prop QuestionGrid.columns
      - claim: >-
          Clickable cards, by wrapping each `QuestionCard` in the caller's own
          `<a>`/`<Link>`. `className` is forwarded to the `<article>`, so
          hover/focus styling can be supplied from outside — but the component
          ships no interactive affordance of its own.
        via: export QuestionCard
    watchFor:
      - note: >-
          The `mb-[58px]` under the tag is a fixed margin, not `mt-auto`, and
          it is load-bearing: it is what makes the tag read as a label on the
          card rather than a kicker on the sentence, and what keeps every tag
          on one baseline across the row. It only works because the grid's
          default `items-stretch` gives the cards a shared row height — drop
          these into a flex row, or pass `items-start`, and the alignment
          goes.
        via: prop QuestionCard.tag
      - note: >-
          Omitting `tag` removes the 58px with it, so the question floats at
          the top of a card still held open by `min-h-[230px]
          md:min-h-[270px]` — a visible void underneath. The card is designed
          to be tagged.
        via: prop QuestionCard.tag
      - note: >-
          The tag colour is hardcoded `text-brand-peach`; there is no per-card
          accent. Colour-coding categories would need a small prop addition —
          a `tone`/`accent` prop feeding the tag's colour, mirroring
          `ValueCard`'s `TONE_ACCENT` map.
        via: prop QuestionCard.tag
      - note: >-
          `COLUMN_CLASS` is a static 1|2|3|4 map because Tailwind cannot see
          an interpolated class name. Five or six columns is a compile error,
          not a runtime surprise — and fixing it means adding a map entry, not
          passing a number through.
        via: prop QuestionGrid.columns
      - note: >-
          Adding a background fill via `className` works (the corner glow is
          `backgroundImage`, a different property) but it is exactly the
          change the file header warns against: a filled card acquires its own
          ground, at which point it needs a `light`/`dark` class and every
          token inside it needs re-checking.
        via: className
    notFor:
      - instead: Accordion
        why: >-
          A real FAQ accordion. There is no disclosure behaviour and no `use
          client` — this is props in, markup out. Use `ui/accordion`.
      - instead: StatChip
        why: >-
          A stats or metrics band. The fixed tag gap and min-height are tuned
          for one line of question plus a sentence; a number and a unit leave
          the card mostly empty. Use `StatChip` or `ValueCards`.
    sameAs: [sections/value-cards#ValueCard]
  sections/recommendation-card:
    import: "@skene/design-system/sections/recommendation-card"
    exports: [RecommendationCard]
    polarity: inherits
    seen: [section-recommendation-card]
    overrides: [style, className]
    props:
      RecommendationCard:
        eyebrow: { type: React.ReactNode }
        title: { type: React.ReactNode, required: true }
        children: { type: React.ReactNode }
        meta: { type: React.ReactNode }
    useFor: >-
      The proposal: what to do next, and what makes it worth doing.
      Deliberately without a status colour.
    alsoFor:
      - claim: >-
          Any suggestion block — a next step, a recommended setting, an upsell
          that should not look like an alert.
        via: prop RecommendationCard.title
      - claim: >-
          Qualifier chips under the body, via `meta`, which takes nodes so
          TagChip fits.
        via: prop RecommendationCard.meta
    watchFor:
      - note: >-
          It carries no status colour on purpose. An amber pill on a
          suggestion teaches a reader who has learned that amber means drift
          to read the suggestion as a fault.
        via: prop RecommendationCard.eyebrow
      - note: >-
          Its fill and hairline mix from currentColor, so it works on the
          light window it shipped in and on the dark page with no prop.
        via: inline style
    notFor:
      - instead: Finding
        why: >-
          A measured state. That is Finding, which owns the status vocabulary.
      - instead: AgentCallout
        why: >-
          A verdict spoken by the product. That is AgentCallout — the same
          padding and eyebrow spec in a different voice.
  sections/score-ring:
    import: "@skene/design-system/sections/score-ring"
    exports: [ScoreRing]
    composes: [lib/status]
    polarity: inherits
    seen: [section-score-ring]
    overrides: [style, className]
    props:
      ScoreRing:
        value: { type: number, required: true }
        max: { type: number, default: 100 }
        status: { type: ScoreRingStatus, default: "'warn'" }
        size: { type: number, default: 64 }
        label: { type: string, required: true }
    useFor: >-
      A score against a scale: a partial arc on a track with the value inside
      it.
    alsoFor:
      - claim: >-
          Any bounded score — coverage, health, completeness, a readiness
          percentage.
        via: prop ScoreRing.max
      - claim: >-
          At any size, since the digits are sized from the ring: one prop
          moves the whole figure.
        via: prop ScoreRing.size
    watchFor:
      - note: >-
          `status` binds the reserved good | warn | danger vocabulary and
          never peach: peach is the action colour, so a peach fault reads as a
          call to action.
        via: prop ScoreRing.status
      - note: >-
          The default is warn, not good, so a forgotten prop cannot paint a
          failing score in the reassurance colour.
        via: "default status='warn'"
      - note: >-
          `label` is required because the visible digits are aria-hidden — it
          is the accessible name, not decoration.
        via: prop ScoreRing.label
    notFor:
      - instead: Progress
        why: >-
          A determinate bar on a product surface. That is ui/progress.
      - instead: MetricCard
        why: >-
          A number with a delta and a sparkline rather than a scale. That is
          MetricCard.
  sections/section-backdrop:
    import: "@skene/design-system/sections/section-backdrop"
    exports: [SectionBackdrop]
    polarity: inherits
    seen: [section-backdrop]
    overrides: [style, className]
    props:
      SectionBackdrop:
        texture: { type: BackdropTexture, default: "'journey'" }
        src: { type: string }
        inset: { type: number, default: 6 }
        children: { type: React.ReactNode }
    useFor: >-
      The halftone field a panel floats on: a container that paints one of the
      three real site textures (`card1/2/3_bg.webp`) and insets its child by a
      percentage of the track width. The percentage is the whole design — the
      live panel is 84–92% of its container, and only a percentage holds that
      proportion at every width; a fixed padding turns the field into a
      coloured border on a short wide card. It is the narrowest of the
      package's four texture tools: field behind a mock inside a feature row,
      as opposed to `HeroBackdrop` (hero strip), `DitheredMedia` (whole hero
      composition) and `DitherOverlay` (the raw layer).
    alsoFor:
      - claim: >-
          Standalone use outside a feature row — the gallery's
          `section-backdrop` case renders three of them in a plain grid
          wrapping an arbitrary card, so any node can be the floating panel.
        via: prop SectionBackdrop.children
      - claim: >-
          Consumer artwork: `src` takes any URL and overrides `texture`, which
          is the supported path for a page-specific image or for a consumer
          that does not have Skene's assets.
        via: prop SectionBackdrop.src
      - claim: >-
          Retuning the float: `inset` is a plain number in percent (default 6)
          — raise it to make a small panel sit deeper in the field, lower it
          toward 0 for a near-full-bleed texture edge.
        via: default inset=6
      - claim: >-
          Choosing a field by subject: `texture` is `journey | github |
          schema` and the pairing is semantic, not a tint picker
          (journeys/funnels/measurement, GitHub/PRs/editor chrome,
          schema/connections/keys), so a reader who knows the live site meets
          the same backdrop behind the same kind of thing.
        via: prop SectionBackdrop.texture
      - claim: >-
          Shape and fill control via `className`, which merges onto the root —
          `rounded-xl` in the gallery, `h-full w-full` in how `FeatureRow`
          embeds it.
        via: className
    watchFor:
      - note: >-
          `minHeight: '22rem'` is set as an **inline style** and there is no
          `style` prop on `SectionBackdropProps`, so no Tailwind `min-h-*` in
          `className` can beat it — inline styles win and twMerge cannot reach
          them. Making it shorter needs one small prop addition to this file
          (a `minHeight` or a passthrough `style` prop); say so rather than
          fighting it from the call site.
        via: inline style
      - note: >-
          `padding: ${inset}%` applies to all four sides, and CSS resolves
          percentage padding against the container's **width** in both axes —
          so a wide, short container gets large vertical padding from a small
          `inset`. The 22rem floor exists because without vertical room the
          texture only shows left and right, which is the border failure again
          in the other axis.
        via: prop SectionBackdrop.inset
      - note: >-
          Children are flex items on a `flex items-center` root, not layers:
          exactly one node goes in the `relative w-full` z-1 wrapper. And
          there is no overlay element in this file — the texture is a CSS
          `background-image` on the container itself, so the header comment's
          "aria-hidden, pointer-events-none" describes `FeatureRow`'s sheen,
          not anything here to restyle.
        via: prop SectionBackdrop.texture
      - note: >-
          Texture URLs are resolved with `new URL('../../assets/…',
          import.meta.url)` on purpose, so a bundler rewrites them and
          consumers need not copy files into their own `public/`. That assumes
          a bundler that handles `import.meta.url` asset references; unbundled
          Node resolution yields a `file://` path.
        via: prop SectionBackdrop.src
    notFor:
      - instead: DitheredMedia
        why: >-
          A hero. Use `DitheredMedia` for a full hero composition or
          `HeroBackdrop` for a dark strip fading into the page — this
          component's 22rem floor and percentage inset are sized for a panel
          inside a row.
      - instead: DitherOverlay
        why: >-
          A plain tinted or gradient panel. It always loads a raster texture;
          use a div with a token background, or `DitherOverlay` if you want
          only the dither layer over your own stack.
    sameAs: [sections/artifact-shell#ArtFrame]
  sections/side-by-side-diff:
    import: "@skene/design-system/sections/side-by-side-diff"
    exports: [DiffLine, DiffColumn, SideBySideDiff]
    polarity: applies-dark
    seen: [section-side-by-side-diff]
    overrides: [style, className]
    props:
      DiffLine:
        kind: { type: DiffLineKind, default: "'ctx'" }
        addedLabel: { type: React.ReactNode, default: "'Added'" }
        removedLabel: { type: React.ReactNode, default: "'Removed'" }
        children: { type: React.ReactNode }
      DiffColumn:
        side: { type: DiffSide, required: true }
        label: { type: React.ReactNode, required: true }
        lines: { type: "DiffLineSpec[]", required: true }
        addedLabel: { type: React.ReactNode }
        removedLabel: { type: React.ReactNode }
      SideBySideDiff:
        children: { type: React.ReactNode, required: true }
    types:
      DiffLineSpec:
        kind: { type: DiffLineKind }
        text: { type: React.ReactNode, required: true }
    useFor: >-
      Two columns of code with added and removed lines marked — what was
      written beside what was expected.
    alsoFor:
      - claim: >-
          Any before/after code comparison — a migration, a suggested fix, a
          config change.
        via: prop DiffColumn.lines
      - claim: >-
          A single column of annotated code, by rendering one DiffColumn.
        via: prop DiffColumn.side
      - claim: >-
          Localised or relabelled markers via `addedLabel` and `removedLabel`.
        via: prop DiffColumn.addedLabel
    watchFor:
      - note: >-
          It applies `dark` to itself: the diff is GitHub chrome and stays
          dark on a light page, which is what the vendor tokens are for.
        via: export SideBySideDiff
      - note: >-
          Its column header is byte-identical to ArtPanel's bar, in a file
          that does not import it.
        via: prop DiffColumn.label
    notFor:
      - instead: PrReview
        why: >-
          The review around a diff — author, findings, fix. That is PrReview.
      - instead: McpCode
        why: >-
          A plain code block with no diff semantics. That is McpCode.
  sections/stat-chip:
    import: "@skene/design-system/sections/stat-chip"
    exports: [StatChip, MetaChip]
    polarity: inherits
    seen: [section-stat-chip]
    overrides: [style, className]
    props:
      StatChip:
        icon: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
      MetaChip:
        icon: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
        status: { type: React.ReactNode, required: true }
    useFor: >-
      Two small pills that sit beside headings: `StatChip` asserts something
      true right now ("121 stars"), `MetaChip` marks something not shipped yet
      (prose, a hairline divider, then a peach status word). They are two
      components rather than one with a `variant` precisely so a forgotten
      prop can never turn a roadmap item into a live claim about the product —
      two names cannot be defaulted into each other. Both derive their border
      and fill from `currentColor` via `color-mix`, which is what lets one
      chip survive both the dark page and the cream `LightSectionCard` with no
      `onLight` prop.
    alsoFor:
      - claim: >-
          Recolouring the entire chip by setting only the text colour. Because
          border (26%/22%) and fill (7%/6%) are `color-mix` on `currentColor`,
          passing e.g. `className="text-semantic-matcha"` retints border,
          fill, and type together. That `currentColor` derivation IS the tone
          mechanism — there is no `tone` prop and none is needed.
        via: className
      - claim: >-
          `MetaChip` as a general "description · marker" chip. `status` is a
          `ReactNode`, not an enum — BETA, SOON, DEPRECATED, `v2.1`, a region
          code — rendered monospace, uppercased, tracked at 0.07em. The
          divider is a real 13px element rather than a `│` glyph, so it tracks
          the chip height whatever you put on either side.
        via: export MetaChip
      - claim: >-
          Any leading mark, not just the shipped emoji. The `icon` slot is a
          `ReactNode` with `shrink-0`, so a small inline SVG or a coloured
          status dot drops in — but it is `aria-hidden`, so the visible text
          has to carry the whole meaning.
        via: prop MetaChip.icon
      - claim: >-
          Composed content in `children` (also a `ReactNode`): a `<strong>`
          figure with a muted trailing word, a linked count, a short unit.
          Both chips are `inline-flex` `<span>`s, so they flow in prose and
          wrap cleanly in a `flex flex-wrap gap-3` row — the shape the gallery
          uses.
        via: prop MetaChip.children
      - claim: >-
          Dropping onto a cream surface unchanged. The type uses the
          mode-aware `text-muted-strong` / `text-muted` roles, so a `light`
          ancestor inverts everything including the derived edges. No variant,
          no second call site.
        via: inline style
    watchFor:
      - note: >-
          The border and background are inline `style` rules, so a `border-*`
          or `bg-*` utility passed via `className` loses to them. Change the
          colour by changing the text colour, not the border colour.
        via: inline style
      - note: >-
          `MetaChip`'s status word is hardcoded `text-brand-peach` — it is the
          one part NOT derived from `currentColor`. Retinting the chip leaves
          the status peach, which is usually right and occasionally a
          surprise.
        via: export MetaChip
      - note: >-
          Never reach for `chrome.*` here. `chrome.text.*` is invariant cream
          by definition, and these chips render on cream; the whole colour
          scheme (including the derived edges) is built on the theme-aware
          `text.*` role for that reason. There is no mode-aware line token,
          which is exactly why the edges are derived rather than tokenised.
        via: inline style
      - note: >-
          Geometry is `rounded-full`, 12px, non-mono — deliberately NOT the
          10px mono rectangle of `Chip`/`WindowStatus`. `docs/sections.md` §2
          point 3 records this as an open decision (adopt the window-chip
          geometry or justify the pill), so do not quietly "harmonise" one
          side of it.
        via: export StatChip
    notFor:
      - instead: Badge
        why: >-
          Product-surface state. These are section furniture next to headings;
          for a status marker in a UI use `Badge` (the shadcn primitive) or
          `Chip` / `WindowStatus` for the 10px mono rectangle.
      - instead: Eyebrow
        why: >-
          A section-heading kicker. That is `Eyebrow` (pattern), which owns
          the `font.tracking.eyebrow` token — a different job at a different
          tracking.
    sameAs: [sections/chip#Chip]
  sections/surface-cards:
    import: "@skene/design-system/sections/surface-cards"
    exports: [SurfaceCards]
    composes: [same-layer/glyph-badge]
    polarity: applies-both
    seen: []
    overrides: [style, className]
    customProperties: [--font-size-body, --font-size-ui, --font-size-body-sm]
    props:
      SurfaceCards:
        surfaces: { type: "SurfaceCardItem[]", required: true }
        featured: { type: number, default: 0 }
        texture: { type: string }
    types:
      SurfaceCardItem:
        id: { type: string, required: true }
        icon: { type: React.ReactNode }
        title: { type: React.ReactNode, required: true }
        context: { type: React.ReactNode }
        detail: { type: React.ReactNode, required: true }
        code: { type: string }
    useFor: >-
      A compact grid of peer cards on a textured field, one of them drawn
      cream, where every card carries its own detail: the “ways in” band, four
      surfaces two across.
    alsoFor:
      - claim: >-
          Any two-to-four item set of alternatives where one is editorially
          led — entry points, plans, channels. Nothing in it is
          homepage-specific.
        via: prop SurfaceCards.surfaces
      - claim: >-
          Which cell is the cream one is the caller's, so the lit card can
          follow the page's argument instead of always being the first.
        via: prop SurfaceCards.featured
      - claim: >-
          A plain panel with no artwork behind it, by omitting the texture —
          the grid does not depend on the field.
        via: prop SurfaceCards.texture
      - claim: >-
          A command or endpoint per card, as a mono chip whose hairline is
          mixed from the card's own ink so it holds on the cream cell and the
          ink ones alike.
        via: type SurfaceCardItem.code
    watchFor:
      - note: >-
          The featured card carries `light` and the other cards carry `dark`,
          and both are load-bearing. Without them a mode-aware token keeps the
          wrong value — `text.primary` resolves to #faf1e9 on a #faf1e9 fill,
          which is not dim, it is absent.
        via: prop SurfaceCards.featured
      - note: >-
          The chip reads as tested, which is exactly why it is optional. Pass
          one only where the exact string is verifiable in a source; an absent
          chip is not a hole in the design.
        via: type SurfaceCardItem.code
      - note: >-
          The glyph is a character, never a named HTML entity. JSX entity
          tables are per-compiler and `machine/rules.yaml` bans them outright.
        via: type SurfaceCardItem.icon
      - note: >-
          The grid is literally two across at `sm` and one below it, not
          `auto-fit`. Four tracks in a ~640px band give each card 139px, and
          every two-word title wraps.
        via: prop SurfaceCards.surfaces
    notFor:
      - instead: SurfaceTile
        why: >-
          A row of tiles with ONE panel under it explaining whichever tile is
          chosen. That is `SurfaceTiles` with `SurfaceDetail` as a sibling.
          Use that when one surface is being explained, and this when all of
          them are, each in its own card.
      - instead: ValueCard
        why: >-
          Cards that argue by contrast — N of them naming what the situation
          costs, then one naming what it becomes. These cards are peers; the
          tone here marks the lit one rather than turning the argument.
      - instead: FeatureRow
        why: >-
          A whole band: a copy column beside a visual panel, at band scale.
          Its copy column alone carries 38.4px of side padding, wider than the
          content a 223px cell holds. This grid is what goes IN a FeatureRow's
          visual, not a nest of four more.
    sameAs: [sections/surface-tiles#SurfaceTile]
  sections/surface-tiles:
    import: "@skene/design-system/sections/surface-tiles"
    exports: [SurfaceTiles, SurfaceTile, SurfaceDetail]
    polarity: applies-light
    seen: [section-surface-tiles]
    overrides: [style, className]
    props:
      SurfaceTiles:
        children: { type: React.ReactNode, required: true }
      SurfaceTile:
        icon: { type: React.ReactNode }
        accent: { type: SurfaceAccent, default: "'neutral'" }
        name: { type: React.ReactNode, required: true }
        note: { type: React.ReactNode }
        selected: { type: boolean }
      SurfaceDetail:
        tag: { type: React.ReactNode }
        children: { type: React.ReactNode, required: true }
        code: { type: React.ReactNode }
    useFor: >-
      The surfaces a product runs on, as a row of tiles with one picked out,
      and the panel that explains the chosen one.
    alsoFor:
      - claim: >-
          Any set of options where one is editorially highlighted — plans,
          integrations, entry points.
        via: prop SurfaceTile.selected
      - claim: >-
          A command or identifier under the row, via SurfaceDetail's `code`,
          which renders a mono chip rather than a terminal.
        via: prop SurfaceDetail.code
      - claim: >-
          Tinted icons per tile through `accent`, which reuses FeatureIcon's
          vocabulary plus a neutral.
        via: prop SurfaceTile.accent
    watchFor:
      - note: >-
          `selected` carries the `light` class, which is the whole mechanism.
          Without it, cream type lands on a cream fill — the bug that shipped
          invisible twice in this package.
        via: prop SurfaceTile.selected
      - note: >-
          Selection is presentational. There is no onSelect and no internal
          state, so a real picker means the caller owns the state.
        via: prop SurfaceTile.selected
    notFor:
      - instead: OverviewTile
        why: >-
          Commensurable numbers rather than choices. That is OverviewTiles,
          where nothing can be selected.
      - instead: PlanCard
        why: >-
          Options that each need a price, a feature list and a CTA. That is
          PlanCard.
  sections/team-card:
    import: "@skene/design-system/sections/team-card"
    exports: [TeamCard, TeamGrid]
    polarity: inherits
    seen: []
    overrides: [className]
    customProperties: [--radius-lg, --radius-md]
    props:
      TeamCard:
        name: { type: React.ReactNode, required: true }
        role: { type: React.ReactNode, required: true }
        media: { type: React.ReactNode }
        as: { type: "'h2' | 'h3' | 'h4'" }
        children: { type: React.ReactNode }
      TeamGrid:
        children: { type: React.ReactNode, required: true }
    useFor: >-
      The about-page person card and its grid: a name as a heading, a role in
      the small-caps monospace register, an optional bio/links block, and an
      optional square media frame that only exists when media does. The card
      is designed for the no-photo state — type on a bordered panel that looks
      finished — so a team page needs no photographer and no stock
      placeholder. Cards are `<li>`s and `TeamGrid` is the `<ul>`, the same
      peers-in-a-list argument `TrustPanel` makes for its facts.
    alsoFor:
      - claim: >-
          Any person-shaped entry, not only employees: advisors, authors on a
          contributors page, speakers — `name` and `role` are slots and no
          copy is baked in.
        via: prop TeamCard.name
      - claim: >-
          A card with links: anchors passed in `children` are styled here
          (underline, offset, hover to `text.primary`), so a bare `<a href>`
          at the call site is already visible.
        via: prop TeamCard.children
      - claim: >-
          An illustration or monogram instead of a photo — `media` is a
          `ReactNode` slot, not a `src`, and the frame's sizing rules make
          whatever is passed fill it without call-site styling.
        via: prop TeamCard.media
      - claim: >-
          A grid that IS the section: `as` moves the name heading to `h2` when
          no section heading sits above the stack.
        via: prop TeamCard.as
    watchFor:
      - note: >-
          `TeamGrid`'s slot renders inside a `<ul>`, so pass `TeamCard`s, not
          arbitrary markup — a free-floating `<div>` child is invalid list
          nesting the browser will repair for you, wrongly.
        via: prop TeamGrid.children
      - note: >-
          `alt` on a portrait is the caller's job, and beside the printed name
          it is usually `alt=""` — the media slot cannot know what it is
          handed.
        via: prop TeamCard.media
    notFor:
      - instead: TrustFact
        why: >-
          A fact with a qualifier in a stack — the icon-title-body row on
          cream. A person is not a fact and the card carries its own surface.
      - instead: ValueCard
        why: >-
          A benefit or capability tile. If the "person" is really a role
          description with no name, it is a value card wearing a face.
  sections/terminal-block:
    import: "@skene/design-system/sections/terminal-block"
    exports: [TerminalBlock]
    client: true
    composes: [ui/button, same-layer/artifact-shell, same-layer/traffic-lights]
    polarity: applies-dark
    seen: [section-terminal-block]
    overrides: [className, use client]
    props:
      TerminalBlock:
        lines: { type: "TerminalBlockLine[]", required: true }
        title: { type: React.ReactNode }
        note: { type: React.ReactNode }
        copyLabel: { type: React.ReactNode, default: "'copy'" }
        copiedLabel: { type: React.ReactNode, default: "'copied'" }
        onCopy: { type: "(result: { command: string; index: number; ok: boolean }) => void" }
    types:
      TerminalBlockLine:
        command: { type: string, required: true }
        display: { type: React.ReactNode }
        prompt: { type: React.ReactNode }
        copyable: { type: boolean }
    useFor: >-
      The install block: a terminal frame holding one or more shell lines,
      each with its own copy button.
    alsoFor:
      - claim: >-
          Any copyable command list — install steps, a CLI walkthrough, a set
          of environment exports.
        via: prop TerminalBlock.lines
      - claim: >-
          Output lines that are not copyable, by setting `copyable` false —
          which is how a transcript mixes commands and results.
        via: type TerminalBlockLine.copyable
      - claim: >-
          A different visible string from what is copied, via `display`
          against `command`.
        via: type TerminalBlockLine.display
    watchFor:
      - note: >-
          It is the client boundary and is deliberately absent from the root
          barrel: a use client directive on a re-exported module poisons the
          barrel for server rendering, which package-contract asserts against.
          Deep-import it.
        via: use client
      - note: >-
          It draws the terminal frame itself rather than using the
          skene-terminal class in effects.css, so it does not match
          patterns/terminal — 12px radius against 8px.
        via: prop TerminalBlock.title
    notFor:
      - instead: Terminal
        why: >-
          A transcript with no copy affordance. That is patterns/terminal.
      - instead: McpCode
        why: >-
          A config block to read rather than run. That is McpCode.
    sameAs: [patterns/terminal#Terminal, sections/traffic-lights#TrafficLights]
  sections/traffic-lights:
    import: "@skene/design-system/sections/traffic-lights"
    exports: [TrafficLights]
    polarity: inherits
    seen: [section-traffic-lights]
    overrides: [className]
    useFor: >-
      The three window-chrome dots — red, yellow, green, 10px each — as one
      `aria-hidden` group at an 8px gap. It exists so a shell bar, an editor
      header or a GitHub file header can carry window furniture without
      hand-rolling three spans, which is what five files were doing:
      `TerminalBlock` and `PrReview` in this package, and two skene-site
      routes that each declared a local copy plus a comment saying the fix
      belonged upstream.
    alsoFor:
      - claim: >-
          Any drawn window header, not only a shell — an editor chrome bar, a
          browser mock, a GitHub file header. It carries no terminal semantics
          at all: it is three coloured circles in a flex row, and it needs no
          parent and no context.
        via: export TrafficLights
      - claim: >-
          A roomier bar, by passing `gap-*` — `cn` treats it as a `gap`
          conflict so the caller's value wins. That is how `PrReview` gets
          GitHub's 12px against the terminal bar's 8px, from the same
          component.
        via: className
    watchFor:
      - note: >-
          `className` lands on the WRAPPER. The three dots take invariant
          `terminal-chrome.traffic.*` tokens and are not reachable from
          outside — a recolourable red light is not a variant.
        via: className
      - note: >-
          `patterns/terminal` draws the same three dots and does NOT use this:
          they are a `::before` with two box-shadows on `.skene-terminal` in
          `styles/effects.css`. A `Terminal` therefore has its lights whether
          or not you render this, and rendering both gives six. Which of the
          two terminals wins is the open `terminals` decision, and this
          component does not settle it.
        via: export TrafficLights
      - note: >-
          There is no `size` prop. 10px is what both call sites shipped and
          what the CSS half draws; a fourth diameter would push the two
          terminals further apart rather than closer.
        via: export TrafficLights
    notFor:
      - instead: StatPill
        why: >-
          Saying something. These are furniture and carry no state; a dot that
          means a state, with the word beside it, is `StatPill`, which binds
          bad | warn | ok to the semantic colours.
      - instead: Terminal
        why: >-
          A whole terminal frame. `patterns/terminal` already paints its own
          lights in CSS — reach for this only when you are building the bar
          yourself.
    sameAs: [patterns/terminal#Terminal, sections/terminal-block#TerminalBlock]
  sections/trust-panel:
    import: "@skene/design-system/sections/trust-panel"
    exports: [TrustFact, TrustPanel]
    composes: [same-layer/glyph-badge]
    polarity: applies-light
    seen: [section-trust-panel, section-trust-panel-eyebrow]
    overrides: [style, className]
    customProperties: [--radius-lg]
    props:
      TrustFact:
        icon: { type: React.ReactNode }
        title: { type: React.ReactNode, required: true }
        children: { type: React.ReactNode }
        tone: { type: "'tint' | 'muted'", default: "'tint'" }
      TrustPanel:
        eyebrow: { type: React.ReactNode }
        title: { type: React.ReactNode, required: true }
        lede: { type: React.ReactNode }
        links: { type: React.ReactNode }
        children: { type: React.ReactNode }
    useFor: >-
      A cream panel split into a claim and its evidence: heading, lede and a
      row of links on the left, a stack of `TrustFact` items on a deeper cream
      to the right. The split is the argument — the reassurance is not a
      paragraph asserting itself but a paragraph standing next to checkable
      facts, which is why the evidence track is the wider of the two (`0.9fr
      1.1fr`). It is a fixed-polarity object: the root carries `light`
      unconditionally, so it is a cream card on a dark page, with a peach
      bloom rising from the bottom-left corner that the token system gets
      right on cream for free.
    alsoFor:
      - claim: >-
          Any claim-plus-itemised-proof panel, not just security: "what's
          included", "how it works", "what we do with your data". `title` +
          `lede` + `TrustFact`s is the shape, and no copy is baked in.
        via: prop TrustPanel.title
      - claim: >-
          A single-column cream statement or CTA panel — omit `children` and
          the `md:grid-cols-[0.9fr_1.1fr]` template is not applied at all.
          That collapse is an explicit design decision in the source, not an
          accident.
        via: prop TrustPanel.children
      - claim: >-
          A legal/footnote band: the `links` slot is a wrapped flex row that
          styles whatever anchors you pass (`underline`, `underline-offset-4`,
          hover to `text.primary`) without owning their hrefs or labels.
        via: prop TrustPanel.links
      - claim: >-
          A plan-inclusions panel, using each `TrustFact`'s 38px `icon` circle
          for a check glyph and `children` for the limit or caveat.
        via: export TrustFact
      - claim: >-
          `TrustFact` on its own inside any `<ul>` you own — it is exported,
          it is a self-contained `<li>` that draws its own separating rule,
          and it needs no context from `TrustPanel`. Cream surfaces only (see
          watchFor).
        via: export TrustFact
      - claim: >-
          A fact row on a dark band: `TrustFact tone="muted"` swaps the row's
          two invariant pieces of on-light chrome — the separating rule and
          the disc — for their theme-following pair (`border`, `GlyphBadge
          tone="muted"`), so the stack is legible outside the cream panel
          while the default `tint` rendering inside it is untouched.
        via: prop TrustFact.tone
    watchFor:
      - note: >-
          `light` is unconditional and first in the class list. There is no
          dark variant and you cannot make one by overriding `className` —
          `bg-brand-light` is an invariant cream, and every mode-aware token
          in the subtree has already resolved for a cream ground.
        via: className
      - note: >-
          `TrustFact`'s hairlines and its icon circle's border are
          `chrome-line-on-light` — an invariant dark rule at 14% designed for
          cream. Lifted onto a dark surface those rules and that circle are
          effectively invisible. The doc comment calls this out as the one
          deliberate exception to the theme-aware-tokens rule. Since 0.11.0
          that is what `TrustFact`'s `tone="muted"` exists for — the
          theme-following pair for any other ground.
        via: export TrustFact
      - note: >-
          `children` renders directly inside the `<ul>` (chosen over an inner
          wrapper specifically to avoid `display: contents`, which several
          browsers still strip list semantics from). Pass `TrustFact`s, i.e.
          `<li>`s — a `<div>` or a wrapper component breaks the "3 of 5" a
          screen reader would otherwise give.
        via: prop TrustPanel.children
      - note: >-
          The fact separators live on the item (`border-b … first:pt-0
          last:border-b-0 last:pb-0`), not on a divider element, so the stack
          must not also be spaced by a parent `gap` — that double-spaces the
          rhythm. The icon circle also renders when `icon` is absent, on
          purpose, to keep every title's left edge aligned.
        via: prop TrustFact.icon
      - note: >-
          `title` is capped at `max-w-[440px]` and `lede` at `max-w-[430px]`,
          and the glow is absolutely positioned inside the left cell only.
          Long copy will not fill the column, and the bloom never reaches the
          facts panel.
        via: prop TrustPanel.title
    notFor:
      - instead: FeatureRow
        why: >-
          A generic two-column band. Its polarity is fixed cream; for a dark
          band with copy on one side use `FeatureRow`, and for a cream one
          whose second track is a visual use `LightSectionCard` (its `visual`
          slot is what the facts column is not — the right track here is a
          `<ul>`).
      - instead: ComparisonTable
        why: >-
          Comparing facts across options. The facts are a single stack of
          peers with no column axis; that is `ComparisonTable`.
      - instead: GlyphBadge
        why: >-
          The 38px disc on its own, without the rule, the 22px rhythm and the
          qualifier slot a fact row brings. `TrustFact` composes `GlyphBadge`
          at its defaults, so a row that only wants the circle — at 38px or at
          32 — should take the badge directly.
    sameAs: [sections/glyph-badge#GlyphBadge]
  sections/value-cards:
    import: "@skene/design-system/sections/value-cards"
    exports: [ValueCards, ValueCard]
    polarity: inherits
    seen: [section-value-cards]
    overrides: [style, className]
    props:
      ValueCards:
        children: { type: React.ReactNode, required: true }
      ValueCard:
        label: { type: React.ReactNode }
        title: { type: React.ReactNode, required: true }
        tone: { type: ValueTone, default: "'cost'" }
        children: { type: React.ReactNode }
    useFor: >-
      A responsive card band whose argument is carried by tone rather than by
      copy: N cards stating what the current situation costs, then one stating
      what it becomes. `ValueCard` takes a mono `label`, a `title` line and an
      optional body, and the `tone` union (`'cost' | 'gain'`) is the only
      thing that moves — `cost` borrows `semantic.errorRed` for the label and
      a neutral 14% hairline, `gain` takes `brand.peach` with a 34% border and
      a left-to-right directional wash so the last card reads as an arrival
      rather than one more tile. It exists so a band can make a turn; a row of
      identically-weighted cards degrades into a feature list and says
      nothing.
    alsoFor:
      - claim: >-
          Any before/after or problem/payoff band: `label` is free text, so
          "BEFORE"/"AFTER", "TODAY"/"WITH SKENE", "MANUAL"/"AUTOMATED" all
          work with no code change — only `tone` decides the colour.
        via: prop ValueCard.label
      - claim: >-
          A risk or defect summary where every card is a `cost`: `tone`
          defaults to `'cost'`, so a stack of audit findings needs only
          `label` + `title` + body. (For a measured, instrumented state use
          `Finding` instead — see notFor.)
        via: "default tone='cost'"
      - claim: >-
          A plain neutral card grid: omit `label` entirely and leave `tone` at
          its default. With no label there is no accent on screen at all — you
          get a 14px-radius card, a 1.8% wash and a near-invisible hairline,
          i.e. a generic content card.
        via: prop ValueCard.label
      - claim: >-
          `ValueCards` on its own as a bare auto-fit grid wrapper. `children`
          is typed `React.ReactNode`, not `ValueCard[]`, so it will lay out
          any children at `repeat(auto-fit,minmax(240px,1fr))` from `md` up,
          single column below.
        via: export ValueCards
      - claim: >-
          A three-tier emphasis band, by mixing labelled `cost` cards with
          unlabelled default cards and one `gain` — no third tone needed,
          because the label's presence is itself an axis.
        via: prop ValueCard.label
      - claim: >-
          A row of labelled flat peers: `tone="neutral"` keeps the mono kicker
          but takes `text.muted` for it and claims neither a defect nor a
          payoff — three use-case cards can carry labels without any of them
          reading as a cost, and mixing one `gain` back in restores the turn.
        via: prop ValueCard.tone
    watchFor:
      - note: >-
          `tone` defaults to `'cost'`. That is deliberate (costs are the
          majority of the band) but it means a forgotten `tone` renders a red
          label, not a neutral one.
        via: "default tone='cost'"
      - note: >-
          The accent lands via inline `style={{ color: accent }}` on the label
          and inline `borderColor`/`backgroundImage` on the `<article>`. A
          `text-*` or `border-*` utility passed through `className` will not
          win against those; to retint, add a tone member to `TONE_ACCENT`
          rather than fighting it from the call site.
        via: prop ValueCard.label
      - note: >-
          `ValueCards` deliberately carries no `light`/`dark` class —
          everything is derived from the mode-aware `text.primary` and
          `brand.peach`, so it inherits polarity. Per rule 2 in
          docs/sections.md, a caller putting this band on a cream panel inside
          a dark page still owes that panel its own `light` class, or the 1.8%
          wash and the hairline resolve to their dark values against cream.
        via: export ValueCards
      - note: >-
          The `gain` wash is directional — `linear-gradient(90deg, …,
          transparent 62%)` — and knows nothing about position. It always
          enters from the left edge, which reads as arrival only when the gain
          card is last in the row; below `md` the grid stacks to one column
          and the horizontal gradient stops doing any sequencing work at all.
        via: inline style
      - note: >-
          `ValueCard` renders an `<article>` whose title is a `<strong>`, not
          a heading. The cards therefore never appear in the document outline.
          `title` is `React.ReactNode`, so pass your own `<h3>` if these need
          to be navigable.
        via: export ValueCard
    notFor:
      - instead: QuestionGrid
        why: >-
          A row of equal-weight peers (a feature list, a set of capabilities).
          The whole point of the component is the tonal turn; used flat it is
          a worse plain card grid than `QuestionGrid` or `FeatureRow`.
      - instead: Finding
        why: >-
          Signalling a measured state. The `good | warn | danger` vocabulary
          bound to `semantic.matcha / warningAmber / errorRed` means an
          observed fact — that is `Finding` (or `ui/badge` on a product
          surface). `ValueCard`'s `cost` borrows `errorRed` for a marketing
          claim, and using it for real status teaches the reader that red
          means two different things.
    sameAs: [sections/question-grid#QuestionCard]
assets:
  journeyField:
    import: "import { assetUrls } from '@skene/design-system/asset-urls'"
