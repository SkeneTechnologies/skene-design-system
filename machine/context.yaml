    useFor: >-
      The field behind schema, connection and key artifacts. SectionBackdrop
      texture="schema", or ArtFrame kind="db".
    notFor: >-
      See githubField. The pairing follows the live site so the same backdrop
      always sits behind the same kind of artifact.
  integrationsField:
    import: "import { assetUrls } from '@skene/design-system/asset-urls'"
    file: assets/plugin.png
    bytes: 4423812
    kind: texture
    usedBy: [sections/card-animation-integrations, sections/integrations-highlight]
    is: >-
      Texture behind the integrations card animation. `plugin.png`.
    useFor: >-
      The field behind the integrations card animation.
      CardAnimationIntegrations and IntegrationsHighlight load it by default,
