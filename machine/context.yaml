    kind: texture
    usedBy: [sections/artifact-shell, sections/section-backdrop]
    is: >-
      Halftone field for journeys, funnels, measurement. `card1_bg.webp`.
    useFor: >-
      The halftone field behind a journey, funnel or measurement artifact.
      Pass it as SectionBackdrop texture="journey", or let ArtFrame kind="jr"
      load it.
    notFor: >-
      A page background. It is a field a panel floats ON, insetting its child
      by a percentage — used full-bleed it reads as noise behind body copy.
