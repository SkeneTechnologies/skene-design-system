    import: "import { assetUrls } from '@skene/design-system/asset-urls'"
    file: assets/dither-subpage.webp
    bytes: 79174
    kind: texture
    usedBy: [sections/section-backdrop]
    is: >-
      The halftone laid over media, and the subpage header ground.
    useFor: >-
      Two jobs: the halftone laid over video or photography inside
      DitheredMedia, and the ground of a subpage header via HeroBackdrop.
      Every subpage in skene-site uses the second at imageOpacity 0.72.
    notFor: >-
      A texture behind an artifact — that is the three card fields. This one
      is a treatment applied OVER media, not a field placed under a panel.
