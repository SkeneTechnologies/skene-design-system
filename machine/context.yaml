    import: "import { assetUrls } from '@skene/design-system/asset-urls'"
    file: assets/card2_bg.webp
    bytes: 185736
    kind: texture
    usedBy: [sections/artifact-shell, sections/section-backdrop]
    is: >-
      Halftone field for GitHub, PRs, editor chrome. `card2_bg.webp`.
    useFor: >-
      The field behind GitHub, pull-request and editor-chrome artifacts.
      SectionBackdrop texture="github", or ArtFrame kind="gh".
    notFor: >-
      Anything that is not about code review. The three fields are a fixed
      pairing with the artifact they sit behind, not three interchangeable
      decorations.
  schemaField:
