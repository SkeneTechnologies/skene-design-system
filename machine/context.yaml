    notFor: >-
      A SectionBackdrop texture — it is not one of the three card fields, and
      at 4.4MB it is the heaviest file in the package. Reach for it only
      through the animation that ships it.
  pixelField:
    import: "import { assetUrls } from '@skene/design-system/asset-urls'"
    file: assets/pixel-bg.webp
    bytes: 146850
    kind: texture
    usedBy: [sections/final-cta]
    is: >-
      The closing-CTA backdrop. `pixel-bg.webp`.
    useFor: >-
      The closing-CTA backdrop, and only that. FinalCta loads it by default,
      so a caller passing backdrop is usually re-specifying what it already
      does.
    notFor: >-
      A section backdrop. It is weighted for full-bleed type at the foot of a
      page, not for a panel inset.
